          const user = this.usersList.find(u => u.id === this.selectedUserKey);
          if (user) await this.fetchFromCloud(true);
          if (user && await this.checkPass(user, this.inputPassword)) {
            if (user.role === 'student') {
              const n = this.studentName.trim();
              if (!n) return;
              localStorage.setItem('lancaster_student_name', n);
              this.currentUser = { ...user, name: n };
            } else {
              this.currentUser = user;
            }
            this.authError = false;
            localStorage.setItem('lancaster_user_id', user.id);
            this.fetchFromCloud();
            this.checkUpcomingBookings();
          } else {
            this.authError = true;
          }
        },

        logout() {
          this.currentUser = null;
          this.selectedUserKey = '';
          this.inputPassword = '';
          localStorage.removeItem('lancaster_user_id');
        },

        // VALIDACIÓN DE PERMISO EDITAR/BORRAR
        canEditOrDelete(item) {
          if (!this.currentUser) return false;
          if (this.currentUser.role === 'student') return this.ownsIA(item);
          // Si es laboratorista (admin), puede modificar cualquier práctica
          if (this.currentUser.role === 'admin') return true;
          // Si es profesor, solo puede modificar sus propias prácticas
          return item.teacher === this.currentUser.name;
        },

        getSubjectColorClass(subject) {
          switch(subject) {
            case 'Biología': return 'text-emerald-600 font-black';
            case 'Física': return 'text-sky-600 font-black';
            case 'Química': return 'text-orange-500 font-black';
            case 'Ciencias Integradas': return 'text-amber-500 font-black';
            default: return 'text-brand-700 font-black';
          }
        },

        get upcomingBookingsList() {
          const base = new Date(this.nowTick || Date.now());
          const ds = n => { const d = new Date(base); d.setDate(d.getDate() + n); return this.localStr(d); };
          if (this.currentUser && this.currentUser.role === 'admin') {
            const days = [ds(1), ds(2)];
            return this.bookings.filter(b => days.includes(b.date));
          }
          const days = [ds(0), ds(1)];
          return this.bookings.filter(b => days.includes(b.date) && this.isMine(b));
        },

        get upcomingBookingsCount() {
          return this.upcomingBookingsList.length;
        },

        checkUpcomingBookings() {
          const list = this.upcomingBookingsList;
          if (!list.length) return;
          const admin = this.currentUser.role === 'admin';
          const base = new Date(), rel = ['Hoy', 'Mañana', 'Pasado mañana'];
          const byDate = {};
          list.forEach(b => (byDate[b.date] = byDate[b.date] || []).push(b));
          let html = '<div style="text-align:left;font-size:15px">';
          Object.keys(byDate).sort().forEach(d => {
            const diff = Math.round((new Date(d + 'T00:00:00') - new Date(this.localStr(base) + 'T00:00:00')) / 864e5);
            html += `<div style="margin:10px 0 4px;font-weight:800;color:#9f1239">${rel[diff] || ''} · ${this.formatDisplayDate(d)} (${byDate[d].length})</div>`;
            byDate[d].sort((a, b) => parseInt(a.startPeriod) - parseInt(b.startPeriod)).forEach(b => {
              html += `<div style="padding:6px 8px;margin:3px 0;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px"><b>P${b.startPeriod}${b.durationPeriods > 1 ? '-' + (parseInt(b.startPeriod) + parseInt(b.durationPeriods) - 1) : ''} · ${this.esc(this.getDisplaySpace(b))}</b> — ${this.esc(b.practiceName || b.subject)}<br><span style="color:#475569">${this.esc(b.teacher)}${b.group ? ' · Grupo ' + this.esc(b.group) : ''}${b.grade ? ' · ' + this.esc(b.grade) : ''}${b.needsFreshMaterial ? ' · 🌿 material fresco' : ''}${b.isIA ? ' · IA ' + this.esc(b.studentName) : ''}</span></div>`;
            });
          });
          html += '</div>';
          Swal.fire({ title: admin ? '🔔 Resumen: mañana y pasado mañana' : '🔔 Tus prácticas próximas', html, icon: 'info', confirmButtonText: 'Entendido', width: 560 });
        },

        showUpcomingAlertManual() {
          if (this.upcomingBookingsList.length === 0) {
            Swal.fire({ title: 'Sin prácticas próximas', text: this.currentUser.role === 'admin' ? 'No hay prácticas para mañana ni para pasado mañana.' : 'No tienes prácticas hoy ni mañana.', icon: 'info' });
          } else {
            this.checkUpcomingBookings();
          }
        },

        async fetchFromCloud(silent = false) {
          if (!silent) this.isLoading = true;
          try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${this.binId}/latest`, {
              method: 'GET',
              headers: { 'X-Master-Key': this.masterKey }
            });
            if (res.ok) {
              const json = await res.json();
              const rec = json.record;
              if (Array.isArray(rec)) {
                this.bookings = rec;
              } else if (rec && typeof rec === 'object') {
                this.bookings = rec.bookings || [];
                this.inventory = this.buildInventory(rec);
                this.profiles = rec.profiles || {};
              } else {
                this.bookings = [];
              }
            }
          } catch (e) {
            console.error('Error al sincronizar:', e);
          } finally {
            this.isLoading = false;
          }
        },

        async saveToCloud() {
          this.isLoading = true;
          try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${this.binId}`, {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': this.masterKey
              },
              body: JSON.stringify({ bookings: this.bookings, invDelta: this.makeInvDelta(), profiles: this.profiles })
            });
            if (!res.ok) throw new Error('Error al guardar');
          } catch (e) {
            console.error(e);
            Swal.fire({
              icon: 'error',
              title: 'Error de conexión',
              text: 'No se pudieron sincronizar los cambios en la nube.'
            });
          } finally {
            this.isLoading = false;
          }
        },

        get sortedListBookings() {
          return [...this.filteredListBookings].sort((a, b) => (a.createdAt || a.id) - (b.createdAt || b.id));
        },

        formatCreatedAt(ts) {
          if (!ts) return 'N/A';
          const d = new Date(ts);
          return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        },

        handleFileUpload(event) {
          const file = event.target.files[0];
          if (!file) return;
          if (file.size > 3 * 1024 * 1024) {
            Swal.fire('Archivo muy grande', 'El archivo no debe exceder 3MB.', 'warning');
            return;
          }
          const reader = new FileReader();
          reader.onload = (e) => {
            this.formData.fileData = e.target.result;
            this.formData.fileName = file.name;
          };
          reader.readAsDataURL(file);
        },

        getTeacherColor(teacherName) {
          if (!teacherName) return '#64748b';
          let hash = 0;
          for (let i = 0; i < teacherName.length; i++) {
            hash = teacherName.charCodeAt(i) + ((hash << 5) - hash);
          }
          const index = Math.abs(hash) % this.teacherPalette.length;
          return this.teacherPalette[index];
        },

        getDisplaySpace(item) {
          if (item.labType === 'Salón de clases') {
            return item.classroomNumber ? item.classroomNumber : 'Salón de clases';
          }
          return item.labType;
        },

        getLabStyle(labName) {
          switch(labName) {
            case 'Laboratorio 26': return 'border-l-4 border-l-purple-600';
            case 'Laboratorio 27': return 'border-l-4 border-l-sky-600';
            case 'Laboratorio 28': return 'border-l-4 border-l-emerald-600';
            case 'Laboratorio 29': return 'border-l-4 border-l-amber-600';
            case 'Laboratorio 30': return 'border-l-4 border-l-rose-600';
            case 'Salón de clases': return 'border-l-4 border-l-slate-600';
            default: return 'border-l-4 border-l-slate-400';
          }
        },

        getLabBadgeStyle(labName) {
          switch(labName) {
            case 'Laboratorio 26': return 'bg-purple-50 text-purple-800 border-purple-200';
            case 'Laboratorio 27': return 'bg-sky-50 text-sky-800 border-sky-200';
            case 'Laboratorio 28': return 'bg-emerald-50 text-emerald-800 border-emerald-200';
            case 'Laboratorio 29': return 'bg-amber-50 text-amber-800 border-amber-200';
            case 'Laboratorio 30': return 'bg-rose-50 text-rose-800 border-rose-200';
            case 'Salón de clases': return 'bg-slate-100 text-slate-800 border-slate-300';
            default: return 'bg-slate-100 text-slate-800';
          }
        },

        addFreshMaterialRow() {
          if (!this.formData.freshMaterialsList) {
            this.formData.freshMaterialsList = [];
          }
          this.formData.freshMaterialsList.push({ name: '', quantity: '' });
        },

        removeFreshMaterialRow(index) {
          if (this.formData.freshMaterialsList.length > 1) {
            this.formData.freshMaterialsList.splice(index, 1);
          }
        },

        addReagentRow() {
          this.formData.reagentsList.push({ name: '', concentration: '', volume: '' });
        },

        removeReagentRow(index) {
          this.formData.reagentsList.splice(index, 1);
        },

        addMaterialRow() {
          this.formData.materialsList.push({ name: '', quantity: '' });
        },

        removeMaterialRow(index) {
          if (this.formData.materialsList.length > 1) {
            this.formData.materialsList.splice(index, 1);
          }
        },

        get profileKey() {
          const u = this.currentUser;
          if (!u) return '';
          return u.role === 'student' ? 'alumno:' + u.name.trim().toLowerCase() : u.id;
        },

        get myProfile() { return this.profiles[this.profileKey] || {}; },

        get initials() {
          return (this.currentUser?.name || '?').split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
        },

        setProfile(patch) {
          this.profiles = { ...this.profiles, [this.profileKey]: { ...this.myProfile, ...patch } };
        },

        openProfile() {
          this.profileTab = 'datos';
          this.pw = { current: '', next: '', confirm: '' };
          this.scheduleOwner = this.profileKey;
          this.loadSchedule();
          this.isProfileOpen = true;
        },

        loadSchedule() {
          this.scheduleDraft = { ...((this.profiles[this.scheduleOwner] || {}).schedule || {}) };
        },

        async saveSchedule() {
          this.setProfile({ schedule: { ...this.scheduleDraft } });
          await this.saveToCloud();
          Swal.fire({ icon: 'success', title: 'Horario guardado', timer: 1500, showConfirmButton: false });
        },

        handlePhoto(e) {
          const f = e.target.files[0];
          if (!f) return;
          const reader = new FileReader();
          reader.onload = ev => {
            const img = new Image();
            img.onload = async () => {
              const c = document.createElement('canvas');
              c.width = c.height = 160;
              const m = Math.min(img.width, img.height);
              c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, 160, 160);
              this.setProfile({ photo: c.toDataURL('image/jpeg', 0.8) });
              await this.saveToCloud();
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(f);
          e.target.value = '';
        },

        async removePhoto() {
          this.setProfile({ photo: null });
          await this.saveToCloud();
        },

        async hashPass(t) {
          if (window.crypto && crypto.subtle) {
            const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('lancaster:' + t));
            return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
          }
          return 'p:' + t;
        },

        async checkPass(user, input) {
          const pr = this.profiles[user.id];
          if (pr && pr.pwHash) return pr.pwHash === await this.hashPass(input);
          return user.pass === input;
        },

        async changePassword() {
          if (!(await this.checkPass(this.currentUser, this.pw.current))) { Swal.fire('Contraseña incorrecta', 'La contraseña actual no coincide.', 'error'); return; }
          if (this.pw.next.length < 6) { Swal.fire('Muy corta', 'La nueva contraseña debe tener al menos 6 caracteres.', 'warning'); return; }
          if (this.pw.next !== this.pw.confirm) { Swal.fire('No coinciden', 'La confirmación no coincide con la nueva contraseña.', 'warning'); return; }
          this.setProfile({ pwHash: await this.hashPass(this.pw.next) });
          await this.saveToCloud();
          this.pw = { current: '', next: '', confirm: '' };
          Swal.fire({ icon: 'success', title: 'Contraseña actualizada', timer: 1800, showConfirmButton: false });
        },

isMine(b) {
          const u = this.currentUser;
          if (!u) return false;
          if (u.role === 'student') return this.ownsIA(b);
          return b.teacher === u.name;
        },

        get mySections() {
          const t = this.localStr(new Date());
          const mine = this.bookings.filter(b => this.isMine(b));
          const key = b => b.date + String(b.startPeriod).padStart(2, '0');
          return [
            { title: 'Próximas', items: mine.filter(b => b.date >= t).sort((a, b) => key(a).localeCompare(key(b))) },
            { title: 'Anteriores', items: mine.filter(b => b.date < t).sort((a, b) => key(b).localeCompare(key(a))) }
          ];
        },

        shiftDay(n) {
          const d = new Date(this.dayDate + 'T00:00:00');
          d.setDate(d.getDate() + n);
          this.dayDate = this.localStr(d);
        },

        get dayTotal() { return this.bookings.filter(b => b.date === this.dayDate).length; },

        get dayPeriods() {
          const out = [];
          for (let p = 1; p <= 8; p++) {
            const m = {};
            this.bookings.filter(b => b.date === this.dayDate && p >= parseInt(b.startPeriod) && p <= parseInt(b.startPeriod) + parseInt(b.durationPeriods) - 1).forEach(b => {
              const n = this.getDisplaySpace(b);
              (m[n] = m[n] || { name: n, labType: b.labType, items: [] }).items.push(b);
            });
            out.push({ p, spaces: Object.values(m).sort((a, b) => a.name.localeCompare(b.name, 'es', { numeric: true })) });
          }
          return out;
        },

        printDay() {
          this.printDate = this.dayDate;
          this.reportType = 'Diario';
          this.triggerPrintReport();
        },

        syncSession() {
          const f = (this.formData.sessions || []).find(x => x.date) || (this.formData.sessions || [])[0] || {};
          this.formData.date = f.date || '';
          this.formData.startPeriod = f.startPeriod || '1';
          this.formData.durationPeriods = f.durationPeriods || '1';
          this.validateRules();
        },

        norm(t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); },

        ownsIA(item) {
          if (!item || !item.isIA || !this.currentUser) return false;
          return [item.ownerName, item.studentName].some(n => this.norm(n) === this.norm(this.currentUser.name));
        },

        toMin(t) { const a = t.split(':'); return +a[0] * 60 + +a[1]; },

isUnchangedSlot(x) {
          const o = this.editingBookingId ? this.bookings.find(b => b.id === this.editingBookingId) : null;
          return !!o && o.date === x.date && String(o.startPeriod) === String(x.startPeriod);
        },

        periodRange(p) { const t = PERIOD_TIMES[(parseInt(p) || 1) - 1] || PERIOD_TIMES[0]; return t[0] + ' - ' + t[1]; },

        periodStart(p) { return (PERIOD_TIMES[(parseInt(p) || 1) - 1] || PERIOD_TIMES[0])[0]; },

        evalRules(dateStr, startPeriod) {
          const now = new Date();
          const target = new Date(dateStr + 'T00:00:00');
          const m = this.toMin(this.periodStart(startPeriod));
          target.setHours(Math.floor(m / 60), m % 60);
          const messages = [];
          let isExtemp = false, deadlineText = '';
          const hours = (target - now) / 36e5;
          const blocked = hours < 24;
          if (hours < 48) { isExtemp = true; messages.push('se agendó con menos de 48 horas de anticipación'); }
          if (this.formData.needsFreshMaterial) {
            const d = new Date(dateStr + 'T00:00:00');
            const wed = new Date(d);
            wed.setDate(d.getDate() - ((d.getDay() + 6) % 7) - 5);
            wed.setHours(12, 0, 0, 0);
            deadlineText = wed.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }) + ' a las 12:00 PM';
            if (now > wed) { isExtemp = true; messages.push('el material fresco debía pedirse el ' + deadlineText); }
          }
          return { isExtemp, messages, deadlineText, blocked };
        },

        get liveBanner() {
          const now = new Date(this.nowTick), mins = now.getHours() * 60 + now.getMinutes();
          const today = this.localStr(now);
          let cur = null, next = null, toNext = null;
          PERIOD_TIMES.forEach((t, i) => {
            const a = this.toMin(t[0]), b = this.toMin(t[1]);
            if (mins >= a && mins < b) cur = i + 1;
            else if (a > mins && next === null) { next = i + 1; toNext = a - mins; }
          });
          const at = p => this.bookings.filter(b => b.date === today && p >= parseInt(b.startPeriod) && p <= parseInt(b.startPeriod) + parseInt(b.durationPeriods) - 1);
          return { today, cur, next, toNext, curItems: cur ? at(cur) : [], nextItems: next ? this.bookings.filter(b => b.date === today && parseInt(b.startPeriod) === next) : [] };
        },

        periodTag(p) {
          const L = this.liveBanner;
          if (this.dayDate !== L.today) return { cls: '', label: '' };
          if (L.cur === p) return { cls: 'bg-emerald-100 text-emerald-900', label: ' · AHORA' };
          if (L.next === p) return { cls: 'bg-amber-100 text-amber-900', label: ' · SIGUIENTE (en ' + L.toNext + ' min)' };
          return { cls: '', label: '' };
        },

        notifyNext() {
          if (!this.currentUser || this.currentUser.role !== 'admin') return;
          const L = this.liveBanner;
          if (!L.next || L.toNext > 10 || !L.nextItems.length) return;
          const key = L.today + '-' + L.next;
          if (this.lastNotified === key) return;
          this.lastNotified = key;
          Swal.fire({ toast: true, position: 'top-end', icon: 'info', timer: 9000, showConfirmButton: false, title: 'Periodo ' + L.next + ' en ' + L.toNext + ' min', text: L.nextItems.map(b => this.getDisplaySpace(b) + ': ' + (b.practiceName || b.subject)).join(' | ') });
        },

        showFull() { return !this.isStudent || (!!this.selectedBooking && this.canEditOrDelete(this.selectedBooking)); },

        get isStudent() { return this.currentUser?.role === 'student'; },

        localStr(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); },

        get focusDateObj() { return new Date(this.focusDate + 'T00:00:00'); },

        get currentWeekStartDate() {
          const d = this.focusDateObj;
          d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
          return d;
        },

        get visibleDays() {
          if (this.calendarMode !== 'day') return this.weekDays;
          const d = this.focusDateObj;
          return [{ dayName: d.toLocaleDateString('es-ES', { weekday: 'long' }), dateStr: this.focusDate, formattedDate: d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }), isToday: this.focusDate === this.localStr(new Date()) }];
        },

        get monthCells() {
          const f = this.focusDateObj, y = f.getFullYear(), m = f.getMonth();
          const last = new Date(y, m + 1, 0), cur = new Date(y, m, 1);
          cur.setDate(cur.getDate() - ((cur.getDay() + 6) % 7));
          const today = this.localStr(new Date()), cells = [];
          while (cur <= last) {
            for (let i = 0; i < 6; i++) {
              const d = new Date(cur); d.setDate(d.getDate() + i);
              const s = this.localStr(d);
              cells.push({ key: s, dateStr: s, day: d.getDate(), inMonth: d.getMonth() === m, isToday: s === today,
                items: this.bookings.filter(b => b.date === s && (this.selectedLabFilter === 'ALL' || b.labType === this.selectedLabFilter)) });
            }
            cur.setDate(cur.getDate() + 7);
          }
          return cells;
        },

        get weekDays() {
          const days = [];
          const start = this.currentWeekStartDate;
          const todayStr = this.localStr(new Date());
          const dayNames = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

          for (let i = 0; i < 6; i++) {
            const d = new Date(start);
            d.setDate(d.getDate() + i);
            const dateStr = this.localStr(d);
            days.push({
              dayName: dayNames[i],
              dateStr: dateStr,
              formattedDate: d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }),
              isToday: dateStr === todayStr
            });
          }
          return days;
        },

        get weekRangeText() {
          if (this.calendarMode === 'day') return this.focusDateObj.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
          if (this.calendarMode === 'month') return this.focusDateObj.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
          const start = this.currentWeekStartDate, end = new Date(start);
          end.setDate(end.getDate() + 5);
          return `${start.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })} - ${end.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' })}`;
        },

        navigate(offset) {
          const d = this.focusDateObj;
          if (this.calendarMode === 'day') d.setDate(d.getDate() + offset);
          else if (this.calendarMode === 'week') d.setDate(d.getDate() + offset * 7);
          else { d.setDate(1); d.setMonth(d.getMonth() + offset); }
          this.focusDate = this.localStr(d);
        },

        goToday() { this.focusDate = this.localStr(new Date()); },

        openDay(dateStr) { this.focusDate = dateStr; this.calendarMode = 'day'; },

        getBookingsForSlot(dateStr, period) {
          return this.bookings.filter(b => {
            if (b.date !== dateStr) return false;
            if (this.selectedLabFilter !== 'ALL' && b.labType !== this.selectedLabFilter) return false;
            const startP = parseInt(b.startPeriod);
            const durP = parseInt(b.durationPeriods);
            const endP = startP + durP - 1;
            return period >= startP && period <= endP;
          });
        },

        get filteredListBookings() {
          const okLab = b => this.selectedLabFilter === 'ALL' || b.labType === this.selectedLabFilter;
          if (this.calendarMode === 'month') return this.bookings.filter(b => b.date.startsWith(this.focusDate.slice(0, 7)) && okLab(b));
          const days = this.visibleDays.map(d => d.dateStr);
          return this.bookings.filter(b => days.includes(b.date) && okLab(b));
        },

        validateRules() {
          const list = this.editingBookingId ? [{ date: this.formData.date, startPeriod: this.formData.startPeriod }] : (this.formData.sessions || []).filter(x => x.date);
          if (!list.length || !list[0].date) {
            this.validationMessage = { isValid: false, text: 'Seleccione una fecha para la práctica.' };
            return;
          }
          const bad = [], tooLate = [];
          let deadline = '';
          list.forEach(x => {
            const r = this.evalRules(x.date, x.startPeriod);
            if (r.blocked && !this.isUnchangedSlot(x)) tooLate.push(this.formatDisplayDate(x.date) + ' · Periodo ' + x.startPeriod);
            deadline = r.deadlineText || deadline;
            if (r.isExtemp) bad.push(this.formatDisplayDate(x.date) + ' (' + r.messages.join('; ') + ')');
          });
          this.formData.isExtemp = bad.length > 0;

        async submitForm() {
          const cleanMaterials = this.formData.materialsList.filter(m => m.name.trim() !== '');
          const cleanReagents = this.formData.reagentsList.filter(r => r.name.trim() !== '');
          const cleanFresh = this.formData.freshMaterialsList ? this.formData.freshMaterialsList.filter(f => f.name.trim() !== '') : [];
          this.formData.stationeryList = (this.formData.stationeryList || []).filter(x => x.name.trim() !== '');
          if (this.formData.groupFormat !== 'Equipos') this.formData.teamsCount = '';

          const editing = !!this.editingBookingId;
          let sess;
          if (editing) {
            sess = [{ date: this.formData.date, startPeriod: this.formData.startPeriod, durationPeriods: this.formData.durationPeriods }];
          } else {
            sess = (this.formData.sessions || []).filter(x => x.date);
            if (!sess.length) { Swal.fire('Falta la fecha', 'Agrega al menos una fecha.', 'warning'); return; }
            if (this.isStudent && !this.formData.teacher) { Swal.fire('Falta el profesor', 'Selecciona al profesor que supervisa tu IA.', 'warning'); return; }
            if (sess.some(x => x.labType === 'Salón de clases' && !(x.classroomNumber || '').trim())) { Swal.fire('Falta el salón', 'Indica el número o nombre del salón.', 'warning'); return; }
          }

          const { sessions, ...base } = this.formData;
          const late = sess.filter(x => this.evalRules(x.date, x.startPeriod).blocked && !this.isUnchangedSlot(x));
          if (late.length) {
            Swal.fire({ icon: 'error', title: 'Fuera del plazo', html: 'Las prácticas deben agendarse con al menos 24 horas de anticipación:<br><b>' + late.map(x => this.formatDisplayDate(x.date) + ' · Periodo ' + x.startPeriod).join('<br>') + '</b>' });
            return;
          }
          const oldB = editing ? this.bookings.find(b => b.id === this.editingBookingId) : null;
          const oldU = oldB ? this.invUsage(oldB.materialsList, oldB.reagentsList) : {};
          const newU = this.invUsage(cleanMaterials, cleanReagents);

          const check = (x, id) => {
            const slot = [x.date, x.startPeriod, x.durationPeriods, id], out = [];
            for (const [iid, q] of Object.entries(newU)) {
              const it = this.inventory.find(v => v.id === iid);
              if (!it) continue;
              const avail = this.availFor(iid, ...slot);
              if (q > avail) {
                const h = it.kind === 'equipo' ? this.holders(iid, ...slot).map(v => `${this.esc(v.who)} (${v.q})`).join(', ') : '';
                out.push(`• <b>${this.esc(it.name)}</b>: pides ${q}, disponibles ${Math.max(avail, 0)} de ${it.stock} ${this.esc(it.unit)}${h ? '. Ya reservado por: ' + h : ''}`);
              }
            }
            return out;
          };
          const fail = (pr, x) => Swal.fire({ icon: 'warning', title: 'Existencias insuficientes', html: '<div style="text-align:left;font-size:15px"><b>' + this.formatDisplayDate(x.date) + ' · Periodo ' + x.startPeriod + '</b><br>' + pr.join('<br>') + '<br><br>Reduce la cantidad o cambia de fecha/periodo.</div>' });
          const full = (x, id, extra) => ({ ...base, ...extra, id, date: x.date, startPeriod: x.startPeriod, durationPeriods: x.durationPeriods, materialsList: cleanMaterials, reagentsList: cleanReagents, freshMaterialsList: cleanFresh, isExtemp: this.evalRules(x.date, x.startPeriod).isExtemp, status: 'Aprobada' });

          const made = [];
          if (editing) {
            const pr = check(sess[0], this.editingBookingId);
            if (pr.length) { fail(pr, sess[0]); return; }
            const idx = this.bookings.findIndex(b => b.id === this.editingBookingId);
            if (idx !== -1) { this.applyUsage(oldU, -1); this.applyUsage(newU, 1); this.bookings[idx] = full(sess[0], this.editingBookingId, {}); }
          } else {
            const gid = Date.now();
            for (let i = 0; i < sess.length; i++) {
              const x = sess[i], id = gid + i;
              const pr = check(x, id);
              if (pr.length) {
                made.forEach(() => this.applyUsage(newU, -1));
                this.bookings = this.bookings.filter(b => !made.some(m => m.id === b.id));
                fail(pr, x); return;
              }
              const b = full(x, id, { createdAt: id, iaGroupId: gid, labType: x.labType, classroomNumber: x.labType === 'Salón de clases' ? x.classroomNumber : '', group: x.group || '' });
              this.bookings.push(b); this.applyUsage(newU, 1); made.push(b);
            }
          }

          await this.saveToCloud();
          this.closeModal();
          Swal.fire({
            icon: 'success',
            title: editing ? '¡Práctica Actualizada!' : (made.length > 1 ? '¡' + made.length + ' fechas agendadas!' : '¡Práctica Agendada!'),
            text: 'Los cambios se guardaron correctamente.',
            confirmColor: '#c8102e'
          });
        },

        onInvPick(item) {
          const inv = this.inventory.find(i => i.label === item.name);
          if (inv) { item.invId = inv.id; item.name = inv.name + (inv.desc ? ' — ' + inv.desc : ''); }
          else if (item.invId) { const cur = this.inventory.find(i => i.id === item.invId); if (!cur || !item.name.startsWith(cur.name)) item.invId = ''; }
        },

        relabel(list) {
          const seen = {};
          list.forEach(i => {
            const l = i.name + (i.desc ? ' — ' + i.desc : '') + (i.loc ? ' · ' + i.loc : '');
            seen[l] = (seen[l] || 0) + 1;
            i.label = seen[l] > 1 ? l + ' #' + seen[l] : l;
          });
          return list;
        },

        buildInventory(rec) {
          const d = (rec && rec.invDelta) || {}, edits = d.edits || {}, gone = new Set(d.removed || []);
          const list = SEED_INV.filter(r => !gone.has(r[0])).map(r => ({ id: r[0], name: r[1], desc: r[2], loc: r[3], cat: r[4], stock: r[5], unit: r[6], min: 0, kind: r[7], ...(edits[r[0]] || {}) }));
          const seen = new Set(list.map(i => i.id));
          (d.custom || []).concat(rec && Array.isArray(rec.inventory) ? rec.inventory : []).forEach(x => {
            if (!seen.has(x.id)) { seen.add(x.id); list.push({ cat: 'Otros', kind: 'equipo', desc: '', loc: '', min: 0, ...x }); }
          });
          return this.relabel(list);
        },

        makeInvDelta() {
          const F = ['name', 'desc', 'loc', 'cat', 'stock', 'unit', 'min', 'kind'];
          const seedMap = new Map(SEED_INV.map(r => [r[0], r]));
          const edits = {}, custom = [], present = new Set();
          this.inventory.forEach(i => {
            present.add(i.id);
            const r = seedMap.get(i.id);
            if (!r) { const o = { id: i.id }; F.forEach(k => o[k] = i[k]); custom.push(o); return; }
            const base = { name: r[1], desc: r[2], loc: r[3], cat: r[4], stock: r[5], unit: r[6], min: 0, kind: r[7] };
            const diff = {};
            F.forEach(k => { if (i[k] !== base[k]) diff[k] = i[k]; });
            if (Object.keys(diff).length) edits[i.id] = diff;
          });
          return { edits, custom, removed: SEED_INV.map(r => r[0]).filter(id => !present.has(id)) };
        },

        // Cantidades solicitadas por artículo del inventario (materiales + reactivos)
        invUsage(mats, reags) {
          const u = {};
          (mats || []).forEach(m => { const q = parseFloat(m.quantity); if (m.invId && q > 0) u[m.invId] = (u[m.invId] || 0) + q; });
          (reags || []).forEach(m => { const q = parseFloat(m.volume); if (m.invId && q > 0) u[m.invId] = (u[m.invId] || 0) + q; });
          return u;
        },

        // Solo los consumibles se descuentan; el equipo se reserva por fecha y periodo
        applyUsage(u, sign) {
          Object.entries(u).forEach(([id, q]) => {
            const it = this.inventory.find(i => i.id === id);
            if (it && it.kind === 'consumible') it.stock = +(it.stock - sign * q).toFixed(3);
          });
        },

        holders(invId, date, start, dur, excludeId) {
          const s0 = parseInt(start), e0 = s0 + parseInt(dur) - 1, out = [];
          this.bookings.forEach(b => {
            if (b.id === excludeId || b.date !== date) return;
            const bs = parseInt(b.startPeriod), be = bs + parseInt(b.durationPeriods) - 1;
            if (bs > e0 || be < s0) return;
            const q = this.invUsage(b.materialsList, [])[invId];
            if (q) out.push({ who: b.teacher, q });
          });
          return out;
        },

        availFor(invId, date, start, dur, excludeId) {
          const it = this.inventory.find(i => i.id === invId);
          if (!it) return Infinity;
          if (it.kind === 'consumible') {
            const old = this.bookings.find(b => b.id === excludeId);
            return it.stock + (old ? (this.invUsage(old.materialsList, old.reagentsList)[invId] || 0) : 0);
          }
          if (!date) return it.stock;
          return it.stock - this.holders(invId, date, start, dur, excludeId).reduce((a, h) => a + h.q, 0);
        },

        rowInfo(item, field) {
          const it = this.inventory.find(i => i.id === item.invId);
          if (!it) return { text: '', bad: false };
          const a = this.availFor(it.id, this.formData.date, this.formData.startPeriod, this.formData.durationPeriods, this.editingBookingId);
          const q = parseFloat(item[field]) || 0;
          return { text: (q > a ? '⚠ ' : '✔ ') + 'Disp. ' + Math.max(a, 0) + '/' + it.stock + ' ' + it.unit, bad: q > a };
        },

        exportCSV() {
          if (this.bookings.length === 0) {
            Swal.fire('Sin datos', 'No hay registros para exportar', 'info');
            return;
          }

          let csvContent = "data:text/csv;charset=utf-8,ID_Orden,Timestamp,Nombre_Practica,Ubicacion,Profesor,Laboratorista,Materia,Fecha,Periodo_Inicio,Duracion_Periodos,Alumnos,Formato,Material_Fresco,Extemporanea,Estado\n";
          this.sortedListBookings.forEach(b => {
            const space = b.labType === 'Salón de clases' ? b.classroomNumber : b.labType;
            csvContent += `${b.id},"${this.formatCreatedAt(b.createdAt)}","${b.practiceName || ''}","${space}","${b.teacher}","${b.labTech || ''}","${b.subject}",${b.date},${b.startPeriod},${b.durationPeriods},${b.studentsCount},"${b.groupFormat}",${b.needsFreshMaterial ? 'SI' : 'NO'},${b.isExtemp ? 'SI' : 'NO'},${b.status}\n`;
          });

          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", `bitacora_laboratorios_${new Date().toISOString().split('T')[0]}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }
      };
    }
  </script>
</body>
</html>
