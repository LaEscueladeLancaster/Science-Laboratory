      <div>
        <h2 class="text-xl font-black text-brand-600 uppercase tracking-wide">Iniciar Sesión</h2>
        <p class="text-base text-slate-600 font-medium mt-1">Bitácora de Laboratorios — La Escuela de Lancaster</p>
      </div>

      <!-- Formulario de Selección de Usuario y Clave -->
      <form @submit.prevent="login()" class="space-y-4 text-left">
        <div>
          <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">Usuario / Personal *</label>
          <select x-model="selectedUserKey" required class="w-full text-base font-semibold px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-600 bg-slate-50 text-slate-800">
            <option value="" disabled selected>Selecciona tu nombre...</option>
            <optgroup label="Laboratoristas">
              <template x-for="user in usersList.filter(u => u.role === 'admin')" :key="user.id">
                <option :value="user.id" x-text="user.name + ' (' + user.title + ')'"></option>
              </template>
            </optgroup>
            <optgroup label="Profesores">
              <template x-for="user in usersList.filter(u => u.role === 'teacher')" :key="user.id">
                <option :value="user.id" x-text="user.name + ' (' + user.title + ')'"></option>
              </template>
            </optgroup>
            <optgroup label="Alumnos">
              <option value="alumnos">Alumnos (acceso general)</option>
            </optgroup>
          </select>
        </div>

        <div x-show="selectedUserKey === 'alumnos'" x-cloak class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">Correo institucional *</label>
            <input type="email" x-model="studentEmail" :required="selectedUserKey === 'alumnos'" placeholder="nombre.apellido@lancaster.edu.mx" autocomplete="email" class="w-full text-base font-semibold px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-600 bg-slate-50 text-slate-800">
            <p x-show="registeredStudent" class="text-sm font-bold text-emerald-700 mt-1.5" x-text="'Hola, ' + (registeredStudent && registeredStudent.name)"></p>
          </div>
          <div x-show="studentIsNew">
            <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">Tu nombre completo * <span class="normal-case font-semibold text-slate-400">(solo la primera vez)</span></label>
            <input type="text" x-model="studentName" :required="selectedUserKey === 'alumnos' && studentIsNew" placeholder="Nombre y apellido" class="w-full text-base font-semibold px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-600 bg-slate-50 text-slate-800">
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">Contraseña *</label>
          <div class="relative">
            <input :type="showPassword ? 'text' : 'password'" x-model="inputPassword" required placeholder="Ingresa tu clave" class="w-full text-base font-semibold px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-600 bg-slate-50 text-slate-800">
            <button type="button" @click="showPassword = !showPassword" class="absolute right-3 top-3.5 text-slate-400 hover:text-slate-600">
              <i class="ph text-xl" :class="showPassword ? 'ph-eye-slash' : 'ph-eye'"></i>
            </button>
          </div>
        </div>

        <p x-show="authError" class="text-sm font-bold text-brand-600 flex items-center gap-1.5" x-cloak>
          <i class="ph ph-warning-circle text-lg"></i> Contraseña incorrecta para el usuario seleccionado.
        </p>

        <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-black text-base rounded-xl transition shadow-md uppercase tracking-wider">
          Ingresar al Sistema
        </button>
        <p class="text-center"><button type="button" @click="forgotPassword()" class="text-sm font-semibold text-slate-500 hover:text-brand-700 underline">¿Olvidaste tu contraseña?</button></p>
      </form>

      <p class="text-xs text-slate-400 font-medium">Uso exclusivo para personal docente y de laboratorio.</p>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <template x-if="currentUser">
    <div class="flex flex-col min-h-screen">
      
      <!-- ENCABEZADO INSTITUCIONAL -->
      <header class="bg-brand-600 text-white shadow-lg sticky top-0 z-30 no-print border-b border-brand-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex flex-wrap justify-between items-center gap-x-4 gap-y-2 min-h-[5rem] py-2">

            <!-- Logo y Datos Institucionales -->

              </div>
              <div class="whitespace-nowrap">
                <h1 class="font-black text-base lg:text-lg 2xl:text-xl text-white leading-tight uppercase tracking-wide">Bitácora de Laboratorios</h1>
                <p class="text-sm xl:text-base text-rose-100/90 font-medium">La Escuela de Lancaster</p>
              </div>
            </div>

            <!-- Identificación del Usuario y Acciones -->
            <div class="flex flex-wrap items-center justify-end gap-2">

              <!-- Perfil -->
              <button @click="openProfile()" class="shrink-0 flex items-center gap-2.5 rounded-xl hover:bg-white/10 px-2 py-1 transition" title="Mi perfil">
                <div class="hidden xl:flex flex-col text-right whitespace-nowrap">
                  <span class="text-sm font-black text-white leading-tight" x-text="currentUser.name"></span>
                  <span class="text-xs font-semibold text-rose-200 leading-tight" x-text="currentUser.role === 'admin' ? 'Laboratorista (Acceso Total)' : (currentUser.role === 'student' ? 'Alumno' : 'Profesor')"></span>
                </div>
                <span class="w-10 h-10 rounded-full overflow-hidden border-2 border-white/60 bg-brand-800 flex items-center justify-center text-sm font-black shrink-0">
                  <img x-show="myProfile.photo" :src="myProfile.photo" class="w-full h-full object-cover" alt="">
                  <span x-show="!myProfile.photo" x-text="initials"></span>
                </span>
              </button>

              <!-- Alerta Próximas -->
              <button @click="showUpcomingAlertManual()" title="Próximas prácticas" class="shrink-0 inline-flex items-center justify-center gap-2 h-11 min-w-[2.75rem] px-3 rounded-lg transition whitespace-nowrap font-bold text-sm 2xl:px-4 2xl:text-base relative bg-brand-700/80 hover:bg-brand-800 text-white border border-white/20">
                <i class="ph ph-bell text-xl"></i>
                <span class="hidden 2xl:inline">Próximas</span>
                <template x-if="upcomingBookingsCount > 0">
                  <span class="bg-amber-400 text-brand-900 font-black text-xs px-1.5 py-0.5 rounded-full border border-amber-300" x-text="upcomingBookingsCount"></span>
                </template>
              </button>

              <button x-show="currentUser.role !== 'student'" @click="openFreshMaterialModal()" title="PDF Material Fresco" class="shrink-0 inline-flex items-center justify-center gap-2 h-11 min-w-[2.75rem] px-3 rounded-lg transition whitespace-nowrap font-bold text-sm 2xl:px-4 2xl:text-base bg-amber-600 hover:bg-amber-700 text-white border border-amber-500">
                <i class="ph ph-plant text-xl"></i>
                <span class="hidden 2xl:inline">Material Fresco</span>
              </button>

              <button x-show="currentUser.role !== 'student'" @click="openDailyPrintModal()" title="Reportes PDF" class="shrink-0 inline-flex items-center justify-center gap-2 h-11 min-w-[2.75rem] px-3 rounded-lg transition whitespace-nowrap font-bold text-sm 2xl:px-4 2xl:text-base bg-white/10 hover:bg-white/20 text-white border border-white/20">
                <i class="ph ph-printer text-xl"></i>
                <span class="hidden 2xl:inline">Reportes PDF</span>
              </button>

              <button @click="openStationery()" title="Solicitar Papelería" class="shrink-0 inline-flex items-center justify-center gap-2 h-11 min-w-[2.75rem] px-3 rounded-lg transition whitespace-nowrap font-bold text-sm 2xl:px-4 2xl:text-base bg-white/10 hover:bg-white/20 text-white border border-white/20">
                <i class="ph ph-paperclip text-xl"></i>
                <span class="hidden 2xl:inline">Solicitar Papelería</span>
              </button>

              <button @click="openModal()" class="shrink-0 inline-flex items-center justify-center gap-2 h-11 min-w-[2.75rem] px-3 rounded-lg transition whitespace-nowrap font-bold text-sm 2xl:px-4 2xl:text-base bg-white text-brand-800 hover:bg-slate-50 font-black shadow-md border border-white !px-4 !text-base">
                <i class="ph ph-plus-circle text-xl text-brand-600"></i>
                <span x-text="isStudent ? 'Agendar Internal Assessment' : 'Agendar Práctica'"></span>
              </button>

              <!-- Sonido de alertas -->
              <button @click="toggleSound()" class="shrink-0 inline-flex items-center justify-center h-11 w-11 bg-white/10 hover:bg-white/20 text-white rounded-lg border border-white/20 transition" :title="soundOn ? 'Sonido de alertas: activado (clic para silenciar)' : 'Sonido de alertas: silenciado (clic para activar)'">
                <i class="ph text-xl" :class="soundOn ? 'ph-speaker-high' : 'ph-speaker-slash'"></i>
              </button>

              <!-- Cerrar Sesión -->
              <button @click="logout()" class="shrink-0 inline-flex items-center justify-center h-11 w-11 bg-brand-800/80 hover:bg-brand-900 text-rose-100 rounded-lg border border-white/20 transition" title="Cerrar Sesión">
                <i class="ph ph-sign-out text-xl"></i>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- CONTENIDO PRINCIPAL -->
      <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-5 no-print">

        <!-- AVISO EN VIVO (LABORATORISTAS) -->
        <div x-show="currentUser.role === 'admin'" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="rounded-xl border p-4 shadow-xs" :class="liveBanner.cur ? 'bg-brand-50 border-brand-300' : 'bg-white border-slate-200'">
            <div class="flex items-center gap-2 mb-2">
              <span class="relative flex h-3 w-3"><span x-show="liveBanner.cur" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-500 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3" :class="liveBanner.cur ? 'bg-brand-600' : 'bg-slate-300'"></span></span>
              <h3 class="text-base font-black uppercase tracking-wider text-slate-800" x-text="liveBanner.cur ? 'Ahora · Periodo ' + liveBanner.cur : 'Ahora · fuera de periodo'"></h3>
            </div>
            <template x-for="it in liveBanner.curItems" :key="it.id">
              <div @click="viewDetail(it)" class="text-base cursor-pointer hover:bg-white/70 rounded px-1"><b x-text="getDisplaySpace(it)"></b> — <span x-text="it.practiceName || it.subject"></span> <span class="text-slate-500" x-text="'· ' + it.teacher"></span> <span class="text-xs font-bold" :class="it.labTech ? 'text-brand-700' : 'text-rose-600'" x-text="it.labTech ? '→ ' + it.labTech.split(' ')[0] : '→ sin asignar'"></span></div>
            </template>
            <p x-show="!liveBanner.curItems.length" class="text-sm text-slate-500 font-semibold">Sin prácticas en curso.</p>
          </div>
          <div class="rounded-xl border p-4 shadow-xs" :class="liveBanner.nextItems.length ? (liveBanner.toNext <= 15 ? 'bg-amber-100 border-amber-400 animate-pulse' : 'bg-amber-50 border-amber-300') : 'bg-white border-slate-200'">
            <div class="flex items-center gap-2 mb-2">
              <i class="ph ph-bell-ringing text-xl" :class="liveBanner.nextItems.length ? 'text-amber-600' : 'text-slate-300'"></i>
              <h3 class="text-base font-black uppercase tracking-wider text-slate-800" x-text="liveBanner.next ? 'Siguiente · Periodo ' + liveBanner.next + ' (en ' + liveBanner.toNext + ' min)' : 'Sin más periodos hoy'"></h3>
            </div>
            <template x-for="it in liveBanner.nextItems" :key="it.id">
              <div @click="viewDetail(it)" class="text-base cursor-pointer hover:bg-white/70 rounded px-1"><b x-text="getDisplaySpace(it)"></b> — <span x-text="it.practiceName || it.subject"></span> <span class="text-slate-500" x-text="'· ' + it.teacher"></span> <span class="text-xs font-bold" :class="it.labTech ? 'text-brand-700' : 'text-rose-600'" x-text="it.labTech ? '→ ' + it.labTech.split(' ')[0] : '→ sin asignar'"></span> <span x-show="it.needsFreshMaterial">🌿</span></div>
            </template>
            <p x-show="!liveBanner.nextItems.length" class="text-sm text-slate-500 font-semibold">Ninguna práctica inicia en el siguiente periodo.</p>
          </div>
        </div>

        <!-- REQUISITOS INSTITUCIONALES -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-white border-l-4 border-l-brand-600 border border-slate-200 rounded-r-xl p-4 shadow-xs flex gap-3.5 items-center">
            <div class="p-3.5 bg-brand-600 text-white rounded-md shrink-0">
              <i class="ph ph-clock text-2xl"></i>
            </div>
            <div>
              <h3 class="text-base font-extrabold uppercase tracking-wider text-brand-700">Anticipación General (48 Horas)</h3>
              <p class="text-base text-slate-600 mt-0.5">Mínimo 48 horas de antelación.</p>
            </div>
          </div>

          <div class="bg-white border-l-4 border-l-amber-500 border border-slate-200 rounded-r-xl p-4 shadow-xs flex gap-3.5 items-center">
            <div class="p-3.5 bg-amber-600 text-white rounded-md shrink-0">
              <i class="ph ph-plant text-2xl"></i>
            </div>
            <div>
              <h3 class="text-base font-extrabold uppercase tracking-wider text-brand-700">Insumos y Material Fresco</h3>
              <p class="text-base text-slate-600 mt-0.5">Lo que se compra fuera debe pedirse el <strong>miércoles de la semana previa antes de las 12:00 PM</strong>.</p>
            </div>
          </div>
        </div>

        <!-- PANEL DE CONTROLES -->
        <div class="flex flex-col gap-3 bg-white p-4 rounded-xl border border-slate-200 shadow-xs">

          <!-- Renglón 1: vistas + acciones de datos -->
          <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center border border-brand-200 rounded-lg p-1 bg-white overflow-x-auto max-w-full">
            <button @click="currentView = 'calendar'" :class="currentView === 'calendar' ? 'bg-brand-600 text-white font-black shadow-xs' : 'text-brand-700 hover:bg-brand-50 font-bold'" class="shrink-0 px-3.5 py-2 text-base rounded-md transition flex items-center gap-1.5">
              <i class="ph ph-calendar-blank text-lg"></i>
              <span>Calendario</span>
            </button>
            <button @click="currentView = 'list'" :class="currentView === 'list' ? 'bg-brand-600 text-white font-black shadow-xs' : 'text-brand-700 hover:bg-brand-50 font-bold'" class="shrink-0 px-3.5 py-2 text-base rounded-md transition flex items-center gap-1.5">
              <i class="ph ph-list-bullets text-lg"></i>
              <span>Lista</span>
            </button>
            <button @click="currentView = 'mine'" :class="currentView === 'mine' ? 'bg-brand-600 text-white font-black shadow-xs' : 'text-brand-700 hover:bg-brand-50 font-bold'" class="shrink-0 px-3.5 py-2 text-base rounded-md transition flex items-center gap-1.5">
              <i class="ph ph-user-list text-lg"></i>
              <span x-text="isStudent ? 'Mi IA' : (currentUser.role === 'admin' ? 'Mis asignadas' : 'Mis prácticas')"></span>
            </button>
            <button x-show="currentUser.role === 'admin'" @click="currentView = 'day'" :class="currentView === 'day' ? 'bg-brand-600 text-white font-black shadow-xs' : 'text-brand-700 hover:bg-brand-50 font-bold'" class="shrink-0 px-3.5 py-2 text-base rounded-md transition flex items-center gap-1.5">
              <i class="ph ph-calendar-check text-lg"></i>
              <span>Del día</span>
            </button>
            <button @click="currentView = 'stationery'" :class="currentView === 'stationery' ? 'bg-brand-600 text-white font-black shadow-xs' : 'text-brand-700 hover:bg-brand-50 font-bold'" class="shrink-0 px-3.5 py-2 text-base rounded-md transition flex items-center gap-1.5">
              <i class="ph ph-paperclip text-lg"></i>
              <span>Papelería</span>
              <span x-show="currentUser.role === 'admin' && pendingStationery > 0" class="bg-amber-400 text-brand-900 font-black text-xs px-1.5 py-0.5 rounded-full" x-text="pendingStationery"></span>
            </button>
            <button @click="currentView = 'inventory'" :class="currentView === 'inventory' ? 'bg-brand-600 text-white font-black shadow-xs' : 'text-brand-700 hover:bg-brand-50 font-bold'" class="shrink-0 px-3.5 py-2 text-base rounded-md transition flex items-center gap-1.5">
              <i class="ph ph-package text-lg"></i>
              <span>Inventario</span>
            </button>
          </div>
            <div class="flex flex-wrap items-center gap-2.5 ml-auto">
              <a href="https://sites.google.com/view/catalogo-ciencias/home" target="_blank" rel="noopener noreferrer" title="Abrir el catálogo en línea (se abre en otra pestaña)" class="text-base font-bold text-brand-700 hover:text-brand-900 bg-brand-50 hover:bg-brand-100 border border-brand-200 px-3.5 py-2 rounded-lg transition flex items-center gap-1.5">
                <i class="ph ph-books text-lg"></i>
                <span>Catálogo</span>
                <i class="ph ph-arrow-square-out text-base opacity-70"></i>
              </a>
              <button @click="fetchFromCloud()" class="text-base font-bold text-slate-700 hover:bg-slate-100 border border-slate-300 bg-white px-3.5 py-2 rounded-lg transition flex items-center gap-1.5">
                <i class="ph ph-arrows-clockwise text-lg" :class="isLoading ? 'animate-spin' : ''"></i>
                <span>Actualizar</span>
              </button>
              <button x-show="!isStudent" @click="exportCSV()" class="text-base font-bold text-slate-700 hover:bg-slate-100 border border-slate-300 bg-white px-3.5 py-2 rounded-lg transition flex items-center gap-1.5">
                <i class="ph ph-download-simple text-lg"></i>
                <span>Exportar</span>
              </button>
            </div>
          </div>

          <!-- Renglón 2: cuándo y dónde (solo en calendario/lista) -->
          <div x-show="!['inventory','day','mine','stationery'].includes(currentView)" class="flex flex-wrap items-center justify-between gap-x-4 gap-y-3 pt-3 border-t border-slate-100">
            <div class="flex flex-nowrap items-center gap-2">
              <button @click="navigate(-1)" class="shrink-0 p-2.5 hover:bg-slate-100 border border-slate-200 rounded-lg text-slate-700 transition" title="Anterior">
                <i class="ph ph-caret-left text-xl"></i>
              </button>
              <span class="text-base font-black text-slate-800 text-center uppercase tracking-wide truncate" :class="calendarMode === 'day' ? 'w-[210px] sm:w-[330px]' : 'w-[170px] sm:w-[230px]'" :title="weekRangeText" x-text="weekRangeText"></span>
              <button @click="navigate(1)" class="shrink-0 p-2.5 hover:bg-slate-100 border border-slate-200 rounded-lg text-slate-700 transition" title="Siguiente">
                <i class="ph ph-caret-right text-xl"></i>
              </button>
              <button @click="goToday()" class="shrink-0 text-base font-bold text-brand-700 hover:text-brand-900 bg-brand-50 hover:bg-brand-100 border border-brand-200 px-3.5 py-2 rounded-lg transition">Hoy</button>
              <div class="shrink-0 flex items-center border border-brand-200 rounded-lg p-1 bg-white">
                <template x-for="m in [['day','Día'],['week','Semana'],['month','Mes']]" :key="m[0]">
                  <button @click="calendarMode = m[0]" :class="calendarMode === m[0] ? 'bg-brand-600 text-white font-black shadow-xs' : 'text-brand-700 hover:bg-brand-50 font-bold'" class="px-3 py-1.5 text-base rounded-md transition" x-text="m[1]"></button>
                </template>
              </div>
            </div>

            <div class="flex items-center gap-2.5">
              <label class="text-base font-bold text-slate-600 uppercase tracking-wider shrink-0">Ubicación:</label>
              <select x-model="selectedLabFilter" class="text-base font-semibold bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-800 focus:ring-2 focus:ring-brand-600">
                <option value="ALL">Todos los Espacios</option>
                <template x-for="lab in labOptions" :key="lab.id">
                  <option :value="lab.name" x-text="lab.name"></option>
                </template>
              </select>
            </div>
          </div>
        </div>

        <!-- VISTA CALENDARIO POR PERIODOS -->
        <div x-show="currentView === 'calendar' && calendarMode !== 'month'" class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full border-collapse text-left min-w-[1050px]">
              <thead>
                <tr class="bg-brand-600 border-b border-brand-700 text-white">
                  <th class="p-3.5 text-base font-black uppercase tracking-wider w-36 text-center border-r border-slate-200">Periodo</th>
                  <template x-for="day in visibleDays" :key="day.dateStr">
                    <th class="p-3.5 text-center border-r border-slate-200 last:border-r-0" :class="day.isToday ? 'bg-brand-800' : ''">
                      <div class="text-base font-black uppercase tracking-wider text-rose-100" x-text="day.dayName"></div>
                      <div class="text-lg font-black text-white mt-0.5" x-text="day.formattedDate"></div>
                    </th>
                  </template>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200 text-base">
                <template x-for="period in [1,2,3,4,5,6,7,8]" :key="period">
                  <tr>
                    <td class="p-3.5 font-black text-center border-r border-slate-200" :class="isNowPeriod(period) ? 'bg-brand-600 text-white' : 'bg-slate-50 text-slate-800'">
                      <div class="font-black text-base" :class="isNowPeriod(period) ? 'text-white' : 'text-slate-900'" x-text="'Periodo ' + period"></div>
                      <div class="text-xs font-semibold" :class="isNowPeriod(period) ? 'text-rose-100' : 'text-slate-400'" x-text="periodRange(period)"></div>
                      <div x-show="isNowPeriod(period)" class="mt-1 text-xs font-black uppercase tracking-wider text-white animate-pulse">● Ahora</div>
                    </td>

                    <template x-for="day in visibleDays" :key="day.dateStr">
                      <td class="p-2 border-r border-slate-200 last:border-r-0 align-top h-36 hover:bg-slate-50/60 transition" :class="(day.isToday && liveBanner.cur === period) ? 'bg-brand-100/70 ring-2 ring-inset ring-brand-600' : (day.isToday ? 'bg-brand-50/20' : '')">
                        <div class="space-y-2">
                          <template x-for="item in getBookingsForSlot(day.dateStr, period)" :key="item.id">
                            <div @click="viewDetail(item)" class="p-3 rounded-lg border text-left cursor-pointer transition shadow-xs group hover:border-slate-400 bg-white" :class="getLabStyle(item.labType)">
                              <div class="flex items-center justify-between mb-1.5 gap-1 flex-wrap">
                                <span class="text-xs font-black px-2 py-0.5 rounded border uppercase" :class="getLabBadgeStyle(item.labType)" x-text="getDisplaySpace(item)"></span>
                                <div class="flex items-center gap-1">
                                  <span x-show="item.isExtemp" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-brand-600 text-white uppercase tracking-wider">Extemporánea</span>
                                  <span x-show="item.needsFreshMaterial" title="Requiere Material Fresco" class="inline-flex items-center justify-center w-[18px] h-[18px] rounded bg-amber-100 border border-amber-300 text-amber-700"><i class="ph ph-plant text-[11px]"></i></span>
                                </div>
                              </div>

                              <div class="font-extrabold text-base leading-snug">
                                <span :class="getSubjectColorClass(item.subject)" x-text="item.subject"></span>: 
                                <span class="font-bold text-slate-800" x-text="item.practiceName || 'Práctica General'"></span>
                              </div>
                              
                              <div class="text-sm font-semibold truncate mt-1.5 flex items-center gap-1.5 text-slate-600">
                                <span class="w-3 h-3 rounded-full inline-block shrink-0 border border-black/10" :style="'background-color:' + getTeacherColor(item.teacher)"></span>
                                <span x-text="item.teacher" class="text-slate-800"></span>
                              </div>
                              <div x-show="item.isIA" class="text-xs font-black text-brand-700 mt-1 uppercase" x-text="'IA · ' + item.studentName"></div>
                              <div x-show="item.group" class="text-xs font-bold text-slate-500" x-text="'Grupo ' + item.group"></div>
                            </div>
                          </template>
                        </div>
                      </td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- VISTA PAPELERÍA -->
        <div x-show="currentView === 'stationery'" class="space-y-4">
          <div class="bg-white rounded-xl border border-slate-200 shadow-xs p-4 flex flex-wrap items-center gap-3 justify-between">
            <div class="flex items-center gap-2 flex-wrap">
              <template x-for="f in ['Pendiente','Entregada','Todas']" :key="f">
                <button @click="stFilter = f" :class="stFilter === f ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-700'" class="px-3.5 py-1.5 rounded-lg text-base font-bold transition" x-text="f === 'Pendiente' ? 'Pendientes' : (f === 'Entregada' ? 'Entregadas' : 'Todas')"></button>
              </template>
              <span class="text-sm text-slate-500 font-semibold" x-text="currentUser.role === 'admin' ? 'Solicitudes de todos los usuarios' : 'Tus solicitudes'"></span>
            </div>
            <button @click="openStationery()" class="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-black px-4 py-2 rounded-lg"><i class="ph ph-plus-circle text-xl"></i> Nueva solicitud</button>
          </div>

          <template x-for="g in stationeryGroups" :key="g.date">
            <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
              <div class="px-4 py-2.5 bg-brand-50 border-b border-brand-200 font-black uppercase tracking-wider text-brand-700" x-text="'Para el ' + formatDisplayDate(g.date) + ' (' + g.items.length + ')'"></div>
              <template x-for="r in g.items" :key="r.id">
                <div class="p-4 border-b border-slate-100 last:border-b-0 flex flex-wrap gap-3 justify-between">
                  <div class="flex-1 min-w-[240px] space-y-1">
                    <div class="font-extrabold text-slate-900" x-text="r.purpose"></div>
                    <div x-show="stSpaceLabel(r)" class="inline-flex items-center gap-1 text-sm font-black text-brand-800 bg-brand-50 border border-brand-200 px-2 py-0.5 rounded"><i class="ph ph-map-pin"></i><span x-text="stSpaceLabel(r)"></span></div>
                    <div class="text-sm font-semibold text-slate-600" x-text="r.requester + (r.grade ? ' · ' + r.grade : '')"></div>
                    <ul class="list-disc pl-5 text-base text-slate-800">
                      <template x-for="(it, ii) in r.items" :key="ii"><li x-text="it.name + (it.quantity ? ' — ' + it.quantity : '')"></li></template>
                    </ul>
                    <p x-show="r.notes" class="text-sm text-slate-500" x-text="'Notas: ' + r.notes"></p>
                  </div>
                  <div class="flex flex-col items-end gap-2">
                    <span class="text-sm font-bold px-3 py-1 rounded-full border" :class="r.status === 'Entregada' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-amber-50 text-amber-800 border-amber-200'" x-text="r.status === 'Entregada' ? '✔ Entregada' + (r.deliveredBy ? ' por ' + r.deliveredBy.split(' ')[0] : '') : 'Pendiente'"></span>
                    <div class="flex items-center gap-1">
                      <button x-show="currentUser.role === 'admin'" @click="toggleDelivered(r)" class="text-sm font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-lg hover:bg-emerald-100" x-text="r.status === 'Entregada' ? 'Marcar pendiente' : 'Marcar entregada'"></button>
                      <button x-show="canEditStationery(r)" @click="openStationery(r)" class="text-slate-600 hover:text-brand-700 p-2 rounded-lg hover:bg-brand-50"><i class="ph ph-pencil-simple text-xl"></i></button>
                      <button x-show="canEditStationery(r)" @click="deleteStationery(r)" class="text-rose-500 hover:text-rose-700 p-2 rounded-lg hover:bg-rose-50"><i class="ph ph-trash text-xl"></i></button>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </template>
          <p x-show="stationeryGroups.length === 0" class="bg-white rounded-xl border border-slate-200 p-8 text-center text-slate-500 font-semibold">No hay solicitudes de papelería en esta lista.</p>
        </div>

        <!-- VISTA MIS PRÁCTICAS -->
        <div x-show="currentView === 'mine'" class="space-y-5">
          <template x-for="sec in mySections" :key="sec.title">
            <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
              <div class="px-4 py-3 bg-slate-100 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-base font-black uppercase tracking-wider text-slate-800" x-text="sec.title"></h3>
                <span class="text-sm font-bold text-slate-500" x-text="sec.items.length + ' registro(s)'"></span>
              </div>
              <div class="divide-y divide-slate-200">
                <template x-for="item in sec.items" :key="item.id">
                  <div class="p-4 flex flex-wrap items-center justify-between gap-3 hover:bg-slate-50 transition">
                    <div class="min-w-[220px]">
                      <div class="font-bold text-slate-900" x-text="formatDisplayDate(item.date) + ' · Periodo ' + item.startPeriod + (item.durationPeriods > 1 ? ' al ' + (parseInt(item.startPeriod) + parseInt(item.durationPeriods) - 1) : '')"></div>
                      <div class="font-bold text-slate-800" x-text="item.practiceName || 'Práctica General'"></div>
                      <div class="text-sm uppercase" :class="getSubjectColorClass(item.subject)" x-text="item.subject"></div>
                    </div>
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="text-sm font-bold px-2.5 py-1 rounded uppercase border" :class="getLabBadgeStyle(item.labType)" x-text="getDisplaySpace(item)"></span>
                      <span x-show="item.isExtemp" class="text-xs font-bold px-2 py-1 rounded bg-brand-600 text-white uppercase">Extemporánea</span>
                    </div>
                    <div class="whitespace-nowrap">
                      <button @click="viewDetail(item)" class="text-slate-600 hover:text-slate-900 p-2 rounded-lg hover:bg-slate-100"><i class="ph ph-eye text-xl"></i></button>
                      <button @click="printSingleBooking(item)" class="text-slate-600 hover:text-slate-900 p-2 rounded-lg hover:bg-slate-100"><i class="ph ph-printer text-xl"></i></button>
                      <button @click="editBooking(item)" class="text-slate-600 hover:text-brand-700 p-2 rounded-lg hover:bg-brand-50"><i class="ph ph-pencil-simple text-xl"></i></button>
                      <button @click="deleteBooking(item.id)" class="text-rose-500 hover:text-rose-700 p-2 rounded-lg hover:bg-rose-50"><i class="ph ph-trash text-xl"></i></button>
                    </div>
                  </div>
                </template>
                <p x-show="sec.items.length === 0" class="p-6 text-center text-slate-500 font-semibold">Sin registros.</p>
              </div>
            </div>
          </template>
        </div>

        <!-- VISTA PRÁCTICAS DEL DÍA (LABORATORISTAS) -->
        <div x-show="currentView === 'day'" class="space-y-4">
          <div class="bg-white rounded-xl border border-slate-200 shadow-xs p-4 flex flex-wrap items-center gap-3 justify-between">
            <div class="flex flex-nowrap items-center gap-2">
              <button @click="shiftDay(-1)" class="shrink-0 p-2.5 hover:bg-slate-100 border border-slate-200 rounded-lg"><i class="ph ph-caret-left text-xl"></i></button>
              <input type="date" x-model="dayDate" class="shrink-0 text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg">
              <button @click="shiftDay(1)" class="shrink-0 p-2.5 hover:bg-slate-100 border border-slate-200 rounded-lg"><i class="ph ph-caret-right text-xl"></i></button>
              <button @click="dayDate = localStr(new Date())" class="shrink-0 text-base font-bold text-brand-700 bg-brand-50 hover:bg-brand-100 border border-brand-200 px-3.5 py-2 rounded-lg">Hoy</button>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-base font-black uppercase tracking-wide text-slate-800" x-text="formatDisplayDate(dayDate) + ' · ' + dayTotal + ' práctica(s)'"></span>
              <button @click="printDay()" class="text-base font-bold text-slate-700 hover:bg-slate-100 border border-slate-300 px-3.5 py-2 rounded-lg flex items-center gap-1.5"><i class="ph ph-printer text-lg"></i> Imprimir</button>
            </div>
          </div>

          <template x-for="blk in dayPeriods" :key="blk.p">
            <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
              <div class="px-4 py-2.5 border-b border-slate-200 font-black uppercase tracking-wider" :class="periodTag(blk.p).cls" x-text="'Periodo ' + blk.p + ' (' + periodRange(blk.p) + ')' + periodTag(blk.p).label"></div>
              <div x-show="blk.spaces.length === 0" class="px-4 py-3 text-sm text-slate-400 font-semibold">Sin prácticas</div>
              <template x-for="sp in blk.spaces" :key="sp.name">
                <div class="p-4 border-b border-slate-100 last:border-b-0 flex flex-col sm:flex-row gap-3">
                  <div class="sm:w-44 shrink-0"><span class="text-sm font-bold px-2.5 py-1 rounded uppercase border" :class="getLabBadgeStyle(sp.labType)" x-text="sp.name"></span></div>
                  <div class="flex-1 space-y-2">
                    <template x-for="item in sp.items" :key="item.id">
                      <div @click="viewDetail(item)" class="p-3 rounded-lg border cursor-pointer hover:border-slate-400 bg-white" :class="[getLabStyle(item.labType), item.labTech && item.labTech === currentUser.name ? 'ring-2 ring-brand-300' : '']">
                        <div class="font-extrabold text-base">
                          <span :class="getSubjectColorClass(item.subject)" x-text="item.subject"></span>:
                          <span class="text-slate-800" x-text="item.practiceName || 'Práctica General'"></span>
                          <span x-show="item.needsFreshMaterial" title="Material fresco" class="inline-flex items-center justify-center w-[18px] h-[18px] rounded bg-amber-100 border border-amber-300 text-amber-700 align-middle"><i class="ph ph-plant text-[11px]"></i></span>
                          <span x-show="item.isIA" class="text-xs font-black text-brand-700 uppercase" x-text="'IA · ' + item.studentName"></span>
                        </div>
                        <div class="text-sm font-semibold text-slate-600 mt-1 flex items-center gap-1.5 flex-wrap">
                          <span class="w-3 h-3 rounded-full inline-block border border-black/10" :style="'background-color:' + getTeacherColor(item.teacher)"></span>
                          <span class="text-slate-800" x-text="item.teacher"></span>
                          <span x-text="'· ' + item.studentsCount + ' alumnos' + (item.grade ? ' · ' + item.grade : '') + ' (' + groupText(item) + ')' + (item.group ? ' · Grupo ' + item.group : '')"></span>
                          <span class="font-bold" :class="item.labTech ? 'text-brand-700' : 'text-rose-600'" x-text="item.labTech ? '· Atiende: ' + item.labTech : '· ⚠ Sin laboratorista'"></span>
                          <span x-show="item.durationPeriods > 1" x-text="'· Periodos ' + item.startPeriod + '-' + (parseInt(item.startPeriod) + parseInt(item.durationPeriods) - 1)"></span>
                        </div>
                        <div class="text-sm text-slate-500 mt-0.5" x-text="'Reactivos: ' + (item.reagentsList || []).length + ' · Materiales: ' + (item.materialsList || []).length"></div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- VISTA MES -->
        <div x-show="currentView === 'calendar' && calendarMode === 'month'" class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-x-auto">
          <div class="grid grid-cols-6 min-w-[760px]">
            <template x-for="n in ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado']" :key="n">
              <div class="p-2 text-center text-sm font-black uppercase bg-slate-100 border-b border-r border-slate-200" x-text="n"></div>
            </template>
            <template x-for="c in monthCells" :key="c.key">
              <div @click="openDay(c.dateStr)" class="min-h-[110px] p-1.5 border-b border-r border-slate-200 cursor-pointer hover:bg-slate-50" :class="[c.inMonth ? '' : 'bg-slate-50 opacity-50', c.isToday ? 'bg-brand-50/50' : '']">
                <div class="text-sm font-black text-slate-700" x-text="c.day"></div>
                <template x-for="b in c.items.slice(0,3)" :key="b.id">
                  <div class="mt-1 text-xs font-bold truncate px-1.5 py-0.5 rounded border" :class="getLabBadgeStyle(b.labType)" x-text="'P' + b.startPeriod + ' ' + (b.practiceName || b.subject)"></div>
                </template>
                <div x-show="c.items.length > 3" class="text-xs text-slate-500 font-bold mt-1" x-text="'+' + (c.items.length - 3) + ' más'"></div>
              </div>
            </template>
          </div>
        </div>

        <!-- VISTA INVENTARIO -->
        <div x-show="currentView === 'inventory'" class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">

        <!-- VISTA LISTA -->

            <table class="w-full text-left border-collapse">

                <tr class="bg-slate-100 border-b border-slate-200 text-base font-bold text-slate-700 uppercase tracking-wider">

                  <th class="p-4">Práctica / Asignatura</th>

              </thead>

                      </div>
                      <div class="text-sm text-slate-500" x-text="'Atiende: ' + (item.labTech || 'Sin indicar')"></div>
                    </td>
                    <td class="p-4 whitespace-nowrap">

            </table>

            <div x-show="editingBookingId">

            <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-2">
              <label class="block text-base font-bold text-slate-800 flex items-center gap-1.5 uppercase tracking-wider">
                <i class="ph ph-file-arrow-up text-brand-600 text-xl"></i>
                <span>Guía / Documento de Práctica <span class="text-slate-400 font-normal lowercase">(opcional)</span></span>
              </label>
              <input type="file" @change="handleFileUpload($event)" accept=".pdf,.doc,.docx,.png,.jpg" class="w-full text-base text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-base file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100">
              <p x-show="formData.fileName" class="text-base text-emerald-700 font-bold flex items-center gap-1 pt-1">
                <i class="ph ph-check-bold"></i> Archivo seleccionado: <span x-text="formData.fileName"></span>
              </p>
            </div>

            <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-2">
              <div class="flex justify-between items-center">
                <label class="text-base font-bold text-slate-800 flex items-center gap-1.5 uppercase tracking-wider">
                  <i class="ph ph-test-tube text-brand-600 text-xl"></i>
                  <span>Reactivos y Soluciones</span>
                </label>
                <button type="button" @click="addReagentRow()" class="text-base font-bold text-slate-700 hover:bg-slate-200 bg-white border border-slate-300 px-3 py-1 rounded-md transition flex items-center gap-1">
                  <i class="ph ph-plus-bold"></i> Agregar
                </button>
              </div>

              <div class="space-y-2">
                <template x-for="(item, index) in formData.reagentsList" :key="index">
                  <div class="flex gap-2 items-center">
                    <input type="text" x-model="item.name" :list="'invReact'" @input="onInvPick(item)" placeholder="Reactivo / Solución" class="flex-1 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <input type="text" x-model="item.concentration" placeholder="Concentración" class="w-32 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <input type="text" x-model="item.volume" placeholder="Volumen" class="w-32 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <span x-show="item.invId" class="text-xs font-bold whitespace-nowrap" :class="rowInfo(item, 'volume').bad ? 'text-rose-600' : 'text-emerald-700'" x-text="rowInfo(item, 'volume').text"></span>
                    <button type="button" @click="removeReagentRow(index)" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg">
                      <i class="ph ph-trash text-xl"></i>
                    </button>
                  </div>
                </template>
              </div>
            </div>

            <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-2">
              <div class="flex justify-between items-center">
                <label class="text-base font-bold text-slate-800 flex items-center gap-1.5 uppercase tracking-wider">
                  <i class="ph ph-list-plus text-brand-600 text-xl"></i>
                  <span>Material General y Equipo</span>
                </label>
                <button type="button" @click="addMaterialRow()" class="text-base font-bold text-slate-700 hover:bg-slate-200 bg-white border border-slate-300 px-3 py-1 rounded-md transition flex items-center gap-1">
                  <i class="ph ph-plus-bold"></i> Agregar
                </button>
              </div>

              <div class="space-y-2">
                <template x-for="(item, index) in formData.materialsList" :key="index">
                  <div class="flex gap-2 items-center">
                    <input type="text" x-model="item.name" :list="'invEquip'" @input="onInvPick(item)" placeholder="Material o Equipo (escribe para buscar en inventario)" class="flex-1 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <input type="text" x-model="item.quantity" placeholder="Cantidad" class="w-36 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <span x-show="item.invId" class="text-xs font-bold whitespace-nowrap" :class="rowInfo(item, 'quantity').bad ? 'text-rose-600' : 'text-emerald-700'" x-text="rowInfo(item, 'quantity').text"></span>
                    <button type="button" @click="removeMaterialRow(index)" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg">
                      <i class="ph ph-trash text-xl"></i>
                    </button>
                  </div>
                </template>
              </div>
            </div>

            <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-2">
              <div class="flex justify-between items-center">
                <label class="text-base font-bold text-slate-800 flex items-center gap-1.5 uppercase tracking-wider">
                  <i class="ph ph-link text-brand-600 text-xl"></i>
                  <span>Referencias <span class="text-slate-400 font-normal lowercase">(opcional)</span></span>
                </label>
                <button type="button" @click="addRefRow()" class="text-base font-bold text-slate-700 hover:bg-slate-200 bg-white border border-slate-300 px-3 py-1 rounded-md transition flex items-center gap-1"><i class="ph ph-plus-bold"></i> Agregar</button>
              </div>
              <p class="text-sm text-slate-500">Anexa el enlace donde se puede comprar el material específico que solicitas.</p>
              <div class="space-y-2">
                <template x-for="(item, index) in formData.referencesList" :key="index">
                  <div class="flex gap-2 items-center flex-wrap">
                    <input type="text" x-model="item.name" placeholder="Material (ej. Ojos de res)" class="flex-1 min-w-[160px] text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <input type="text" x-model="item.url" placeholder="https://..." class="flex-1 min-w-[200px] text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <button type="button" @click="removeRefRow(index)" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg"><i class="ph ph-trash text-xl"></i></button>
                  </div>
                </template>
              </div>
            </div>

            <template x-if="isModalOpen">
              <div>
                <datalist id="invEquip">
                  <template x-for="inv in inventory.filter(i => i.cat !== 'Reactivos')" :key="inv.id">
                    <option :value="inv.label" x-text="'Disp. ' + Math.max(availFor(inv.id, formData.date, formData.startPeriod, formData.durationPeriods, editingBookingId), 0) + '/' + inv.stock + ' ' + inv.unit"></option>
                  </template>
                </datalist>
                <datalist id="invReact">
                  <template x-for="inv in inventory.filter(i => i.cat === 'Reactivos')" :key="inv.id">
                    <option :value="inv.label" x-text="'Disp. ' + Math.max(availFor(inv.id, formData.date, formData.startPeriod, formData.durationPeriods, editingBookingId), 0) + ' ' + inv.unit"></option>
                  </template>
                </datalist>
              </div>
            </template>

            <div class="flex justify-end gap-3 pt-3 border-t border-slate-200 sticky bottom-0 bg-white py-2">
              <button type="button" @click="closeModal()" class="px-5 py-2.5 text-base font-bold text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancelar</button>
              <button type="submit" :disabled="isLoading" class="px-6 py-2.5 text-base font-black text-white bg-brand-600 hover:bg-brand-700 disabled:bg-slate-300 rounded-lg transition shadow-xs" x-text="isLoading ? 'Guardando...' : (editingBookingId ? 'Guardar Cambios' : 'Confirmar')"></button>
            </div>

          </form>
        </div>
      </div>

      <!-- MODAL SOLICITUD DE PAPELERÍA -->
      <div x-show="isStationeryOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
        <div @click.outside="isStationeryOpen = false" class="bg-white rounded-2xl max-w-xl w-full shadow-2xl border border-slate-200 overflow-hidden max-h-[90vh] flex flex-col">
          <div class="px-6 py-4 bg-brand-600 text-white flex justify-between items-center shrink-0">
            <div>
              <h2 class="text-xl font-black uppercase tracking-wide" x-text="editingStId ? 'Editar solicitud' : 'Solicitud de papelería'"></h2>
              <p class="text-base text-rose-100/90 font-medium"></p>
            </div>
            <button @click="isStationeryOpen = false" class="text-white/80 hover:text-white p-1"><i class="ph ph-x text-2xl"></i></button>
          </div>
          <form @submit.prevent="submitStationery()" class="p-6 space-y-4 overflow-y-auto text-base">
            <div>
              <label class="block text-base font-bold text-slate-700 mb-1">¿Para qué lo necesitas? *</label>
              <input type="text" x-model="stForm.purpose" required placeholder="Ej. Maqueta de la célula, cartel de ecosistemas..." class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div :class="stForm.space === 'Salón de clases' ? '' : 'sm:col-span-2'">
                <label class="block text-base font-bold text-slate-700 mb-1">Salón o laboratorio donde se necesita *</label>
                <select x-model="stForm.space" required class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-brand-600">
                  <option value="">Selecciona un espacio…</option>
                  <template x-for="lab in labOptions" :key="lab.id"><option :value="lab.name" x-text="lab.name"></option></template>
                </select>
              </div>
              <div x-show="stForm.space === 'Salón de clases'">
                <label class="block text-base font-bold text-slate-700 mb-1">Número o nombre del salón *</label>
                <input type="text" x-model="stForm.classroom" :required="stForm.space === 'Salón de clases'" placeholder="Ej. Salón 12, 2°A" class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600">
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1">Fecha en que lo necesitas *</label>
                <input type="date" x-model="stForm.date" required :min="localStr(new Date())" class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg">
              </div>
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1">Forma / Grado <span class="text-slate-400 font-normal">(opcional)</span></label>
                <select x-model="stForm.grade" class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg bg-white">
                  <option value="">—</option>
                  <template x-for="g in ['F1','F2','F3','F4','F5','L6','U6']" :key="g"><option :value="g" x-text="g"></option></template>
                </select>
              </div>
            </div>
            <div class="space-y-2">
              <div class="flex justify-between items-center">
                <label class="text-base font-bold text-slate-800 uppercase tracking-wider">Material *</label>
                <button type="button" @click="stForm.items.push({ name: '', quantity: '' })" class="text-base font-bold text-slate-700 hover:bg-slate-200 bg-white border border-slate-300 px-3 py-1 rounded-md flex items-center gap-1"><i class="ph ph-plus-bold"></i> Agregar</button>
              </div>
              <div class="flex flex-wrap gap-1.5">
                <template x-for="q in stQuick" :key="q"><button type="button" @click="addQuick(q)" class="text-sm font-semibold text-brand-700 bg-brand-50 border border-brand-200 px-2.5 py-1 rounded-full hover:bg-brand-100" x-text="'+ ' + q"></button></template>
              </div>
              <template x-for="(it, i) in stForm.items" :key="i">
                <div class="flex gap-2 items-center">
                  <input type="text" x-model="it.name" placeholder="Material (ej. Reglas)" class="flex-1 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                  <input type="text" x-model="it.quantity" placeholder="Cantidad" class="w-32 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                  <button type="button" @click="if (stForm.items.length > 1) stForm.items.splice(i, 1)" class="text-slate-400 hover:text-rose-600 p-1"><i class="ph ph-trash text-xl"></i></button>
                </div>
              </template>
            </div>
            <div>
              <label class="block text-base font-bold text-slate-700 mb-1">Notas <span class="text-slate-400 font-normal">(opcional)</span></label>
              <textarea x-model="stForm.notes" rows="2" placeholder="Colores, tamaños, marca..." class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg"></textarea>
            </div>
            <div class="flex justify-end gap-3 pt-2 border-t border-slate-200">
              <button type="button" @click="isStationeryOpen = false" class="px-5 py-2.5 text-base font-bold text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
              <button type="submit" class="px-6 py-2.5 text-base font-black text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-xs" x-text="editingStId ? 'Guardar cambios' : 'Enviar solicitud'"></button>
            </div>
          </form>
        </div>
      </div>

      <!-- MODAL PERFIL -->
      <div x-show="isProfileOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
        <div @click.outside="isProfileOpen = false" class="bg-white rounded-2xl max-w-3xl w-full shadow-2xl border border-slate-200 overflow-hidden max-h-[90vh] flex flex-col">
          <div class="px-6 py-4 bg-brand-600 text-white flex justify-between items-center shrink-0">
            <div>
              <h2 class="text-xl font-black uppercase tracking-wide">Mi Perfil</h2>
              <p class="text-base text-rose-100/90 font-medium" x-text="currentUser.name"></p>
              <p class="text-xs text-rose-200/80" x-text="'Versión: ' + appVersion"></p>
            </div>
            <button @click="isProfileOpen = false" class="text-white/80 hover:text-white p-1"><i class="ph ph-x text-2xl"></i></button>
          </div>

          <div class="flex gap-2 px-6 pt-4 shrink-0">
            <button @click="profileTab = 'datos'" :class="profileTab === 'datos' ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-700'" class="px-4 py-2 rounded-lg text-base font-bold transition">Foto y contraseña</button>
            <button @click="profileTab = 'horario'" :class="profileTab === 'horario' ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-700'" class="px-4 py-2 rounded-lg text-base font-bold transition">Horario</button>
            <button x-show="currentUser.role === 'admin'" @click="profileTab = 'accesos'" :class="profileTab === 'accesos' ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-700'" class="px-4 py-2 rounded-lg text-base font-bold transition">Accesos</button>
            <button x-show="currentUser.role === 'admin'" @click="profileTab = 'usuarios'" :class="profileTab === 'usuarios' ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-700'" class="px-4 py-2 rounded-lg text-base font-bold transition">Usuarios</button>
          </div>

          <div class="p-6 overflow-y-auto space-y-5 text-base">
            <!-- Foto y contraseña -->
            <div x-show="profileTab === 'datos'" class="space-y-6">
              <div class="flex items-center gap-5">
                <span class="w-24 h-24 rounded-full overflow-hidden border-4 border-slate-200 bg-slate-100 flex items-center justify-center text-3xl font-black text-slate-500 shrink-0">
                  <img x-show="myProfile.photo" :src="myProfile.photo" class="w-full h-full object-cover" alt="">
                  <span x-show="!myProfile.photo" x-text="initials"></span>
                </span>
                <div class="space-y-2">
                  <input type="file" accept="image/*" @change="handlePhoto($event)" class="text-base text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-md file:border-0 file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100">
                  <button x-show="myProfile.photo" @click="removePhoto()" class="text-sm font-bold text-rose-600 hover:underline">Quitar foto</button>
                </div>
              </div>

              <div x-show="!isStudent" class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-3">
                <h3 class="text-base font-black uppercase tracking-wider text-slate-800">Cambiar contraseña</h3>
                <input type="password" x-model="pw.current" placeholder="Contraseña actual" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                <input type="password" x-model="pw.next" placeholder="Nueva contraseña (mínimo 6 caracteres)" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                <input type="password" x-model="pw.confirm" placeholder="Confirmar nueva contraseña" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                <button @click="changePassword()" class="px-5 py-2 text-base font-black text-white bg-brand-600 hover:bg-brand-700 rounded-lg">Actualizar contraseña</button>
              </div>
              <p x-show="isStudent" class="text-sm text-slate-500">Entras con tu correo institucional y la contraseña general de alumnos, que solo cambia el laboratorista.</p>
            </div>

            <!-- Accesos (solo laboratoristas) -->
            <div x-show="profileTab === 'accesos' && currentUser.role === 'admin'" class="space-y-4">
              <p class="text-base text-slate-600">Si alguien olvidó su contraseña, asígnale una <b>temporal</b>. Al entrar con ella, la página le pedirá crear una nueva.</p>
              <select x-model="resetUserId" class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg bg-white">
                <option value="">Selecciona al usuario...</option>
                <template x-for="u in usersList" :key="u.id"><option :value="u.id" x-text="u.name + ' (' + u.title + ')'"></option></template>
              </select>
              <input type="text" x-model="resetTemp" placeholder="Contraseña temporal (mínimo 6 caracteres)" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
              <div class="flex gap-2 flex-wrap">
                <button @click="adminResetPassword()" class="px-5 py-2 text-base font-black text-white bg-brand-600 hover:bg-brand-700 rounded-lg">Asignar contraseña temporal</button>
                <button @click="adminClearPassword()" class="px-5 py-2 text-base font-bold text-slate-700 bg-white border border-slate-300 hover:bg-slate-100 rounded-lg">Volver a la contraseña original</button>
              </div>
              <p class="text-sm text-slate-500">Para el acceso compartido de alumnos, esto cambia la contraseña de todos ellos.</p>
            </div>

            <!-- Usuarios: alumnos con correo y nuevos profesores (solo laboratoristas) -->
            <div x-show="profileTab === 'usuarios' && currentUser.role === 'admin'" class="space-y-6">

              <div class="border border-slate-200 rounded-xl p-4 space-y-3">
                <h3 class="text-base font-black uppercase tracking-wider text-brand-700">Nuevo profesor</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <input type="text" x-model="newTeacher.name" placeholder="Nombre completo *" class="text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                  <select x-model="newTeacher.title" class="text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg bg-white"><option>Profesora</option><option>Profesor</option></select>
                  <input type="email" x-model="newTeacher.email" placeholder="Correo (opcional)" class="text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                  <input type="text" x-model="newTeacher.pass" placeholder="Contraseña temporal * (mín. 6)" class="text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                </div>
                <button @click="addTeacher()" class="px-5 py-2 text-base font-black text-white bg-brand-600 hover:bg-brand-700 rounded-lg">Registrar profesor</button>
                <div x-show="extraUsers.length" class="pt-2 border-t border-slate-100 space-y-1">
                  <p class="text-sm font-bold text-slate-600">Profesores agregados desde aquí:</p>
                  <template x-for="u in extraUsers" :key="u.id">
                    <div class="flex items-center justify-between gap-2 text-base bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5">
                      <span><b x-text="u.name"></b> <span class="text-slate-500" x-text="'· ' + u.title + (u.email ? ' · ' + u.email : '')"></span></span>
                      <button @click="removeTeacher(u)" class="text-rose-500 hover:text-rose-700 p-1" title="Quitar"><i class="ph ph-trash text-lg"></i></button>
                    </div>
                  </template>
                </div>
              </div>

              <div class="border border-slate-200 rounded-xl p-4 space-y-3">
                <h3 class="text-base font-black uppercase tracking-wider text-brand-700" x-text="'Alumnos registrados (' + students.length + ')'"></h3>
                <p class="text-sm text-slate-500">Los alumnos entran con su correo institucional (<span x-text="STUDENT_DOMAIN"></span>). Si su correo no está aquí, se registran solos la primera vez con su nombre.</p>
                <div class="grid grid-cols-1 sm:grid-cols-[1fr_1fr_auto] gap-2">
                  <input type="text" x-model="stNew.name" placeholder="Nombre completo" class="text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                  <input type="email" x-model="stNew.email" placeholder="correo@lancaster.edu.mx" class="text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                  <button @click="addStudent()" class="px-4 py-2 text-base font-black text-white bg-brand-600 hover:bg-brand-700 rounded-lg">Agregar</button>
                </div>
                <details class="bg-slate-50 border border-slate-200 rounded-lg p-3">
                  <summary class="cursor-pointer text-base font-bold text-slate-700">Agregar varios alumnos a la vez</summary>
                  <div class="mt-2 space-y-2">
                    <textarea x-model="stImport" rows="5" placeholder="Un alumno por línea:&#10;Ana López, ana.lopez@lancaster.edu.mx&#10;Luis Pérez, luis.perez@lancaster.edu.mx" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg bg-white font-mono"></textarea>
                    <button @click="importStudents()" class="px-4 py-2 text-base font-black text-white bg-brand-600 hover:bg-brand-700 rounded-lg">Registrar lista</button>
                  </div>
                </details>
                <input type="text" x-model="stSearch" placeholder="Buscar alumno por nombre o correo…" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                <div class="max-h-64 overflow-y-auto divide-y divide-slate-100 border border-slate-200 rounded-lg">
                  <template x-for="st in filteredStudents" :key="st.email">
                    <div class="flex items-center justify-between gap-2 px-3 py-2 text-base">
                      <span class="min-w-0"><b class="block truncate" x-text="st.name"></b><span class="text-sm text-slate-500 block truncate" x-text="st.email"></span></span>
                      <button @click="removeStudent(st)" class="text-rose-500 hover:text-rose-700 p-1 shrink-0" title="Quitar"><i class="ph ph-trash text-lg"></i></button>
                    </div>
                  </template>
                  <p x-show="!filteredStudents.length" class="p-4 text-center text-sm text-slate-500 font-semibold">Aún no hay alumnos registrados.</p>
                </div>
              </div>
            </div>

            <!-- Horario -->
            <div x-show="profileTab === 'horario'" class="space-y-3">
              <div x-show="!isStudent" class="flex items-center gap-2 flex-wrap">
                <label class="text-base font-bold text-slate-700">Consultar horario de:</label>

      <!-- MODAL REPORTE GENERAL -->

        async fetchFromCloud(silent = false) {
          if (!silent) this.isLoading = true;
          try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${this.binId}/latest`, {
              method: 'GET',
              headers: { 'X-Master-Key': this.masterKey }
            });
            if (res.ok) {
              const json = await res.json();
              const rec = json.record;
              if (Array.isArray(rec)) {
                this.bookings = rec;
              } else if (rec && typeof rec === 'object') {
                this.bookings = rec.bookings || [];
                this.inventory = this.buildInventory(rec);
                this.profiles = rec.profiles || {};
                this.stationery = rec.stationery || [];
                this.applyRoster(rec);
              } else {
                this.bookings = [];
              }
              await this.autoAssignPending();
            }
          } catch (e) {
            console.error('Error al sincronizar:', e);
          } finally {
            this.isLoading = false;
          }
        },

        async saveToCloud() {
          this.isLoading = true;
          try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${this.binId}`, {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': this.masterKey
              },
              body: JSON.stringify({ bookings: this.bookings, invDelta: this.makeInvDelta(), profiles: this.profiles, stationery: this.stationery, students: this.students, extraUsers: this.extraUsers })
            });
            if (!res.ok) throw new Error('Error al guardar');
          } catch (e) {
            console.error(e);
            Swal.fire({
              icon: 'error',
              title: 'Error de conexión',
              text: 'No se pudieron sincronizar los cambios en la nube.'
            });
          } finally {
            this.isLoading = false;
          }
        },

        handlePhoto(e) {
          const f = e.target.files[0];
          if (!f) return;
          const reader = new FileReader();
          reader.onload = ev => {
            const img = new Image();
            img.onload = async () => {
              const c = document.createElement('canvas');
              c.width = c.height = 160;
              const m = Math.min(img.width, img.height);
              c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, 160, 160);
              this.setProfile({ photo: c.toDataURL('image/jpeg', 0.8) });
              await this.saveToCloud();
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(f);
          e.target.value = '';
        },

        async hashPass(t) {
          if (window.crypto && crypto.subtle) {
            const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('lancaster:' + t));
            return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
          }
          return 'p:' + t;
        },

        async checkPass(user, input) {
          const pr = this.profiles[user.id];
          if (pr && pr.pwHash) return pr.pwHash === await this.hashPass(input);

        async changePassword() {
          if (!(await this.checkPass(this.currentUser, this.pw.current))) { Swal.fire('Contraseña incorrecta', 'La contraseña actual no coincide.', 'error'); return; }

          if (this.pw.next !== this.pw.confirm) { Swal.fire('No coinciden', 'La confirmación no coincide con la nueva contraseña.', 'warning'); return; }
          this.setProfile({ pwHash: await this.hashPass(this.pw.next), mustChange: false });
          await this.saveToCloud();
          this.pw = { current: '', next: '', confirm: '' };
          Swal.fire({ icon: 'success', title: 'Contraseña actualizada', timer: 1800, showConfirmButton: false });
        },

isMine(b) {
          const u = this.currentUser;
          if (!u) return false;
          if (u.role === 'student') return this.ownsIA(b);
          return u.role === 'admin' ? b.labTech === u.name : b.teacher === u.name;
        },

          const t = this.localStr(new Date());
          const mine = this.bookings.filter(b => this.isMine(b));
          const key = b => b.date + String(b.startPeriod).padStart(2, '0');
          return [
            { title: 'Próximas', items: mine.filter(b => b.date >= t).sort((a, b) => key(a).localeCompare(key(b))) },
            { title: 'Anteriores', items: mine.filter(b => b.date < t).sort((a, b) => key(b).localeCompare(key(a))) }
          ];
        },

        shiftDay(n) {
          const d = new Date(this.dayDate + 'T00:00:00');
          d.setDate(d.getDate() + n);
          this.dayDate = this.localStr(d);
        },

        get dayTotal() { return this.bookings.filter(b => b.date === this.dayDate).length; },

        get dayPeriods() {
          const out = [];
          for (let p = 1; p <= 8; p++) {
            const m = {};
            this.bookings.filter(b => b.date === this.dayDate && p >= parseInt(b.startPeriod) && p <= parseInt(b.startPeriod) + parseInt(b.durationPeriods) - 1).forEach(b => {
              const n = this.getDisplaySpace(b);
              (m[n] = m[n] || { name: n, labType: b.labType, items: [] }).items.push(b);
            });
            out.push({ p, spaces: Object.values(m).sort((a, b) => a.name.localeCompare(b.name, 'es', { numeric: true })) });
          }
          return out;
        },

          this.formData.durationPeriods = f.durationPeriods || '1';

        norm(t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); },

        ownsIA(item) {
          if (!item || !item.isIA || !this.currentUser) return false;
          if (this.currentUser.email && item.studentEmail && String(item.studentEmail).toLowerCase() === this.currentUser.email) return true;
          return [item.ownerName, item.studentName].some(n => this.norm(n) === this.norm(this.currentUser.name));
        },

        toMin(t) { const a = t.split(':'); return +a[0] * 60 + +a[1]; },

safeUrl(u) {
          let t = String(u || '').trim();
          if (!t) return '';
          if (!/^https?:\/\//i.test(t)) t = 'https://' + t;
          try { const x = new URL(t); return /^https?:$/.test(x.protocol) && x.hostname.includes('.') ? x.href : ''; } catch (e) { return ''; }
        },

        readAsDataURL(f) {
          return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
        },

        compressImage(f) {
          return new Promise((ok, no) => {
            const img = new Image();
            img.onload = () => {
              const k = Math.min(1, 1600 / Math.max(img.width, img.height));
              const c = document.createElement('canvas');
              c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
              c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
              ok(c.toDataURL('image/jpeg', 0.82));
            };
            img.onerror = no;
            this.readAsDataURL(f).then(d => { img.src = d; }, no);
          });
        },

        async uploadScheduleFile(e) {
          const f = e.target.files[0];
          e.target.value = '';
          if (!f) return;
          const isImg = f.type.startsWith('image/');
          if (!isImg && f.size > 2 * 1024 * 1024) { Swal.fire('Archivo muy grande', 'El archivo no debe exceder 2 MB.', 'warning'); return; }
          try {
            const data = isImg ? await this.compressImage(f) : await this.readAsDataURL(f);
            const type = isImg ? 'image/jpeg' : (f.type || 'application/octet-stream');
            const cur = this.myProfile.scheduleFile;
            const headers = { 'Content-Type': 'application/json', 'X-Master-Key': this.masterKey };
            if (!(cur && cur.binId)) { headers['X-Bin-Private'] = 'true'; headers['X-Bin-Name'] = 'horario-' + this.profileKey; }
            const res = await fetch('https://api.jsonbin.io/v3/b' + (cur && cur.binId ? '/' + cur.binId : ''), { method: cur && cur.binId ? 'PUT' : 'POST', headers, body: JSON.stringify({ name: f.name, type, data }) });
            if (!res.ok) throw new Error('upload');
            const binId = cur && cur.binId ? cur.binId : (await res.json()).metadata.id;
            this.setProfile({ scheduleFile: { binId, name: f.name, type } });
            await this.saveToCloud();
            this.schedulePreview = null;
            Swal.fire({ icon: 'success', title: 'Archivo guardado', timer: 1500, showConfirmButton: false });
          } catch (err) {
            Swal.fire('No se pudo subir', 'Intenta con un archivo más pequeño o más tarde.', 'error');
          }
        },

        async openScheduleFile(key) {
          const f = (this.profiles[key] || {}).scheduleFile;
          if (!f) return;
          try {
            const r = await fetch('https://api.jsonbin.io/v3/b/' + f.binId + '/latest', { headers: { 'X-Master-Key': this.masterKey } });
            if (!r.ok) throw new Error('read');
            const rec = (await r.json()).record;
            const url = URL.createObjectURL(await (await fetch(rec.data)).blob());
            if (rec.type === 'application/pdf' || rec.type.startsWith('image/')) {
              this.schedulePreview = { url, type: rec.type, name: rec.name };
            } else {
              const a = document.createElement('a');
              a.href = url; a.download = rec.name;
              document.body.appendChild(a); a.click(); a.remove();
            }
          } catch (err) {
            Swal.fire('No se pudo abrir', 'Intenta de nuevo en unos momentos.', 'error');
          }

        async removeScheduleFile() {

get pendingStationery() { return this.stationery.filter(r => r.status !== 'Entregada').length; },

        async addStudent() {
          await this.fetchFromCloud(true);

          if (!this.isInstEmail(email)) { Swal.fire('Correo no válido', 'Debe ser un correo institucional que termine en ' + STUDENT_DOMAIN + '.', 'warning'); return; }
          if (this.students.some(x => x.email === email)) { Swal.fire('Ya está registrado', 'Ese correo ya existe en la lista.', 'info'); return; }
          this.students = [...this.students, { email, name, createdAt: Date.now() }];
          await this.saveToCloud();
          this.stNew = { name: '', email: '' };
          Swal.fire({ toast: true, position: 'top-end', icon: 'success', timer: 2000, showConfirmButton: false, title: 'Alumno registrado' });

        async importStudents() {
          await this.fetchFromCloud(true);
          const lines = this.stImport.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          if (!lines.length) { Swal.fire('Lista vacía', 'Pega una lista con un alumno por línea: nombre, correo.', 'info'); return; }
          const list = [...this.students], bad = [];
          let added = 0, dup = 0;
          lines.forEach(l => {
            const parts = l.split(/[,;\t]+/).map(x => x.trim()).filter(Boolean);
            const email = (parts.find(x => x.includes('@')) || '').toLowerCase();
            const name = parts.filter(x => !x.includes('@')).join(' ').trim();
            if (!name || !this.isInstEmail(email)) { bad.push(l); return; }
            if (list.some(x => x.email === email)) { dup++; return; }
            list.push({ email, name, createdAt: Date.now() }); added++;
          });
          if (added) { this.students = list; await this.saveToCloud(); }
          this.stImport = bad.join('\n');
          Swal.fire({ icon: bad.length ? 'warning' : 'success', title: added + ' alumno(s) registrado(s)', html: (dup ? dup + ' ya estaban registrados.<br>' : '') + (bad.length ? bad.length + ' línea(s) con problemas (sin nombre o sin correo ' + STUDENT_DOMAIN + ') quedaron en el cuadro para que las corrijas.' : '') });

        async addTeacher() {

          if (!name) { Swal.fire('Falta el nombre', 'Escribe el nombre completo del profesor.', 'warning'); return; }

          if (this.usersList.some(u => this.norm(u.name) === this.norm(name))) { Swal.fire('Ya existe', 'Ya hay un usuario con ese nombre.', 'info'); return; }
          let id = this.norm(name).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'profe', k = 2; const base = id;
          while (this.usersList.some(u => u.id === id)) id = base + '-' + (k++);
          this.extraUsers = [...this.extraUsers, { id, name, title: t.title, role: 'teacher', email }];

          this.applyRoster({ students: this.students, extraUsers: this.extraUsers });
          await this.saveToCloud();

          if (!c.isConfirmed) return;
          this.extraUsers = this.extraUsers.filter(x => x.id !== u.id);
          const pr = { ...this.profiles }; delete pr[u.id]; this.profiles = pr;

          await this.saveToCloud();
