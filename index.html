<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitácora de Laboratorios - La Escuela de Lancaster</title>
  <!-- CSS de Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Iconos Phosphor -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#e11d48',
              600: '#c8102e', // Rojo institucional Escuela de Lancaster
              700: '#9f1239',
              800: '#881337',
              900: '#4c0519',
            }
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white !important; }
    }
  </style>
</head>
<body class="h-full font-sans text-slate-800 text-base antialiased bg-slate-100 flex flex-col min-h-screen" x-data="appData()" x-init="initData()">

  <!-- PANTALLA DE INICIO DE SESIÓN POR USUARIO -->
  <div x-show="!currentUser" x-cloak class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl border border-slate-200 text-center space-y-6">
      
      <div class="mx-auto w-16 h-16 rounded-2xl bg-brand-50 border border-brand-200 flex items-center justify-center text-brand-600 shadow-sm">
        <i class="ph ph-user-lock text-3xl"></i>
      </div>

      <div>
        <h2 class="text-xl font-black text-slate-900 uppercase tracking-wide">Iniciar Sesión</h2>
        <p class="text-base text-slate-600 font-medium mt-1">Bitácora de Laboratorios — La Escuela de Lancaster</p>
      </div>

      <!-- Formulario de Selección de Usuario y Clave -->
      <form @submit.prevent="login()" class="space-y-4 text-left">
        <div>
          <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">Usuario / Personal *</label>
          <select x-model="selectedUserKey" required class="w-full text-base font-semibold px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-600 bg-slate-50 text-slate-800">
            <option value="" disabled selected>Selecciona tu nombre...</option>
            <optgroup label="Laboratoristas">
              <template x-for="user in usersList.filter(u => u.role === 'admin')" :key="user.id">
                <option :value="user.id" x-text="user.name + ' (' + user.title + ')'"></option>
              </template>
            </optgroup>
            <optgroup label="Profesores">
              <template x-for="user in usersList.filter(u => u.role === 'teacher')" :key="user.id">
                <option :value="user.id" x-text="user.name + ' (' + user.title + ')'"></option>
              </template>
            </optgroup>
          </select>
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">Contraseña *</label>
          <div class="relative">
            <input :type="showPassword ? 'text' : 'password'" x-model="inputPassword" required placeholder="Ingresa tu clave" class="w-full text-base font-semibold px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-600 bg-slate-50 text-slate-800">
            <button type="button" @click="showPassword = !showPassword" class="absolute right-3 top-3.5 text-slate-400 hover:text-slate-600">
              <i class="ph text-xl" :class="showPassword ? 'ph-eye-slash' : 'ph-eye'"></i>
            </button>
          </div>
        </div>

        <p x-show="authError" class="text-sm font-bold text-brand-600 flex items-center gap-1.5" x-cloak>
          <i class="ph ph-warning-circle text-lg"></i> Contraseña incorrecta para el usuario seleccionado.
        </p>

        <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-black text-base rounded-xl transition shadow-md uppercase tracking-wider">
          Ingresar al Sistema
        </button>
      </form>

      <p class="text-xs text-slate-400 font-medium">Uso exclusivo para personal docente y de laboratorio.</p>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <template x-if="currentUser">
    <div class="flex flex-col min-h-screen">
      
      <!-- ENCABEZADO INSTITUCIONAL CON PERFIL DILIGENTE -->
      <header class="bg-brand-600 text-white shadow-lg sticky top-0 z-30 no-print border-b border-brand-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex justify-between h-20 items-center">
            
            <!-- Logo y Datos Institucionales -->
            <div class="flex items-center gap-3.5">
              <div class="w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-white border border-white/20 shadow-inner">
                <i class="ph ph-flask text-3xl"></i>
              </div>
              <div>
                <h1 class="font-black text-xl text-white leading-tight uppercase tracking-wide">Bitácora de Laboratorios</h1>
                <p class="text-base text-rose-100/90 font-medium tracking-normal">La Escuela de Lancaster</p>
              </div>
            </div>

            <!-- Identificación del Usuario y Acciones -->
            <div class="flex items-center gap-2 sm:gap-3">
              
              <!-- Badge Usuario -->
              <div class="hidden lg:flex flex-col text-right mr-2">
                <span class="text-sm font-black text-white" x-text="currentUser.name"></span>
                <span class="text-xs font-semibold text-rose-200" x-text="currentUser.role === 'admin' ? 'Laboratorista (Acceso Total)' : 'Profesor'"></span>
              </div>

              <!-- Alerta Próximas -->
              <button @click="showUpcomingAlertManual()" class="relative inline-flex items-center gap-2 bg-brand-700/80 hover:bg-brand-800 text-white font-bold text-base px-3.5 py-2.5 rounded-lg transition border border-white/20">
                <i class="ph ph-bell text-xl"></i>
                <span class="hidden sm:inline">Próximas</span>
                <template x-if="upcomingBookingsCount > 0">
                  <span class="bg-amber-400 text-brand-900 font-black text-sm px-2 py-0.5 rounded-full border border-amber-300" x-text="upcomingBookingsCount"></span>
                </template>
              </button>

              <button @click="openFreshMaterialModal()" class="inline-flex items-center gap-2 bg-amber-600 hover:bg-amber-700 text-white font-bold text-base px-4 py-2.5 rounded-lg transition shadow-xs border border-amber-500">
                <i class="ph ph-plant text-xl"></i>
                <span>PDF Material Fresco</span>
              </button>

              <button @click="openDailyPrintModal()" class="inline-flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white font-bold text-base px-4 py-2.5 rounded-lg transition border border-white/20">
                <i class="ph ph-printer text-xl"></i>
                <span>Reportes PDF</span>
              </button>

              <button @click="openModal()" class="inline-flex items-center gap-2 bg-white text-brand-800 hover:bg-slate-50 font-black text-base px-4 py-2.5 rounded-lg transition shadow-md border border-white">
                <i class="ph ph-plus-circle text-xl text-brand-600"></i>
                <span>Agendar Práctica</span>
              </button>

              <!-- Cerrar Sesión -->
              <button @click="logout()" class="p-2.5 bg-brand-800/80 hover:bg-brand-900 text-rose-100 rounded-lg border border-white/20 transition" title="Cerrar Sesión">
                <i class="ph ph-sign-out text-xl"></i>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- CONTENIDO PRINCIPAL -->
      <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-5 no-print">

        <!-- REQUISITOS INSTITUCIONALES -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-white border-l-4 border-l-brand-600 border border-slate-200 rounded-r-xl p-4 shadow-xs flex gap-3.5 items-center">
            <div class="p-3 bg-slate-100 text-brand-700 rounded-lg shrink-0">
              <i class="ph ph-clock text-2xl"></i>
            </div>
            <div>
              <h3 class="text-base font-extrabold uppercase tracking-wider text-slate-800">Anticipación General (48 Horas)</h3>
              <p class="text-base text-slate-600 mt-0.5">Mínimo 48h de antelación. Solicitudes con menor tiempo se marcarán como <strong>Extemporáneas</strong>.</p>
            </div>
          </div>

          <div class="bg-white border-l-4 border-l-amber-500 border border-slate-200 rounded-r-xl p-4 shadow-xs flex gap-3.5 items-center">
            <div class="p-3 bg-slate-100 text-amber-700 rounded-lg shrink-0">
              <i class="ph ph-plant text-2xl"></i>
            </div>
            <div>
              <h3 class="text-base font-extrabold uppercase tracking-wider text-slate-800">Insumos y Material Fresco</h3>
              <p class="text-base text-slate-600 mt-0.5">Mínimo 2 días de anticipación y solicitarse antes del <strong>Miércoles a las 12:00 PM</strong> previo.</p>
            </div>
          </div>
        </div>

        <!-- PANEL DE CONTROLES -->
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
          <!-- Navegación de Semana -->
          <div class="flex items-center gap-2">
            <button @click="changeWeek(-1)" class="p-2.5 hover:bg-slate-100 border border-slate-200 rounded-lg text-slate-700 transition" title="Semana Anterior">
              <i class="ph ph-caret-left text-xl"></i>
            </button>
            <span class="text-base font-black text-slate-800 min-w-[240px] text-center uppercase tracking-wide" x-text="weekRangeText"></span>
            <button @click="changeWeek(1)" class="p-2.5 hover:bg-slate-100 border border-slate-200 rounded-lg text-slate-700 transition" title="Semana Siguiente">
              <i class="ph ph-caret-right text-xl"></i>
            </button>
            <button @click="resetToCurrentWeek()" class="ml-2 text-base font-bold text-brand-700 hover:text-brand-900 bg-brand-50 hover:bg-brand-100 border border-brand-200 px-3.5 py-2 rounded-lg transition">
              Semana Actual
            </button>
          </div>

          <!-- Filtro por Ubicación -->
          <div class="flex items-center gap-2.5 w-full lg:w-auto">
            <label class="text-base font-bold text-slate-600 uppercase tracking-wider shrink-0">Ubicación:</label>
            <select x-model="selectedLabFilter" class="text-base font-semibold bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-800 focus:ring-2 focus:ring-brand-600">
              <option value="ALL">Todos los Espacios</option>
              <template x-for="lab in labOptions" :key="lab.id">
                <option :value="lab.name" x-text="lab.name"></option>
              </template>
            </select>
          </div>

          <!-- Vistas y Descarga -->
          <div class="flex items-center gap-2.5 w-full lg:w-auto justify-between lg:justify-end">
            <div class="flex items-center border border-slate-200 rounded-lg p-1 bg-slate-100">
              <button @click="currentView = 'calendar'" :class="currentView === 'calendar' ? 'bg-white shadow-xs text-slate-900 font-black' : 'text-slate-600 hover:text-slate-900 font-semibold'" class="px-3.5 py-2 text-base rounded-md transition flex items-center gap-1.5">
                <i class="ph ph-calendar-blank text-lg"></i>
                <span>Calendario</span>
              </button>
              <button @click="currentView = 'list'" :class="currentView === 'list' ? 'bg-white shadow-xs text-slate-900 font-black' : 'text-slate-600 hover:text-slate-900 font-semibold'" class="px-3.5 py-2 text-base rounded-md transition flex items-center gap-1.5">
                <i class="ph ph-list-bullets text-lg"></i>
                <span>Lista</span>
              </button>
            </div>

            <button @click="fetchFromCloud()" class="text-base font-bold text-slate-700 hover:bg-slate-100 border border-slate-300 bg-white px-3.5 py-2 rounded-lg transition flex items-center gap-1.5">
              <i class="ph ph-arrows-clockwise text-lg" :class="isLoading ? 'animate-spin' : ''"></i>
              <span>Actualizar</span>
            </button>

            <button @click="exportCSV()" class="text-base font-bold text-slate-700 hover:bg-slate-100 border border-slate-300 bg-white px-3.5 py-2 rounded-lg transition flex items-center gap-1.5">
              <i class="ph ph-download-simple text-lg"></i>
              <span>Exportar</span>
            </button>
          </div>
        </div>

        <!-- VISTA CALENDARIO POR PERIODOS -->
        <div x-show="currentView === 'calendar'" class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full border-collapse text-left min-w-[1050px]">
              <thead>
                <tr class="bg-slate-100 border-b border-slate-200 text-slate-700">
                  <th class="p-3.5 text-base font-black uppercase tracking-wider w-36 text-center border-r border-slate-200">Periodo</th>
                  <template x-for="day in weekDays" :key="day.dateStr">
                    <th class="p-3.5 text-center border-r border-slate-200 last:border-r-0" :class="day.isToday ? 'bg-brand-50/70' : ''">
                      <div class="text-base font-black uppercase tracking-wider text-slate-500" x-text="day.dayName"></div>
                      <div class="text-lg font-black text-slate-800 mt-0.5" x-text="day.formattedDate"></div>
                    </th>
                  </template>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200 text-base">
                <template x-for="period in [1,2,3,4,5,6,7,8]" :key="period">
                  <tr>
                    <td class="p-3.5 font-black text-slate-800 text-center bg-slate-50 border-r border-slate-200">
                      <div class="font-black text-base text-slate-900" x-text="'Periodo ' + period"></div>
                    </td>

                    <template x-for="day in weekDays" :key="day.dateStr">
                      <td class="p-2 border-r border-slate-200 last:border-r-0 align-top h-36 hover:bg-slate-50/60 transition" :class="day.isToday ? 'bg-brand-50/20' : ''">
                        <div class="space-y-2">
                          <template x-for="item in getBookingsForSlot(day.dateStr, period)" :key="item.id">
                            <div @click="viewDetail(item)" class="p-3 rounded-lg border text-left cursor-pointer transition shadow-xs group hover:border-slate-400 bg-white" :class="getLabStyle(item.labType)">
                              <div class="flex items-center justify-between mb-1.5 gap-1 flex-wrap">
                                <span class="text-xs font-black px-2 py-0.5 rounded border uppercase" :class="getLabBadgeStyle(item.labType)" x-text="getDisplaySpace(item)"></span>
                                <div class="flex items-center gap-1">
                                  <span x-show="item.isExtemp" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-brand-600 text-white uppercase tracking-wider">Extemporánea</span>
                                  <span x-show="item.needsFreshMaterial" title="Requiere Material Fresco" class="text-amber-700"><i class="ph ph-plant-bold text-base"></i></span>
                                </div>
                              </div>

                              <div class="font-extrabold text-base leading-snug">
                                <span :class="getSubjectColorClass(item.subject)" x-text="item.subject"></span>: 
                                <span class="font-bold text-slate-800" x-text="item.practiceName || 'Práctica General'"></span>
                              </div>
                              
                              <div class="text-sm font-semibold truncate mt-1.5 flex items-center gap-1.5 text-slate-600">
                                <span class="w-3 h-3 rounded-full inline-block shrink-0 border border-black/10" :style="'background-color:' + getTeacherColor(item.teacher)"></span>
                                <span x-text="item.teacher" class="text-slate-800"></span>
                              </div>
                            </div>
                          </template>
                        </div>
                      </td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- VISTA LISTA -->
        <div x-show="currentView === 'list'" class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-100 border-b border-slate-200 text-base font-bold text-slate-700 uppercase tracking-wider">
                  <th class="p-4">Orden</th>
                  <th class="p-4">Fecha y Periodo</th>
                  <th class="p-4">Ubicación</th>
                  <th class="p-4">Práctica / Asignatura</th>
                  <th class="p-4">Profesor</th>
                  <th class="p-4">Estatus</th>
                  <th class="p-4 text-right">Acciones</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200 text-base">
                <template x-for="(item, index) in sortedListBookings" :key="item.id">
                  <tr class="hover:bg-slate-50/80 transition">
                    <td class="p-4 whitespace-nowrap font-bold text-slate-400">
                      <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 text-slate-800 text-base font-black border border-slate-200" x-text="'#' + (index + 1)"></span>
                      <span class="block text-xs font-normal text-slate-400 mt-0.5" x-text="formatCreatedAt(item.createdAt)"></span>
                    </td>
                    <td class="p-4 whitespace-nowrap">
                      <div class="font-bold text-slate-900" x-text="formatDisplayDate(item.date)"></div>
                      <div class="text-slate-500 font-medium text-sm" x-text="'Periodo ' + item.startPeriod + (item.durationPeriods > 1 ? ' al ' + (parseInt(item.startPeriod) + parseInt(item.durationPeriods) - 1) : '')"></div>
                    </td>
                    <td class="p-4">
                      <span class="text-sm font-bold px-2.5 py-1 rounded uppercase border" :class="getLabBadgeStyle(item.labType)" x-text="getDisplaySpace(item)"></span>
                    </td>
                    <td class="p-4">
                      <div class="font-bold text-slate-900 text-base" x-text="item.practiceName || 'Práctica General'"></div>
                      <div class="font-black text-sm uppercase" :class="getSubjectColorClass(item.subject)" x-text="item.subject"></div>
                    </td>
                    <td class="p-4">
                      <div class="text-slate-800 font-semibold flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full inline-block shrink-0" :style="'background-color:' + getTeacherColor(item.teacher)"></span>
                        <span x-text="item.teacher"></span>
                      </div>
                      <div class="text-sm text-slate-500" x-text="'Atiende: ' + (item.labTech || 'Sin indicar')"></div>
                    </td>
                    <td class="p-4 whitespace-nowrap">
                      <template x-if="item.isExtemp">
                        <span class="inline-flex items-center gap-1 text-sm font-bold px-3 py-1 rounded-full bg-brand-50 text-brand-800 border border-brand-200">
                          <i class="ph ph-warning-circle"></i> Extemporánea
                        </span>
                      </template>
                      <template x-if="!item.isExtemp">
                        <span class="inline-flex items-center gap-1 text-sm font-bold px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200">
                          <i class="ph ph-check-circle"></i> A Tiempo
                        </span>
                      </template>
                    </td>
                    <td class="p-4 text-right whitespace-nowrap">
                      <button @click="viewDetail(item)" class="text-slate-600 hover:text-slate-900 p-2 rounded-lg hover:bg-slate-100 transition"><i class="ph ph-eye text-xl"></i></button>
                      <button @click="printSingleBooking(item)" class="text-slate-600 hover:text-slate-900 p-2 rounded-lg hover:bg-slate-100 transition"><i class="ph ph-printer text-xl"></i></button>
                      
                      <!-- SOLO SI TIENE PERMISO (ES DEL MAESTRO O ES LABORATORISTA) -->
                      <template x-if="canEditOrDelete(item)">
                        <div class="inline-block">
                          <button @click="editBooking(item)" class="text-slate-600 hover:text-brand-700 p-2 rounded-lg hover:bg-brand-50 transition"><i class="ph ph-pencil-simple text-xl"></i></button>
                          <button @click="deleteBooking(item.id)" class="text-rose-500 hover:text-rose-700 p-2 rounded-lg hover:bg-rose-50 transition"><i class="ph ph-trash text-xl"></i></button>
                        </div>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

      </main>

      <!-- MODAL FORMULARIO -->
      <div x-show="isModalOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
        <div @click.outside="closeModal()" class="bg-white rounded-2xl max-w-2xl w-full shadow-2xl border border-slate-200 overflow-hidden max-h-[90vh] flex flex-col">
          
          <div class="px-6 py-4 bg-brand-600 text-white flex justify-between items-center shrink-0 border-b border-brand-800">
            <div>
              <h2 class="text-xl font-black uppercase tracking-wide" x-text="editingBookingId ? 'Editar Práctica' : 'Agendar Práctica'"></h2>
              <p class="text-base text-rose-100/90 font-medium" x-text="editingBookingId ? 'Modifica los datos de la solicitud' : 'Completa los datos de la solicitud'"></p>
            </div>
            <button @click="closeModal()" class="text-white/80 hover:text-white p-1 rounded-lg transition">
              <i class="ph ph-x text-2xl"></i>
            </button>
          </div>

          <form @submit.prevent="submitForm()" x-ref="modalForm" class="p-6 space-y-5 overflow-y-auto flex-1 text-base">

            <div>
              <label class="block text-base font-extrabold text-slate-800 uppercase tracking-wider mb-1.5">Nombre / Tema de la Práctica *</label>
              <input type="text" x-model="formData.practiceName" required placeholder="Ej. Observación de Mitosis y Meiosis, Titulación Ácido-Base..." class="w-full text-base font-semibold px-3.5 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 bg-white">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
              <div>
                <label class="block text-base font-bold text-slate-800 uppercase tracking-wider mb-1.5">Ubicación *</label>
                <select x-model="formData.labType" required class="w-full text-base font-bold px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 bg-white">
                  <option value="Laboratorio 26">Laboratorio 26</option>
                  <option value="Laboratorio 27">Laboratorio 27</option>
                  <option value="Laboratorio 28">Laboratorio 28</option>
                  <option value="Laboratorio 29">Laboratorio 29</option>
                  <option value="Laboratorio 30">Laboratorio 30</option>
                  <option value="Salón de clases">Salón de clases</option>
                </select>
              </div>

              <div x-show="formData.labType === 'Salón de clases'" x-transition>
                <label class="block text-base font-bold text-brand-800 uppercase tracking-wider mb-1.5">Número / Nombre Salón *</label>

                  <option value="2">Periodo 2</option>
                  <option value="3">Periodo 3</option>
                  <option value="4">Periodo 4</option>
                  <option value="5">Periodo 5</option>
                  <option value="6">Periodo 6</option>
                  <option value="7">Periodo 7</option>
                  <option value="8">Periodo 8</option>
                </select>
              </div>
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1">Duración (Periodos) *</label>

                  <option value="2">2 Periodos continuos</option>
                  <option value="3">3 Periodos continuos</option>
                  <option value="4">4 Periodos continuos</option>

                    <span>Lista Exclusiva de Material Fresco</span>
                  </label>
                  <button type="button" @click="addFreshMaterialRow()" class="text-base font-bold text-amber-900 hover:bg-amber-100 bg-amber-50 border border-amber-300 px-3 py-1 rounded-lg transition flex items-center gap-1">
                    <i class="ph ph-plus-bold"></i> Agregar Insumo
                  </button>
                </div>

                <div class="space-y-2">
                  <template x-for="(item, index) in formData.freshMaterialsList" :key="index">

                      <input type="text" x-model="item.quantity" placeholder="Cantidad / Detalle" class="w-40 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                      <button type="button" @click="removeFreshMaterialRow(index)" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg">
                        <i class="ph ph-trash text-xl"></i>
                      </button>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <div x-show="validationMessage.text" class="p-3.5 rounded-xl text-base font-medium flex items-start gap-2.5 border" :class="validationMessage.isValid ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-amber-50 text-amber-800 border-amber-200'">
              <i class="ph text-xl shrink-0 mt-0.5" :class="validationMessage.isValid ? 'ph-check-circle text-emerald-600' : 'ph-warning-circle text-amber-600'"></i>
              <span x-html="validationMessage.text"></span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1">Cantidad de Alumnos *</label>
                <input type="number" min="1" max="100" x-model="formData.studentsCount" required placeholder="Ej. 25" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 font-semibold">
              </div>
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1">Organización del Grupo *</label>
                <select x-model="formData.groupFormat" required class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 bg-white">
                  <option value="Parejas">En Parejas</option>
                  <option value="Equipos de 3-4">Equipos de 3-4 alumnos</option>
                  <option value="Individual">Individual</option>
                  <option value="Demostrativa / Plenaria">Demostrativa (Grupo Completo)</option>
                </select>
              </div>
            </div>

            <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-2">
              <label class="block text-base font-bold text-slate-800 flex items-center gap-1.5 uppercase tracking-wider">
                <i class="ph ph-file-arrow-up text-brand-600 text-xl"></i>
                <span>Guía / Documento de Práctica <span class="text-slate-400 font-normal lowercase">(opcional)</span></span>
              </label>
              <input type="file" @change="handleFileUpload($event)" accept=".pdf,.doc,.docx,.png,.jpg" class="w-full text-base text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-base file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100">
              <p x-show="formData.fileName" class="text-base text-emerald-700 font-bold flex items-center gap-1 pt-1">
                <i class="ph ph-check-bold"></i> Archivo seleccionado: <span x-text="formData.fileName"></span>
              </p>
            </div>

            <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-2">
              <div class="flex justify-between items-center">
                <label class="text-base font-bold text-slate-800 flex items-center gap-1.5 uppercase tracking-wider">
                  <i class="ph ph-test-tube text-brand-600 text-xl"></i>
                  <span>Reactivos y Soluciones</span>
                </label>
                <button type="button" @click="addReagentRow()" class="text-base font-bold text-slate-700 hover:bg-slate-200 bg-white border border-slate-300 px-3 py-1 rounded-md transition flex items-center gap-1">
                  <i class="ph ph-plus-bold"></i> Agregar
                </button>
              </div>

              <div class="space-y-2">
                <template x-for="(item, index) in formData.reagentsList" :key="index">
                  <div class="flex gap-2 items-center">
                    <input type="text" x-model="item.name" placeholder="Reactivo / Solución" class="flex-1 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <input type="text" x-model="item.concentration" placeholder="Concentración" class="w-32 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <input type="text" x-model="item.volume" placeholder="Volumen" class="w-32 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <button type="button" @click="removeReagentRow(index)" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg">
                      <i class="ph ph-trash text-xl"></i>
                    </button>
                  </div>
                </template>
              </div>
            </div>

            <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-2">
              <div class="flex justify-between items-center">
                <label class="text-base font-bold text-slate-800 flex items-center gap-1.5 uppercase tracking-wider">
                  <i class="ph ph-list-plus text-brand-600 text-xl"></i>
                  <span>Material General y Equipo</span>
                </label>
                <button type="button" @click="addMaterialRow()" class="text-base font-bold text-slate-700 hover:bg-slate-200 bg-white border border-slate-300 px-3 py-1 rounded-md transition flex items-center gap-1">
                  <i class="ph ph-plus-bold"></i> Agregar
                </button>
              </div>

              <div class="space-y-2">
                <template x-for="(item, index) in formData.materialsList" :key="index">
                  <div class="flex gap-2 items-center">
                    <input type="text" x-model="item.name" placeholder="Material o Equipo" class="flex-1 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <input type="text" x-model="item.quantity" placeholder="Cantidad" class="w-36 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <button type="button" @click="removeMaterialRow(index)" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg">
                      <i class="ph ph-trash text-xl"></i>
                    </button>
                  </div>
                </template>
              </div>
            </div>

            <div class="flex justify-end gap-3 pt-3 border-t border-slate-200 sticky bottom-0 bg-white py-2">
              <button type="button" @click="closeModal()" class="px-5 py-2.5 text-base font-bold text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancelar</button>
              <button type="submit" :disabled="isLoading" class="px-6 py-2.5 text-base font-black text-white bg-brand-600 hover:bg-brand-700 disabled:bg-slate-300 rounded-lg transition shadow-xs" x-text="isLoading ? 'Guardando...' : (editingBookingId ? 'Guardar Cambios' : 'Confirmar Agendamiento')"></button>
            </div>

          </form>
        </div>
      </div>

      <!-- MODAL REPORTE GENERAL -->
      <div x-show="isPrintModalOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-200">
          <h3 class="text-lg font-black text-slate-900 uppercase tracking-wide">Generar Reporte PDF</h3>
          <p class="text-base text-slate-600">Selecciona el tipo de reporte e intervalo:</p>
          
          <div>
            <label class="block text-base font-bold text-slate-700 mb-1">Tipo de Reporte:</label>
            <select x-model="reportType" class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg mb-3">
              <option value="Diario">Reporte Diario</option>
              <option value="Semanal">Reporte Semanal</option>
              <option value="Mensual">Reporte Mensual</option>
            </select>

            <label class="block text-base font-bold text-slate-700 mb-1">Fecha Base:</label>
            <input type="date" x-model="printDate" class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg">
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <button @click="isPrintModalOpen = false" class="px-4 py-2 text-base font-bold text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
            <button @click="triggerPrintReport()" class="px-5 py-2 text-base font-black text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-xs">Generar PDF</button>
          </div>
        </div>
      </div>

      <!-- MODAL REPORTE MATERIAL FRESCO -->
      <div x-show="isFreshMaterialModalOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-200">
          <h3 class="text-lg font-black text-amber-900 flex items-center gap-2 uppercase tracking-wide">
            <i class="ph ph-plant text-amber-600 text-xl"></i> Reporte Material Fresco
          </h3>
          <p class="text-base text-slate-600">Genera la lista consolidada de insumos frescos para la semana:</p>
          
          <div>
            <label class="block text-base font-bold text-slate-700 mb-1">Semana del reporte:</label>
            <input type="date" x-model="freshMaterialPrintDate" class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg">
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <button @click="isFreshMaterialModalOpen = false" class="px-4 py-2 text-base font-bold text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
            <button @click="triggerFreshMaterialPrint()" class="px-5 py-2 text-base font-black text-white bg-amber-600 hover:bg-amber-700 rounded-lg shadow-xs">Generar Lista Insumos</button>
          </div>
        </div>
      </div>

      <!-- MODAL DETALLE -->
      <div x-show="selectedBooking !== null" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl border border-slate-200 overflow-hidden">
          <template x-if="selectedBooking">
            <div>
              <div class="p-6 bg-slate-50 border-b border-slate-200 flex justify-between items-start">
                <div>
                  <div class="flex items-center gap-2 mb-1.5">
                    <span class="inline-block px-3 py-0.5 rounded text-sm font-black uppercase border" :class="getLabBadgeStyle(selectedBooking.labType)" x-text="getDisplaySpace(selectedBooking)"></span>
                    <span x-show="selectedBooking.isExtemp" class="text-xs font-bold px-2 py-0.5 rounded bg-brand-600 text-white uppercase">Extemporánea</span>
                  </div>
                  <h3 class="text-lg sm:text-xl font-black text-slate-900" x-text="selectedBooking.practiceName || 'Práctica General'"></h3>
                  <p class="text-base font-black uppercase mt-1" :class="getSubjectColorClass(selectedBooking.subject)" x-text="selectedBooking.subject"></p>
                  <div class="text-base font-semibold flex items-center gap-1.5 mt-2 text-slate-800">
                    <span class="w-3 h-3 rounded-full inline-block shrink-0" :style="'background-color:' + getTeacherColor(selectedBooking.teacher)"></span>
                    <span x-text="'Profesor: ' + selectedBooking.teacher"></span>
                  </div>
                  <div class="text-sm text-slate-500 font-medium mt-0.5" x-text="'Atiende: ' + (selectedBooking.labTech || 'Sin especificar')"></div>
                </div>
                <button @click="selectedBooking = null" class="text-slate-400 hover:text-slate-600 p-1">
                  <i class="ph ph-x text-2xl"></i>
                </button>
              </div>

              <div class="p-6 space-y-4 text-base text-slate-700">
                <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3.5 rounded-lg border border-slate-200">
                  <div>
                    <span class="text-slate-500 block text-xs font-bold uppercase">Fecha:</span>
                    <span class="font-bold text-slate-900" x-text="formatDisplayDate(selectedBooking.date)"></span>
                  </div>
                  <div>
                    <span class="text-slate-500 block text-xs font-bold uppercase">Horario:</span>
                    <span class="font-bold text-slate-900" x-text="'Periodo ' + selectedBooking.startPeriod + (selectedBooking.durationPeriods > 1 ? ' - ' + (parseInt(selectedBooking.startPeriod) + parseInt(selectedBooking.durationPeriods) - 1) : '')"></span>
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-3 border-b border-slate-100 pb-3">
                  <div>
                    <span class="text-slate-500 block text-xs font-bold uppercase">Alumnos:</span>
                    <span class="font-bold text-slate-800" x-text="selectedBooking.studentsCount + ' estudiantes'"></span>
                  </div>
                  <div>
                    <span class="text-slate-500 block text-xs font-bold uppercase">Modalidad:</span>
                    <span class="font-bold text-slate-800" x-text="selectedBooking.groupFormat"></span>
                  </div>
                </div>

                <div x-show="selectedBooking.freshMaterialsList && selectedBooking.freshMaterialsList.length > 0">
                  <span class="text-amber-900 font-black block mb-1 uppercase tracking-wider text-xs">Insumos Frescos o Especiales:</span>
                  <div class="bg-amber-50/80 p-3.5 rounded-lg border border-amber-200 space-y-1">
                    <template x-for="fmat in selectedBooking.freshMaterialsList" :key="fmat.name">
                      <div class="flex justify-between border-b border-amber-200/60 pb-1 last:border-b-0 text-base">
                        <span class="font-bold text-amber-900" x-text="fmat.name"></span>
                        <span class="text-amber-800 font-semibold" x-text="fmat.quantity"></span>
                      </div>
                    </template>
                  </div>
                </div>

                <div x-show="selectedBooking.fileData">
                  <span class="text-slate-500 block text-xs font-bold uppercase mb-1">Guía Adjunta:</span>
                  <a :href="selectedBooking.fileData" :download="selectedBooking.fileName || 'guia_practica'" class="inline-flex items-center gap-2 text-base font-bold text-brand-700 bg-brand-50 border border-brand-200 px-4 py-2 rounded-lg hover:bg-brand-100 transition">
                    <i class="ph ph-download-simple text-xl"></i>
                    <span x-text="selectedBooking.fileName || 'Descargar Guía Adjunta'"></span>
                  </a>
                </div>

                <div x-show="selectedBooking.reagentsList && selectedBooking.reagentsList.length > 0">

                  <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-1">
                    <template x-for="reag in selectedBooking.reagentsList" :key="reag.name">
                      <div class="flex justify-between text-base border-b border-slate-200 pb-1 last:border-b-0">
                        <span class="font-bold text-slate-800" x-text="reag.name"></span>
                        <span class="text-slate-600 font-medium" x-text="reag.concentration + ' | ' + reag.volume"></span>
                      </div>
                    </template>
                  </div>
                </div>

                <div>
                  <span class="text-slate-500 block text-xs font-bold uppercase mb-1">Materiales Generales:</span>
                  <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-1">
                    <template x-for="mat in selectedBooking.materialsList" :key="mat.name">
                      <div class="flex justify-between border-b border-slate-200 pb-1 last:border-b-0 text-base">
                        <span class="font-semibold text-slate-800" x-text="mat.name"></span>
                        <span class="text-slate-600" x-text="mat.quantity"></span>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

              <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-between items-center">
                <div class="flex gap-2">
                  <button @click="printSingleBooking(selectedBooking)" class="px-3.5 py-2 bg-slate-200 text-slate-800 hover:bg-slate-300 text-base font-bold rounded-lg transition flex items-center gap-1">
                    <i class="ph ph-printer text-lg"></i> Imprimir
                  </button>
                  <template x-if="canEditOrDelete(selectedBooking)">

                      <button @click="editBooking(selectedBooking)" class="px-3.5 py-2 bg-brand-50 text-brand-700 border border-brand-200 hover:bg-brand-100 text-base font-bold rounded-lg transition flex items-center gap-1">

                      <button @click="deleteBooking(selectedBooking.id)" class="px-3.5 py-2 bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100 text-base font-bold rounded-lg transition flex items-center gap-1">
                        <i class="ph ph-trash text-lg"></i> Eliminar
                      </button>
                    </div>
                  </template>
                </div>
                <button @click="selectedBooking = null" class="px-4 py-2 bg-slate-200 text-slate-700 text-base font-bold rounded-lg hover:bg-slate-300">Cerrar</button>
              </div>
            </div>
          </template>
        </div>
      </div>

    </div>
  </template>

        <h1 class="text-2xl font-black uppercase text-brand-700 tracking-wide" x-text="printHeaderTitle"></h1>
        <p class="text-base font-semibold text-slate-600" x-text="printHeaderSubtitle"></p>

      <div class="text-right">
        <div class="text-base font-bold text-slate-800" x-text="printHeaderDate"></div>
        <div class="text-sm text-slate-500" x-text="'Impreso el: ' + new Date().toLocaleDateString('es-ES')"></div>
      </div>
    </div>

                  <span class="text-sm font-black uppercase px-2 py-0.5 rounded border" :class="getLabBadgeStyle(item.labType)" x-text="getDisplaySpace(item)"></span>

    function appData() {

          { id: 'andrea', name: 'Andrea Domínguez', title: 'Profesora', role: 'teacher', pass: 'andrea2026' }
        ],

        selectedUserKey: '',
        inputPassword: '',
        showPassword: false,
        authError: false,
        currentUser: null,

        binId: '6ada1480ffd5d1605382c335',
        masterKey: '$2a$10$BE8f0GOmC3mfw73ErHZf2uWgGvlSZY.SyhqRA3vQxdF3fL6Cn5WDq',
        
        currentView: 'calendar',
        currentWeekOffset: 0,
        isModalOpen: false,
        isPrintModalOpen: false,
        isFreshMaterialModalOpen: false,
        isLoading: false,
        selectedBooking: null,
        editingBookingId: null,
        selectedLabFilter: 'ALL',
        printDate: new Date().toISOString().split('T')[0],
        freshMaterialPrintDate: new Date().toISOString().split('T')[0],
        reportType: 'Diario',
        bookings: [],

        printMode: 'standard',
        printHeaderTitle: 'Reporte Diario',
        printHeaderSubtitle: 'Bitácora de Agendamiento e Insumos de Laboratorio',
        printHeaderDate: '',
        activePrintBookings: [],
        activeFreshPrintBookings: [],
        
        labOptions: [
          { id: 26, name: 'Laboratorio 26' },
          { id: 27, name: 'Laboratorio 27' },
          { id: 28, name: 'Laboratorio 28' },
          { id: 29, name: 'Laboratorio 29' },
          { id: 30, name: 'Laboratorio 30' },

        teacherPalette: [
          '#0284c7', '#7c3aed', '#059669', '#d97706', '#dc2626',
          '#4f46e5', '#0891b2', '#65a30d', '#c026d3', '#ea580c'
        ],

        formData: {
          practiceName: '',
          labType: 'Laboratorio 26',
          classroomNumber: '',
          teacher: '',
          labTech: '',
          subject: 'Biología',
          date: '',
          startPeriod: '1',
          durationPeriods: '1',
          needsFreshMaterial: false,
          freshMaterialsList: [{ name: '', quantity: '' }],
          studentsCount: '',
          groupFormat: 'Parejas',
          reagentsList: [{ name: '', concentration: '', volume: '' }],
          materialsList: [{ name: '', quantity: '' }],
          fileData: null,
          fileName: '',
          isExtemp: false
        },

        validationMessage: {
          isValid: true,
          text: ''
        },

        async initData() {
          const savedUserId = localStorage.getItem('lancaster_user_id');
          if (savedUserId) {
            const user = this.usersList.find(u => u.id === savedUserId);
            if (user) {
              this.currentUser = user;
              await this.fetchFromCloud();
              this.checkUpcomingBookings();
            }
          }

          setInterval(() => {
            if (this.currentUser) {
              this.fetchFromCloud(true);
            }
          }, 30000);
        },

        login() {
          const user = this.usersList.find(u => u.id === this.selectedUserKey);
          if (user && user.pass === this.inputPassword) {
            this.currentUser = user;
            this.authError = false;
            localStorage.setItem('lancaster_user_id', user.id);
            this.fetchFromCloud();
            this.checkUpcomingBookings();
          } else {
            this.authError = true;
          }
        },

        logout() {
          this.currentUser = null;
          this.selectedUserKey = '';
          this.inputPassword = '';
          localStorage.removeItem('lancaster_user_id');
        },

        // VALIDACIÓN DE PERMISO EDITAR/BORRAR
        canEditOrDelete(item) {
          if (!this.currentUser) return false;
          // Si es laboratorista (admin), puede modificar cualquier práctica
          if (this.currentUser.role === 'admin') return true;
          // Si es profesor, solo puede modificar sus propias prácticas
          return item.teacher === this.currentUser.name;
        },

        getSubjectColorClass(subject) {
          switch(subject) {
            case 'Biología': return 'text-emerald-600 font-black';
            case 'Física': return 'text-sky-600 font-black';
            case 'Química': return 'text-orange-500 font-black';
            case 'Ciencias Integradas': return 'text-amber-500 font-black';
            default: return 'text-brand-700 font-black';
          }
        },

        get upcomingBookingsList() {
          const today = new Date();
          const tomorrow = new Date();
          tomorrow.setDate(today.getDate() + 1);

          const todayStr = today.toISOString().split('T')[0];
          const tomorrowStr = tomorrow.toISOString().split('T')[0];

          return this.bookings.filter(b => b.date === todayStr || b.date === tomorrowStr);
        },

        get upcomingBookingsCount() {
          return this.upcomingBookingsList.length;
        },

        checkUpcomingBookings() {
          if (this.upcomingBookingsList.length > 0) {
            let listHtml = '<div class="text-left text-base space-y-2 mt-2">';
            
            this.upcomingBookingsList.forEach(b => {
              const space = b.labType === 'Salón de clases' ? (b.classroomNumber || 'Salón de clases') : b.labType;
              listHtml += `
                <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg">
                  <div class="flex justify-between font-bold text-slate-900">
                    <span>${b.practiceName ? b.practiceName : b.subject}</span>
                    <span class="text-brand-700">${space}</span>
                  </div>
                  <div class="text-slate-600 mt-0.5">
                    <strong>Profesor:</strong> ${b.teacher} | <strong>Materia:</strong> ${b.subject} | <strong>Periodo:</strong> ${b.startPeriod}
                  </div>
                  <div class="text-slate-500 font-semibold text-sm mt-0.5">
                    ${this.formatDisplayDate(b.date)}
                  </div>
                </div>
              `;
            });
            listHtml += '</div>';

            Swal.fire({
              title: '🔔 Prácticas Próximas',
              html: `<p class="text-base text-slate-600">Se encontraron ${this.upcomingBookingsList.length} prácticas agendadas para <strong>hoy o mañana</strong>:</p>${listHtml}`,
              icon: 'info',
              confirmButtonText: 'Entendido',
              confirmColor: '#c8102e',
              customClass: {
                popup: 'rounded-2xl',
                title: 'text-lg font-bold text-slate-900'
              }
            });
          }
        },

        showUpcomingAlertManual() {
          if (this.upcomingBookingsList.length === 0) {
            Swal.fire({
              title: 'Sin Prácticas Próximas',
              text: 'No hay prácticas agendadas para el día de hoy ni para mañana.',
              icon: 'info',
              confirmColor: '#c8102e'
            });
          } else {
            this.checkUpcomingBookings();
          }
        },

        async fetchFromCloud(silent = false) {
          if (!silent) this.isLoading = true;
          try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${this.binId}/latest`, {
              method: 'GET',
              headers: { 'X-Master-Key': this.masterKey }
            });
            if (res.ok) {
              const json = await res.json();
              if (Array.isArray(json.record)) {
                this.bookings = json.record;
              } else {
                this.bookings = [];
              }
            }
          } catch (e) {
            console.error('Error al sincronizar:', e);
          } finally {
            this.isLoading = false;
          }
        },

        async saveToCloud() {
          this.isLoading = true;
          try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${this.binId}`, {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': this.masterKey
              },
              body: JSON.stringify(this.bookings)
            });
            if (!res.ok) throw new Error('Error al guardar');
          } catch (e) {
            console.error(e);
            Swal.fire({
              icon: 'error',
              title: 'Error de conexión',
              text: 'No se pudieron sincronizar los cambios en la nube.'
            });
          } finally {
            this.isLoading = false;
          }
        },

        get sortedListBookings() {
          return [...this.filteredListBookings].sort((a, b) => (a.createdAt || a.id) - (b.createdAt || b.id));
        },

        formatCreatedAt(ts) {
          if (!ts) return 'N/A';
          const d = new Date(ts);
          return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        },

        handleFileUpload(event) {
          const file = event.target.files[0];
          if (!file) return;
          if (file.size > 3 * 1024 * 1024) {
            Swal.fire('Archivo muy grande', 'El archivo no debe exceder 3MB.', 'warning');
            return;
          }
          const reader = new FileReader();
          reader.onload = (e) => {
            this.formData.fileData = e.target.result;
            this.formData.fileName = file.name;
          };
          reader.readAsDataURL(file);
        },

        getTeacherColor(teacherName) {
          if (!teacherName) return '#64748b';
          let hash = 0;
          for (let i = 0; i < teacherName.length; i++) {
            hash = teacherName.charCodeAt(i) + ((hash << 5) - hash);
          }
          const index = Math.abs(hash) % this.teacherPalette.length;
          return this.teacherPalette[index];
        },

        getDisplaySpace(item) {
          if (item.labType === 'Salón de clases') {
            return item.classroomNumber ? item.classroomNumber : 'Salón de clases';
          }
          return item.labType;
        },

        getLabStyle(labName) {
          switch(labName) {
            case 'Laboratorio 26': return 'border-l-4 border-l-purple-600';
            case 'Laboratorio 27': return 'border-l-4 border-l-sky-600';
            case 'Laboratorio 28': return 'border-l-4 border-l-emerald-600';
            case 'Laboratorio 29': return 'border-l-4 border-l-amber-600';
            case 'Laboratorio 30': return 'border-l-4 border-l-rose-600';
            case 'Salón de clases': return 'border-l-4 border-l-slate-600';
            default: return 'border-l-4 border-l-slate-400';
          }
        },

        getLabBadgeStyle(labName) {
          switch(labName) {
            case 'Laboratorio 26': return 'bg-purple-50 text-purple-800 border-purple-200';
            case 'Laboratorio 27': return 'bg-sky-50 text-sky-800 border-sky-200';
            case 'Laboratorio 28': return 'bg-emerald-50 text-emerald-800 border-emerald-200';
            case 'Laboratorio 29': return 'bg-amber-50 text-amber-800 border-amber-200';
            case 'Laboratorio 30': return 'bg-rose-50 text-rose-800 border-rose-200';
            case 'Salón de clases': return 'bg-slate-100 text-slate-800 border-slate-300';
            default: return 'bg-slate-100 text-slate-800';
          }
        },

        addFreshMaterialRow() {
          if (!this.formData.freshMaterialsList) {
            this.formData.freshMaterialsList = [];
          }
          this.formData.freshMaterialsList.push({ name: '', quantity: '' });
        },

        removeFreshMaterialRow(index) {
          if (this.formData.freshMaterialsList.length > 1) {
            this.formData.freshMaterialsList.splice(index, 1);
          }
        },

        addReagentRow() {
          this.formData.reagentsList.push({ name: '', concentration: '', volume: '' });
        },

        removeReagentRow(index) {
          this.formData.reagentsList.splice(index, 1);
        },

        addMaterialRow() {
          this.formData.materialsList.push({ name: '', quantity: '' });
        },

        removeMaterialRow(index) {
          if (this.formData.materialsList.length > 1) {
            this.formData.materialsList.splice(index, 1);
          }
        },

        get currentWeekStartDate() {
          const now = new Date();
          const dayOfWeek = now.getDay(); 
          const diffToMonday = now.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
          const monday = new Date(now.setDate(diffToMonday));
          monday.setDate(monday.getDate() + (this.currentWeekOffset * 7));
          monday.setHours(0,0,0,0);
          return monday;
        },

        get weekDays() {
          const days = [];
          const start = this.currentWeekStartDate;
          const todayStr = new Date().toISOString().split('T')[0];
          const dayNames = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

          for (let i = 0; i < 6; i++) {
            const d = new Date(start);
            d.setDate(d.getDate() + i);
            const dateStr = d.toISOString().split('T')[0];
            days.push({
              dayName: dayNames[i],
              dateStr: dateStr,
              formattedDate: d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }),
              isToday: dateStr === todayStr
            });
          }
          return days;
        },

        get weekRangeText() {
          const start = this.currentWeekStartDate;
          const end = new Date(start);
          end.setDate(end.getDate() + 5);
          return `${start.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })} - ${end.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' })}`;
        },

        changeWeek(offset) {
          this.currentWeekOffset += offset;
        },

        resetToCurrentWeek() {
          this.currentWeekOffset = 0;
        },

        getBookingsForSlot(dateStr, period) {
          return this.bookings.filter(b => {
            if (b.date !== dateStr) return false;
            if (this.selectedLabFilter !== 'ALL' && b.labType !== this.selectedLabFilter) return false;
            const startP = parseInt(b.startPeriod);
            const durP = parseInt(b.durationPeriods);
            const endP = startP + durP - 1;
            return period >= startP && period <= endP;
          });
        },

        get filteredListBookings() {
          const days = this.weekDays.map(d => d.dateStr);
          return this.bookings.filter(b => days.includes(b.date) && (this.selectedLabFilter === 'ALL' || b.labType === this.selectedLabFilter));
        },

        validateRules() {
          if (!this.formData.date) {
            this.validationMessage = { isValid: false, text: 'Seleccione una fecha para la práctica.' };
            return;
          }

          const now = new Date();
          const targetDate = new Date(this.formData.date + 'T00:00:00');
          const diffHours = (targetDate - now) / (1000 * 60 * 60);

          let isExtemp = false;
          let messages = [];

          if (diffHours < 48) {
            isExtemp = true;
            messages.push('Faltan menos de 48h de anticipación.');
          }

          if (this.formData.needsFreshMaterial) {
            const diffDays = (targetDate - now) / (1000 * 60 * 60 * 24);
            
            if (diffDays < 2) {
              isExtemp = true;
              messages.push('Material fresco requiere mínimo 2 días de anticipación.');
            }

            const targetDayOfWeek = targetDate.getDay(); 
            const diffToMonday = targetDate.getDate() - targetDayOfWeek + (targetDayOfWeek === 0 ? -6 : 1);
            const practiceMonday = new Date(targetDate);
            practiceMonday.setDate(diffToMonday);
            practiceMonday.setHours(0,0,0,0);

            const deadlineWednesday = new Date(practiceMonday);
            deadlineWednesday.setDate(deadlineWednesday.getDate() - 5); 
            deadlineWednesday.setHours(12, 0, 0, 0);

            if (now > deadlineWednesday) {
              isExtemp = true;
              messages.push('Material fresco solicitado después del Miércoles 12:00 PM previo.');
            }
          }

          this.formData.isExtemp = isExtemp;

          if (isExtemp) {
            this.validationMessage = {
              isValid: true,
              text: `<strong>Práctica Extemporánea:</strong> La práctica se registrará marcada como extemporánea. (${messages.join(' ')})`
            };
          } else {
            this.validationMessage = {
              isValid: true,
              text: '<strong>Solicitud a Tiempo:</strong> Cumple con los requisitos de anticipación.'
            };
          }
        },

        openModal() {
          this.editingBookingId = null;
          this.formData = {
            practiceName: '',
            labType: 'Laboratorio 26',
            classroomNumber: '',
            teacher: this.currentUser.role === 'teacher' ? this.currentUser.name : '',
            labTech: this.currentUser.role === 'admin' ? this.currentUser.name : '',
            subject: 'Biología',
            date: '',
            startPeriod: '1',
            durationPeriods: '1',
            needsFreshMaterial: false,
            freshMaterialsList: [{ name: '', quantity: '' }],
            studentsCount: '',
            groupFormat: 'Parejas',
            reagentsList: [{ name: '', concentration: '', volume: '' }],
            materialsList: [{ name: '', quantity: '' }],
            fileData: null,
            fileName: '',
            isExtemp: false
          };
          this.validationMessage = { isValid: false, text: '' };
          this.isModalOpen = true;
          this.$nextTick(() => {
            if (this.$refs.modalForm) this.$refs.modalForm.scrollTop = 0;
          });
        },

        editBooking(item) {
          if (!this.canEditOrDelete(item)) {
            Swal.fire('Acceso denegado', 'No tienes permiso para modificar las prácticas de otro profesor.', 'warning');
            return;
          }
          this.selectedBooking = null;
          this.editingBookingId = item.id;
          this.formData = JSON.parse(JSON.stringify(item));
          if (!this.formData.materialsList || this.formData.materialsList.length === 0) {
            this.formData.materialsList = [{ name: '', quantity: '' }];
          }
          if (!this.formData.freshMaterialsList || this.formData.freshMaterialsList.length === 0) {
            this.formData.freshMaterialsList = [{ name: '', quantity: '' }];
          }
          if (!this.formData.reagentsList) {
            this.formData.reagentsList = [{ name: '', concentration: '', volume: '' }];
          }
          this.validateRules();
          this.isModalOpen = true;
          this.$nextTick(() => {
            if (this.$refs.modalForm) this.$refs.modalForm.scrollTop = 0;
          });
        },

        closeModal() {
          this.isModalOpen = false;
          this.editingBookingId = null;
        },

        openDailyPrintModal() {
          this.isPrintModalOpen = true;
        },

        openFreshMaterialModal() {
          this.isFreshMaterialModalOpen = true;
        },

        printSingleBooking(item) {
          this.printMode = 'standard';
          this.printHeaderTitle = 'Reporte de Práctica de Laboratorio';
          this.printHeaderSubtitle = 'Hoja Individual de Trabajo';
          this.printHeaderDate = this.formatDisplayDate(item.date);
          this.activePrintBookings = [item];
          this.selectedBooking = null;

          setTimeout(() => {
            window.print();
          }, 300);
        },

        triggerPrintReport() {
          this.printMode = 'standard';
          this.isPrintModalOpen = false;
          
          const baseDate = new Date(this.printDate + 'T00:00:00');
          this.printHeaderTitle = `Reporte ${this.reportType}`;
          this.printHeaderSubtitle = 'Bitácora de Agendamiento e Insumos de Laboratorio';

          if (this.reportType === 'Diario') {
            this.printHeaderDate = this.formatDisplayDate(this.printDate);
            this.activePrintBookings = this.bookings.filter(b => b.date === this.printDate);
          } else if (this.reportType === 'Semanal') {
            const dayOfWeek = baseDate.getDay();
            const diffToMonday = baseDate.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
            const monday = new Date(baseDate.setDate(diffToMonday));
            const saturday = new Date(monday);
            saturday.setDate(saturday.getDate() + 5);

            const startStr = monday.toISOString().split('T')[0];
            const endStr = saturday.toISOString().split('T')[0];

            this.printHeaderDate = `${monday.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })} al ${saturday.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' })}`;
            this.activePrintBookings = this.bookings.filter(b => b.date >= startStr && b.date <= endStr);
          } else if (this.reportType === 'Mensual') {
            const year = baseDate.getFullYear();
            const month = baseDate.getMonth();
            const monthName = baseDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });

            this.printHeaderDate = monthName.toUpperCase();
            this.activePrintBookings = this.bookings.filter(b => {
              const d = new Date(b.date + 'T00:00:00');
              return d.getFullYear() === year && d.getMonth() === month;
            });
          }

          setTimeout(() => {
            window.print();
          }, 300);
        },

        triggerFreshMaterialPrint() {
          this.printMode = 'freshMaterial';
          this.isFreshMaterialModalOpen = false;

          const baseDate = new Date(this.freshMaterialPrintDate + 'T00:00:00');
          const dayOfWeek = baseDate.getDay();
          const diffToMonday = baseDate.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
          const monday = new Date(baseDate.setDate(diffToMonday));
          const saturday = new Date(monday);
          saturday.setDate(saturday.getDate() + 5);

          const startStr = monday.toISOString().split('T')[0];
          const endStr = saturday.toISOString().split('T')[0];

          this.printHeaderTitle = 'Reporte de Material Fresco e Insumos';
          this.printHeaderSubtitle = 'Consolidado Semanal de Requerimientos';
          this.printHeaderDate = `${monday.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })} al ${saturday.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' })}`;

          this.activeFreshPrintBookings = this.bookings.filter(b => b.needsFreshMaterial && b.date >= startStr && b.date <= endStr);

          setTimeout(() => {
            window.print();
          }, 300);
        },

        async submitForm() {
          const cleanMaterials = this.formData.materialsList.filter(m => m.name.trim() !== '');
          const cleanReagents = this.formData.reagentsList.filter(r => r.name.trim() !== '');
          const cleanFreshMaterials = this.formData.freshMaterialsList ? this.formData.freshMaterialsList.filter(f => f.name.trim() !== '') : [];

          if (this.editingBookingId) {
            const index = this.bookings.findIndex(b => b.id === this.editingBookingId);
            if (index !== -1) {
              this.bookings[index] = {
                ...this.formData,
                id: this.editingBookingId,
                materialsList: cleanMaterials,
                reagentsList: cleanReagents,
                freshMaterialsList: cleanFreshMaterials,
                status: 'Aprobada'
              };
            }
          } else {
            const newBooking = {
              id: Date.now(),
              createdAt: Date.now(),
              ...this.formData,
              materialsList: cleanMaterials,
              reagentsList: cleanReagents,
              freshMaterialsList: cleanFreshMaterials,
              status: 'Aprobada'
            };
            this.bookings.push(newBooking);
          }

          await this.saveToCloud();
          this.closeModal();

          Swal.fire({
            icon: 'success',
            title: this.editingBookingId ? '¡Práctica Actualizada!' : '¡Práctica Agendada!',
            text: 'Los cambios se guardaron correctamente.',
            confirmColor: '#c8102e'
          });
        },

        viewDetail(item) {
          this.selectedBooking = item;
        },

        async deleteBooking(id) {
          const targetItem = this.bookings.find(b => b.id === id);
          if (targetItem && !this.canEditOrDelete(targetItem)) {
            Swal.fire('Acceso denegado', 'No tienes permiso para eliminar las prácticas de otro profesor.', 'warning');
            return;
          }

          this.selectedBooking = null;
          Swal.fire({
            title: '¿Eliminar registro?',
            text: 'Esta acción no se puede deshacer.',
            icon: 'warning',
            showCancelButton: true,
            confirmColor: '#c8102e',
            cancelColor: '#64748b',
            confirmButtonText: 'Sí, eliminar',
            cancelButtonText: 'Cancelar'
          }).then(async (result) => {
            if (result.isConfirmed) {
              this.bookings = this.bookings.filter(b => b.id !== id);
              await this.saveToCloud();
              Swal.fire({
                icon: 'success',
                title: 'Eliminado',
                text: 'El registro ha sido eliminado.',
                confirmColor: '#c8102e'
              });
            }
          });
        },

        formatDisplayDate(dateStr) {
          if (!dateStr) return '';
          const parts = dateStr.split('-');
          const d = new Date(parts[0], parts[1] - 1, parts[2]);
          return d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
        },

        exportCSV() {
          if (this.bookings.length === 0) {
            Swal.fire('Sin datos', 'No hay registros para exportar', 'info');
            return;
          }

          let csvContent = "data:text/csv;charset=utf-8,ID_Orden,Timestamp,Nombre_Practica,Ubicacion,Profesor,Laboratorista,Materia,Fecha,Periodo_Inicio,Duracion_Periodos,Alumnos,Formato,Material_Fresco,Extemporanea,Estado\n";
          this.sortedListBookings.forEach(b => {
            const space = b.labType === 'Salón de clases' ? b.classroomNumber : b.labType;
            csvContent += `${b.id},"${this.formatCreatedAt(b.createdAt)}","${b.practiceName || ''}","${space}","${b.teacher}","${b.labTech || ''}","${b.subject}",${b.date},${b.startPeriod},${b.durationPeriods},${b.studentsCount},"${b.groupFormat}",${b.needsFreshMaterial ? 'SI' : 'NO'},${b.isExtemp ? 'SI' : 'NO'},${b.status}\n`;
          });

          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", `bitacora_laboratorios_${new Date().toISOString().split('T')[0]}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }
      };
    }
  </script>
</body>
</html>
