<head>

  <!-- CSS de Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tipografía clara y discreta -->
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Iconos Phosphor -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Source Sans 3', 'Segoe UI', 'Arial', 'sans-serif'],
            display: ['Source Sans 3', 'Segoe UI', 'Arial', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#e11d48',
              600: '#c8102e', // Rojo institucional Escuela de Lancaster
              700: '#9f1239',
              800: '#881337',
              900: '#4c0519',
            }
          }
        }
      }
    }
  </script>

  <style id="lancaster-visual-refresh">
    :root { color-scheme: light; --lan-red:#c8102e; --lan-navy:#172b4d; --lan-bg:#f3f5f9; }
    html { scroll-behavior:smooth; }
    body { background:var(--lan-bg) !important; }
    h1,h2,h3,h4 { letter-spacing:-.018em; }
    button,a,select,input,textarea { -webkit-tap-highlight-color:transparent; }
    button { transition:background-color .16s ease,border-color .16s ease,box-shadow .16s ease,transform .16s ease; }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid rgba(200,16,46,.28); outline-offset:2px; }
    header { background:linear-gradient(112deg,#b70e2b 0%,#c8102e 54%,#9f1239 100%) !important; box-shadow:0 8px 24px rgba(23,43,77,.13) !important; }
    header .min-h-\[5rem\] { min-height:4.5rem !important; }
    main { max-width: min(100% - 2rem, 1480px) !important; padding-top:1.35rem !important; }
    main > div { scroll-margin-top:6rem; }
    /* Navegación de módulos: todas las opciones quedan visibles y pueden ocupar varias filas. */
    .module-nav { display:flex !important; flex-wrap:wrap !important; align-items:center; gap:.35rem !important; overflow:visible !important; max-width:100% !important; width:100%; padding:.35rem !important; background:#f8fafc !important; border:1px solid #e2e8f0 !important; border-radius:14px !important; }
    .module-nav > button { flex:0 0 auto; min-height:42px; padding:.58rem .82rem !important; border-radius:10px !important; font-size:.94rem !important; }
    .module-nav > button:hover { transform:translateY(-1px); }
    .module-nav + div { margin-left:0 !important; }
    /* Paneles, tarjetas y superficies */
    main .bg-white.rounded-xl, main .bg-white.rounded-2xl { border-color:#e3e8f0 !important; box-shadow:0 3px 14px rgba(23,43,77,.045); }
    main .rounded-xl.border, main .rounded-2xl.border { border-color:#e1e7ef; }
    main .shadow-xs { box-shadow:0 3px 12px rgba(23,43,77,.055) !important; }
    main input,main select,main textarea { border-radius:10px !important; min-height:40px; }
    main button.rounded-lg, main a.rounded-lg { border-radius:10px !important; }
    main table thead th { letter-spacing:.045em; }
    main table tbody tr:hover td { transition:background-color .15s ease; }
    main table td { vertical-align:top; }
    /* Mejor lectura en avisos superiores */
    main > div.grid.grid-cols-1.md\:grid-cols-2 { gap:1rem !important; }
    /* Scrollbars discretas, sin ocultar desplazamiento cuando una tabla sí lo necesita. */
    * { scrollbar-color:#cbd5e1 transparent; scrollbar-width:thin; }
    ::-webkit-scrollbar { width:9px; height:9px; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:20px; border:2px solid transparent; background-clip:padding-box; }
    ::-webkit-scrollbar-thumb:hover { background:#94a3b8; background-clip:padding-box; }
    @media (max-width:760px) {
      main { max-width:100% !important; padding-left:.75rem !important; padding-right:.75rem !important; padding-top:.85rem !important; }
      header .min-h-\[5rem\] { min-height:auto !important; }
      .module-nav { gap:.25rem !important; }
      .module-nav > button { flex:1 1 auto; justify-content:center; padding:.55rem .58rem !important; font-size:.86rem !important; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; animation-duration:.01ms !important; } }
    @media print { header { background:#fff !important; color:#111 !important; box-shadow:none !important; } main { max-width:100% !important; } }
  </style>
  <style>
    [x-cloak] { display: none !important; }
    h1, h2, h3, h4 { font-family: 'Source Sans 3', 'Segoe UI', Arial, sans-serif; font-weight:700; letter-spacing:-.012em; }
    body, input, select, textarea, button { font-family:'Source Sans 3','Segoe UI',Arial,sans-serif; }
    body { font-size:16px; line-height:1.48; }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white !important; }
    }
  </style>
</head>

      <div>
        <h2 class="text-xl font-black text-brand-600 uppercase tracking-wide">Iniciar Sesión</h2>
        <p class="text-base text-slate-600 font-medium mt-1">Bitácora de Laboratorios — La Escuela de Lancaster</p>
      </div>

      <!-- Formulario de Selección de Usuario y Clave -->
      <form @submit.prevent="login()" class="space-y-4 text-left">
        <div>
          <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">Usuario / Personal *</label>
          <select x-model="selectedUserKey" required class="w-full text-base font-semibold px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-600 bg-slate-50 text-slate-800">
            <option value="" disabled selected>Selecciona tu nombre...</option>
            <option value="superadmin">Administrador general</option>
            <optgroup label="Laboratoristas">
              <template x-for="user in usersList.filter(u => u.role === 'admin')" :key="user.id">
                <option :value="user.id" x-text="user.name"></option>
              </template>
            </optgroup>
            <optgroup label="Profesores">
              <template x-for="user in usersList.filter(u => u.role === 'teacher')" :key="user.id">
                <option :value="user.id" x-text="user.name"></option>
              </template>
            </optgroup>
            <optgroup label="Alumnos">
              <option value="alumnos">Alumnos (acceso general)</option>
            </optgroup>
          </select>
        </div>

        <div x-show="selectedUserKey === 'alumnos'" x-cloak class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">Correo institucional *</label>
            <input type="email" x-model="studentEmail" :required="selectedUserKey === 'alumnos'" placeholder="nombre.apellido@lancaster.edu.mx" autocomplete="email" class="w-full text-base font-semibold px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-600 bg-slate-50 text-slate-800">
            <p x-show="registeredStudent" class="text-sm font-bold text-emerald-700 mt-1.5" x-text="'Hola, ' + (registeredStudent && registeredStudent.name)"></p>
          </div>
          <div x-show="studentIsNew">
            <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">Tu nombre completo * <span class="normal-case font-semibold text-slate-400">(solo la primera vez)</span></label>
            <input type="text" x-model="studentName" :required="selectedUserKey === 'alumnos' && studentIsNew" placeholder="Nombre y apellido" class="w-full text-base font-semibold px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-600 bg-slate-50 text-slate-800">
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">Contraseña *</label>
          <div class="relative">
            <input :type="showPassword ? 'text' : 'password'" x-model="inputPassword" required placeholder="Ingresa tu clave" class="w-full text-base font-semibold px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-600 bg-slate-50 text-slate-800">
            <button type="button" @click="showPassword = !showPassword" class="absolute right-3 top-3.5 text-slate-400 hover:text-slate-600">
              <i class="ph text-xl" :class="showPassword ? 'ph-eye-slash' : 'ph-eye'"></i>
            </button>
          </div>
        </div>

        <p x-show="authError" class="text-sm font-bold text-brand-600 flex items-center gap-1.5" x-cloak>
          <i class="ph ph-warning-circle text-lg"></i> Contraseña incorrecta para el usuario seleccionado.
        </p>

        <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-black text-base rounded-xl transition shadow-md uppercase tracking-wider">
          Ingresar al Sistema
        </button>
        <p class="text-center"><button type="button" @click="forgotPassword()" class="text-sm font-semibold text-slate-500 hover:text-brand-700 underline">¿Olvidaste tu contraseña?</button></p>
      </form>

      <p class="text-xs text-slate-400 font-medium">Uso exclusivo para personal docente y de laboratorio.</p>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <template x-if="currentUser">
    <div class="flex flex-col min-h-screen">
      
      <!-- ENCABEZADO INSTITUCIONAL -->
      <header class="bg-brand-600 text-white shadow-lg sticky top-0 z-30 no-print border-b border-brand-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex flex-wrap justify-between items-center gap-x-4 gap-y-2 min-h-[5rem] py-2">

            <!-- Logo y Datos Institucionales -->

              </div>
              <div class="whitespace-nowrap">
                <h1 class="font-black text-base lg:text-lg 2xl:text-xl text-white leading-tight uppercase tracking-wide">Bitácora de Laboratorios</h1>
                <p class="text-sm xl:text-base text-rose-100/90 font-medium">La Escuela de Lancaster</p>
              </div>
            </div>

            <!-- Identificación del Usuario y Acciones -->
            <div class="flex flex-wrap items-center justify-end gap-2">

              <!-- Perfil -->
              <button @click="openProfile()" class="shrink-0 flex items-center gap-2.5 rounded-xl hover:bg-white/10 px-2 py-1 transition" title="Mi perfil">
                <div class="hidden xl:flex flex-col text-right whitespace-nowrap">
                  <span class="text-sm font-black text-white leading-tight" x-text="currentUser.name"></span>
                  <span class="text-xs font-semibold text-rose-200 leading-tight" x-text="(['admin', 'superadmin'].includes(currentUser.role)) ? 'Laboratorista (Acceso Total)' : (currentUser.role === 'student' ? 'Alumno' : 'Profesor')"></span>
                </div>
                <span class="w-10 h-10 rounded-full overflow-hidden border-2 border-white/60 bg-brand-800 flex items-center justify-center text-sm font-black shrink-0">
                  <img x-show="myProfile.photo" :src="myProfile.photo" class="w-full h-full object-cover" alt="">
                  <span x-show="!myProfile.photo" x-text="initials"></span>
                </span>
              </button>

              <!-- Alerta Próximas -->
              <button @click="showUpcomingAlertManual()" title="Próximas prácticas" class="shrink-0 inline-flex items-center justify-center gap-2 h-11 min-w-[2.75rem] px-3 rounded-lg transition whitespace-nowrap font-bold text-sm 2xl:px-4 2xl:text-base relative bg-brand-700/80 hover:bg-brand-800 text-white border border-white/20">
                <i class="ph ph-bell text-xl"></i>
                <span class="hidden 2xl:inline">Próximas</span>
                <template x-if="upcomingBookingsCount > 0">
                  <span class="bg-amber-400 text-brand-900 font-black text-xs px-1.5 py-0.5 rounded-full border border-amber-300" x-text="upcomingBookingsCount"></span>
                </template>
              </button>

              <button x-show="currentUser.role !== 'student'" @click="openFreshMaterialModal()" title="PDF Material Fresco" class="shrink-0 inline-flex items-center justify-center gap-2 h-11 min-w-[2.75rem] px-3 rounded-lg transition whitespace-nowrap font-bold text-sm 2xl:px-4 2xl:text-base bg-amber-600 hover:bg-amber-700 text-white border border-amber-500">
                <i class="ph ph-plant text-xl"></i>
                <span class="hidden 2xl:inline">Material Fresco</span>
              </button>

              <button x-show="currentUser.role !== 'student'" @click="openDailyPrintModal()" title="Reportes PDF" class="shrink-0 inline-flex items-center justify-center gap-2 h-11 min-w-[2.75rem] px-3 rounded-lg transition whitespace-nowrap font-bold text-sm 2xl:px-4 2xl:text-base bg-white/10 hover:bg-white/20 text-white border border-white/20">
                <i class="ph ph-printer text-xl"></i>
                <span class="hidden 2xl:inline">Reportes PDF</span>
              </button>

              <button @click="openStationery()" title="Solicitar Papelería" class="shrink-0 inline-flex items-center justify-center gap-2 h-11 min-w-[2.75rem] px-3 rounded-lg transition whitespace-nowrap font-bold text-sm 2xl:px-4 2xl:text-base bg-white/10 hover:bg-white/20 text-white border border-white/20">
                <i class="ph ph-paperclip text-xl"></i>
                <span class="hidden 2xl:inline">Solicitar Papelería</span>
              </button>

              <button @click="openModal()" class="shrink-0 inline-flex items-center justify-center gap-2 h-11 min-w-[2.75rem] px-3 rounded-lg transition whitespace-nowrap font-bold text-sm 2xl:px-4 2xl:text-base bg-white text-brand-800 hover:bg-slate-50 font-black shadow-md border border-white !px-4 !text-base">
                <i class="ph ph-plus-circle text-xl text-brand-600"></i>
                <span x-text="isStudent ? 'Agendar Internal Assessment' : 'Agendar Práctica'"></span>
              </button>

              <!-- Sonido de alertas -->
              <button @click="toggleSound()" class="shrink-0 inline-flex items-center justify-center h-11 w-11 bg-white/10 hover:bg-white/20 text-white rounded-lg border border-white/20 transition" :title="soundOn ? 'Sonido de alertas: activado (clic para silenciar)' : 'Sonido de alertas: silenciado (clic para activar)'">
                <i class="ph text-xl" :class="soundOn ? 'ph-speaker-high' : 'ph-speaker-slash'"></i>
              </button>

              <!-- Cerrar Sesión -->
              <button @click="logout()" class="shrink-0 inline-flex items-center justify-center h-11 w-11 bg-brand-800/80 hover:bg-brand-900 text-rose-100 rounded-lg border border-white/20 transition" title="Cerrar Sesión">
                <i class="ph ph-sign-out text-xl"></i>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- CONTENIDO PRINCIPAL -->
      <main class="flex-1 max-w-screen-2xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-5 no-print">

        <!-- AVISO EN VIVO (LABORATORISTAS) -->
        <div x-show="(['admin', 'superadmin'].includes(currentUser.role))" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="rounded-xl border p-4 shadow-xs" :class="liveBanner.cur ? 'bg-brand-50 border-brand-300' : 'bg-white border-slate-200'">
            <div class="flex items-center gap-2 mb-2">
              <span class="relative flex h-3 w-3"><span x-show="liveBanner.cur" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-500 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3" :class="liveBanner.cur ? 'bg-brand-600' : 'bg-slate-300'"></span></span>
              <h3 class="text-base font-black uppercase tracking-wider text-slate-800" x-text="liveBanner.cur ? 'Ahora · Periodo ' + liveBanner.cur : 'Ahora · fuera de periodo'"></h3>
            </div>
            <template x-for="it in liveBanner.curItems" :key="it.id">
              <div @click="viewDetail(it)" class="text-base cursor-pointer hover:bg-white/70 rounded px-1"><b x-text="getDisplaySpace(it)"></b> — <span x-text="it.practiceName || it.subject"></span> <span class="text-slate-500" x-text="'· ' + it.teacher"></span> <span class="text-xs font-bold" :class="it.labTech ? 'text-brand-700' : 'text-rose-600'" x-text="it.labTech ? '→ ' + it.labTech.split(' ')[0] : '→ sin asignar'"></span></div>
            </template>
            <p x-show="!liveBanner.curItems.length" class="text-sm text-slate-500 font-semibold">Sin prácticas en curso.</p>
          </div>
          <div class="rounded-xl border p-4 shadow-xs" :class="liveBanner.nextItems.length ? (liveBanner.toNext <= 15 ? 'bg-amber-100 border-amber-400 animate-pulse' : 'bg-amber-50 border-amber-300') : 'bg-white border-slate-200'">
            <div class="flex items-center gap-2 mb-2">
              <i class="ph ph-bell-ringing text-xl" :class="liveBanner.nextItems.length ? 'text-amber-600' : 'text-slate-300'"></i>
              <h3 class="text-base font-black uppercase tracking-wider text-slate-800" x-text="liveBanner.next ? 'Siguiente · Periodo ' + liveBanner.next + ' (en ' + liveBanner.toNext + ' min)' : 'Sin más periodos hoy'"></h3>
            </div>
            <template x-for="it in liveBanner.nextItems" :key="it.id">
              <div @click="viewDetail(it)" class="text-base cursor-pointer hover:bg-white/70 rounded px-1"><b x-text="getDisplaySpace(it)"></b> — <span x-text="it.practiceName || it.subject"></span> <span class="text-slate-500" x-text="'· ' + it.teacher"></span> <span class="text-xs font-bold" :class="it.labTech ? 'text-brand-700' : 'text-rose-600'" x-text="it.labTech ? '→ ' + it.labTech.split(' ')[0] : '→ sin asignar'"></span> <span x-show="it.needsFreshMaterial">🌿</span></div>
            </template>
            <p x-show="!liveBanner.nextItems.length" class="text-sm text-slate-500 font-semibold">Ninguna práctica inicia en el siguiente periodo.</p>
          </div>
        </div>

        <!-- REQUISITOS INSTITUCIONALES -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-white border-l-4 border-l-brand-600 border border-slate-200 rounded-r-xl p-4 shadow-xs flex gap-3.5 items-center">
            <div class="p-3.5 bg-brand-600 text-white rounded-md shrink-0">
              <i class="ph ph-clock text-2xl"></i>
            </div>
            <div>
              <h3 class="text-base font-extrabold uppercase tracking-wider text-brand-700">Anticipación General (48 Horas)</h3>
              <p class="text-base text-slate-600 mt-0.5">Mínimo 48 horas de antelación. Entre 24 y 48 horas se marca como <strong>Extemporánea</strong>; con menos de 24 horas solo las laboratoristas pueden agendar (queda como extemporánea).</p>
            </div>
          </div>

          <div class="bg-white border-l-4 border-l-amber-500 border border-slate-200 rounded-r-xl p-4 shadow-xs flex gap-3.5 items-center">
            <div class="p-3.5 bg-amber-600 text-white rounded-md shrink-0">
              <i class="ph ph-plant text-2xl"></i>
            </div>

        <!-- VISTA CALCULADORA DE SOLUCIONES -->

            <div>
              <h2 class="text-lg font-black uppercase tracking-wide text-brand-700">Calculadora de soluciones</h2>

              </div>

              <div class="grid grid-cols-3 gap-3">
                <div class="col-span-2">
                  <label class="block text-sm font-bold text-slate-700 mb-1">Volumen por equipo</label>

                    <input type="text" inputmode="decimal" x-model="calc.vol" placeholder="Ej. 100" class="flex-1 min-w-0 text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg">
                    <select x-model="calc.volUnit" class="text-base font-bold px-3 py-2 border border-slate-300 rounded-lg bg-white"><option>mL</option><option>L</option></select>

                <div>
                  <label class="block text-sm font-bold text-slate-700 mb-1">Equipos</label>

              </div>
              <p class="text-xs text-slate-500">Si la madre y la solución final están en la misma unidad se usa C₁V₁ = C₂V₂ directo. Para pasar entre %, M y N hacen falta masa molar y densidad (los datos se llenan solos al elegir el reactivo).</p>

                      <div class="text-3xl font-black leading-tight" x-text="calcResult.kind === 'solid' ? calcResult.totalText : calcResult.water + ' mL'"></div>
                    </div>

                  <div class="text-sm font-semibold text-slate-600" x-text="calcResult.summary"></div>

                  </ol>
                  <div x-show="calcResult.hazards.length" class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-sm font-semibold text-amber-900 space-y-1">

                  <div x-show="calcResult.stockInfo" class="text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-lg p-3" x-text="calcResult.stockInfo"></div>
                  <button @click="calcCopy()" class="text-base font-bold text-brand-700 bg-brand-50 hover:bg-brand-100 border border-brand-200 px-4 py-2 rounded-lg flex items-center gap-1.5"><i class="ph ph-copy text-lg"></i> Copiar receta</button>
                </div>
              </template>
            </div>
          </div>
        </div>

        <!-- VISTA VALES DE PRÉSTAMO -->

            <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-3"><h3 class="font-black text-slate-800">Préstamos vigentes</h3><input x-model="bookLoanSearch" placeholder="Buscar alumno" class="w-full border rounded-lg p-2"><div class="max-h-96 overflow-auto divide-y"><template x-for="loan in filteredBookLoans" :key="loan.id"><div class="py-2 flex justify-between gap-3"><div><div class="font-bold" x-text="loan.bookTitle"></div><div class="text-xs text-slate-600" x-text="loan.studentName + ' · ' + loan.studentEmail"></div><div class="text-xs text-slate-500" x-text="'Préstamo: ' + formatDisplayDate(loan.date) + ' · Devolución: ' + (loan.dueDate ? formatDisplayDate(loan.dueDate) : 'Sin fecha')"></div></div><button @click="returnBook(loan)" class="text-sm px-3 py-1 rounded bg-slate-100 font-bold">Devolver</button></div></template><p x-show="filteredBookLoans.length === 0" class="text-sm text-slate-500 py-4">No hay préstamos coincidentes.</p></div></div>
          </div>
        </section>

        <!-- REGISTRO INTERDEPARTAMENTAL -->
        <section x-show="currentView === 'interdept'" class="bg-white border border-slate-200 rounded-xl p-4 space-y-4"><div><h2 class="text-lg font-black">Préstamo interdepartamental</h2><p class="text-sm text-slate-600">Solo registro y trazabilidad; no modifica existencias del inventario de laboratorio.</p></div><div class="grid md:grid-cols-4 gap-2"><input x-model="interForm.department" placeholder="Departamento solicitante" class="border rounded-lg p-2"><input x-model="interForm.contact" placeholder="Persona responsable" class="border rounded-lg p-2"><input x-model="interForm.item" placeholder="Material / equipo" class="border rounded-lg p-2"><input x-model="interForm.quantity" type="number" min="1" placeholder="Cantidad" class="border rounded-lg p-2"></div><div class="grid md:grid-cols-3 gap-2"><input x-model="interForm.date" type="date" class="border rounded-lg p-2"><input x-model="interForm.returnDate" type="date" class="border rounded-lg p-2"><input x-model="interForm.notes" placeholder="Observaciones" class="border rounded-lg p-2"></div><button @click="saveInterLoan()" class="bg-brand-700 text-white px-4 py-2 rounded-lg font-bold">Registrar préstamo</button><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="bg-slate-100 text-left"><th class="p-2">Departamento</th><th class="p-2">Responsable</th><th class="p-2">Artículo</th><th class="p-2">Cantidad</th><th class="p-2">Fecha</th><th class="p-2">Devolución</th><th class="p-2">Registro</th></tr></thead><tbody><template x-for="r in interLoans" :key="r.id"><tr class="border-t"><td class="p-2" x-text="r.department"></td><td class="p-2" x-text="r.contact"></td><td class="p-2" x-text="r.item"></td><td class="p-2" x-text="r.quantity"></td><td class="p-2" x-text="r.date"></td><td class="p-2" x-text="r.returnDate || '—'"></td><td class="p-2" x-text="r.notes || '—'"></td></tr></template></tbody></table></div></section>

        <section x-show="currentView === 'reports'" class="bg-white border border-slate-200 rounded-xl p-4 space-y-4"><div><h2 class="text-lg font-black">Métricas por profesor y practicario cronológico</h2><p class="text-sm text-slate-600">Indicadores calculados a partir de las prácticas registradas.</p></div><div class="grid md:grid-cols-3 gap-3"><select x-model="reportTeacher" class="border rounded-lg p-2"><option value="Todos">Todos los profesores</option><template x-for="u in usersList.filter(x => x.role === 'teacher')" :key="u.id"><option :value="u.name" x-text="u.name"></option></template></select><select x-model="reportSubject" class="border rounded-lg p-2"><option value="Todas">Todas las materias</option><option>Biología</option><option>Química</option><option>Física</option><option>Ciencias Integradas</option></select><button @click="printTeacherReport()" class="bg-brand-700 text-white rounded-lg p-2 font-bold">Imprimir reporte</button></div><div class="grid sm:grid-cols-3 gap-3"><div class="p-3 rounded-lg bg-slate-50"><div class="text-xs text-slate-500">Prácticas realizadas / registradas</div><div class="text-2xl font-black" x-text="teacherReportRows.length"></div></div><div class="p-3 rounded-lg bg-slate-50"><div class="text-xs text-slate-500">Alumnos atendidos</div><div class="text-2xl font-black" x-text="teacherReportStudents"></div></div><div class="p-3 rounded-lg bg-slate-50"><div class="text-xs text-slate-500">Materias distintas</div><div class="text-2xl font-black" x-text="new Set(teacherReportRows.map(x => x.subject)).size"></div></div></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="bg-slate-100 text-left"><th class="p-2">Fecha</th><th class="p-2">Materia</th><th class="p-2">Profesor</th><th class="p-2">Práctica</th><th class="p-2">Grupo</th><th class="p-2">Alumnos</th><th class="p-2">Materiales / reactivos</th></tr></thead><tbody><template x-for="b in teacherReportRows" :key="b.id"><tr class="border-t"><td class="p-2" x-text="formatDisplayDate(b.date)"></td><td class="p-2" x-text="b.subject"></td><td class="p-2" x-text="b.teacher"></td><td class="p-2" x-text="b.practiceName || 'Práctica general'"></td><td class="p-2" x-text="b.group || '—'"></td><td class="p-2" x-text="b.studentsCount || '—'"></td><td class="p-2" x-text="((b.materialsList || []).length + (b.reagentsList || []).length)"></td></tr></template></tbody></table></div><h3 class="font-black pt-3 border-t">Practicario cronológico</h3><p class="text-sm text-slate-500">Se genera con las prácticas registradas; las descripciones que no estén capturadas no se completan automáticamente.</p></section>

        <!-- ADMINISTRACIÓN GENERAL -->
        <section x-show="currentView === 'superadmin' && currentUser.role === 'superadmin'" class="bg-white border border-slate-200 rounded-xl p-4 space-y-4"><h2 class="text-lg font-black">Administración general</h2><p class="text-sm text-slate-600">Permisos amplios dentro de esta aplicación. La contraseña maestra del navegador no sustituye autenticación segura del servidor.</p><div class="grid md:grid-cols-2 gap-3"><div class="border rounded-lg p-3"><h3 class="font-bold">Personal docente</h3><template x-for="u in usersList.filter(x => x.role === 'teacher')" :key="u.id"><div class="flex justify-between py-2 border-b"><span x-text="u.name"></span><button @click="deactivateTeacher(u)" class="text-rose-700 font-bold text-xs">Dar de baja</button></div></template></div><div class="border rounded-lg p-3 space-y-2"><h3 class="font-bold">Horarios de usuarios</h3><p class="text-xs text-slate-500">Horarios 2026-2027 importados cuando están disponibles. Cada usuario puede editar su propio horario desde su perfil.</p><select x-model="scheduleOwner" @change="scheduleText = (profiles[scheduleOwner] || {}).scheduleText || ''" class="w-full border rounded p-2"><template x-for="u in usersList.filter(x => x.role !== 'student')" :key="u.id"><option :value="u.id" x-text="u.name"></option></template></select><input type="file" accept=".csv,.json,.txt,.pdf,.xlsx,.xls" @change="importUserSchedule($event)" class="w-full text-sm"><textarea x-model="scheduleText" rows="5" placeholder="Horario editable / notas" class="w-full border rounded p-2"></textarea><button @click="saveUserSchedule()" class="bg-brand-700 text-white rounded p-2 font-bold">Guardar horario</button><template x-if="scheduleFiles[scheduleOwner]"><a :href="scheduleFiles[scheduleOwner].data" :download="scheduleFiles[scheduleOwner].name" class="text-sm text-brand-700 underline" x-text="'Abrir archivo: ' + scheduleFiles[scheduleOwner].name"></a></template></div></div></section>

        <!-- VISTA LISTA -->
        <div x-show="currentView === 'list'" class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">

              <thead>
                <tr class="bg-slate-100 border-b border-slate-200 text-base font-bold text-slate-700 uppercase tracking-wider">
                  <th class="p-4">Orden</th>
                  <th class="p-4">Fecha y Periodo</th>
                  <th class="p-4">Ubicación</th>
                  <th class="p-4">Práctica / Asignatura</th>
                  <th class="p-4">Profesor</th>
                  <th class="p-4">Estatus</th>
                  <th class="p-4 text-right">Acciones</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200 text-base">
                <template x-for="(item, index) in sortedListBookings" :key="item.id">
                  <tr class="hover:bg-slate-50/80 transition">
                    <td class="p-4 whitespace-nowrap font-bold text-slate-400">
                      <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 text-slate-800 text-base font-black border border-slate-200" x-text="'#' + (index + 1)"></span>

                    <td class="p-4 whitespace-nowrap">
                      <div class="font-bold text-slate-900" x-text="formatDisplayDate(item.date)"></div>
                      <div class="text-slate-500 font-medium text-sm" x-text="'Periodo ' + item.startPeriod + (item.durationPeriods > 1 ? ' al ' + (parseInt(item.startPeriod) + parseInt(item.durationPeriods) - 1) : '')"></div>
                    </td>
                    <td class="p-4">
                      <span class="text-sm font-bold px-2.5 py-1 rounded uppercase border" :class="getLabBadgeStyle(item.labType)" x-text="getDisplaySpace(item)"></span>
                    </td>
                    <td class="p-4">
                      <div class="font-bold text-slate-900 text-base" x-text="item.practiceName || 'Práctica General'"></div>
                      <div class="font-black text-sm uppercase" :class="getSubjectColorClass(item.subject)" x-text="item.subject"></div>
                      <div x-show="item.isIA" class="text-xs font-black text-brand-700 uppercase" x-text="'IA · ' + item.studentName"></div>

                    <td class="p-4">
                      <div class="text-slate-800 font-semibold flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full inline-block shrink-0" :style="'background-color:' + getSubjectColor(item.subject)"></span>
                        <span x-text="item.teacher"></span>
                      </div>
                      <div class="text-sm text-slate-500" x-text="'Atiende: ' + (item.labTech || 'Sin indicar')"></div>
                    </td>
                    <td class="p-4 whitespace-nowrap">
                      <template x-if="item.isExtemp">
                        <span class="inline-flex items-center gap-1 text-sm font-bold px-3 py-1 rounded-full bg-brand-50 text-brand-800 border border-brand-200">
                          <i class="ph ph-warning-circle"></i> Extemporánea
                        </span>
                      </template>
                      <template x-if="!item.isExtemp">
                        <span class="inline-flex items-center gap-1 text-sm font-bold px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200">
                          <i class="ph ph-check-circle"></i> A Tiempo
                        </span>
                      </template>
                    </td>
                    <td class="p-4 text-right whitespace-nowrap">
                      <button @click="viewDetail(item)" class="text-slate-600 hover:text-slate-900 p-2 rounded-lg hover:bg-slate-100 transition"><i class="ph ph-eye text-xl"></i></button>
                      <button x-show="!isStudent || canEditOrDelete(item)" @click="printSingleBooking(item)" class="text-slate-600 hover:text-slate-900 p-2 rounded-lg hover:bg-slate-100 transition"><i class="ph ph-printer text-xl"></i></button>

            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
              <div x-show="editingBookingId">
                <label class="block text-base font-bold text-slate-800 uppercase tracking-wider mb-1.5">Ubicación *</label>
                <select x-model="formData.labType" required class="w-full text-base font-bold px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 bg-white">

                  <option value="Laboratorio 27">Laboratorio 27</option>
                  <option value="Laboratorio 28">Laboratorio 28</option>
                  <option value="Laboratorio 29">Laboratorio 29</option>
                  <option value="Laboratorio 30">Laboratorio 30</option>
                  <option value="Salón de clases">Salón de clases</option>

              <div x-show="editingBookingId && formData.labType === 'Salón de clases'" x-transition>
                <label class="block text-base font-bold text-brand-800 uppercase tracking-wider mb-1.5">Número / Nombre Salón *</label>

              </div>

              <div :class="editingBookingId ? (formData.labType === 'Salón de clases' ? '' : 'sm:col-span-2') : 'sm:col-span-3'">
                <label class="block text-base font-bold text-slate-800 uppercase tracking-wider mb-1.5">Asignatura *</label>
                <select x-model="formData.subject" required class="w-full text-base font-bold px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 bg-white">

                  <option value="Física">Física </option>
                  <option value="Química">Química </option>

            </div>

                <label class="block text-base font-bold text-slate-700 mb-1">Forma / Grado <span class="text-slate-400 font-normal">(opcional)</span></label>

              <template x-for="(it, i) in stForm.items" :key="i">

                  <input type="text" x-model="it.quantity" placeholder="Cantidad" class="w-32 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                  <button type="button" @click="if (stForm.items.length > 1) stForm.items.splice(i, 1)" class="text-slate-400 hover:text-rose-600 p-1"><i class="ph ph-trash text-xl"></i></button>

              <button type="submit" class="px-6 py-2.5 text-base font-black text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-xs" x-text="editingStId ? 'Guardar cambios' : 'Enviar solicitud'"></button>
            </div>
          </form>
        </div>
      </div>

      <!-- MODAL VALE: REVISIÓN DE DEVOLUCIÓN (material roto o perdido) -->
      <div x-show="isReturnOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 p-2 sm:p-4 no-print">
        <div @click.outside="isReturnOpen = false" class="bg-white rounded-2xl max-w-3xl w-full mx-auto my-2 shadow-2xl border border-slate-200 overflow-hidden">
          <div class="px-4 sm:px-6 py-4 bg-rose-700 text-white flex justify-between items-center">
            <div>
              <h2 class="text-lg sm:text-xl font-black uppercase tracking-wide">Daño o pérdida de material</h2>
              <p class="text-sm sm:text-base text-rose-100 font-medium">Marca lo que regresó roto o no regresó. Se agrega a la lista de deudores.</p>
            </div>
            <button @click="isReturnOpen = false" class="text-white/80 hover:text-white p-1"><i class="ph ph-x text-2xl"></i></button>
          </div>
          <div class="p-4 sm:p-6 space-y-3">
            <template x-for="(r, i) in returnForm.rows" :key="i">
              <div class="border rounded-xl p-3 grid grid-cols-1 sm:grid-cols-12 gap-2 items-center" :class="r.cond === 'Bien' ? 'border-slate-200 bg-white' : 'border-rose-300 bg-rose-50'">
                <div class="sm:col-span-4 font-bold text-slate-900 break-words" x-text="(r.qty || '1') + ' × ' + r.desc"></div>
                <select x-model="r.cond" class="sm:col-span-3 text-base font-bold px-3 py-2 border border-slate-300 rounded-lg bg-white">
                  <option value="Bien">Regresó bien</option>
                  <option value="Roto">Roto / dañado</option>
                  <option value="Perdido">No regresó (perdido)</option>
                </select>
                <input x-show="r.cond !== 'Bien'" type="number" min="1" x-model="r.qtyBad" placeholder="Cant." class="sm:col-span-2 text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg bg-white">
                <input x-show="r.cond !== 'Bien'" type="text" inputmode="decimal" x-model="r.cost" placeholder="Costo total $" class="sm:col-span-3 text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg bg-white">
              </div>
            </template>
            <textarea x-model="returnForm.note" rows="2" placeholder="Observaciones (opcional)" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg"></textarea>
            <div class="flex justify-end gap-2">
              <button type="button" @click="isReturnOpen = false" class="px-5 py-2.5 text-base font-bold text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
              <button type="button" @click="saveReturn()" class="px-6 py-2.5 text-base font-black text-white bg-rose-700 hover:bg-rose-800 rounded-lg shadow-xs">Registrar adeudo</button>
            </div>
          </div>
        </div>
      </div>

      <!-- MODAL VALE: FORMULARIO -->
      <div x-show="isValeOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 p-2 sm:p-4 no-print">
        <div @click.outside="isValeOpen = false" class="bg-white rounded-2xl max-w-3xl w-full mx-auto my-2 shadow-2xl border border-slate-200 overflow-hidden">
          <div class="px-4 sm:px-6 py-4 bg-brand-600 text-white flex justify-between items-center">
            <div>
              <h2 class="text-lg sm:text-xl font-black uppercase tracking-wide" x-text="editingValeId ? 'Editar vale' : 'Vale de materiales, reactivos y/o equipo'"></h2>
              <p class="text-sm sm:text-base text-rose-100/90 font-medium">La Escuela de Lancaster, A.C. · Área de Ciencias</p>
            </div>
            <button @click="isValeOpen = false" class="text-white/80 hover:text-white p-1"><i class="ph ph-x text-2xl"></i></button>
          </div>
          <form @submit.prevent="submitVale()" class="p-4 sm:p-6 space-y-4 text-base">
            <div x-show="valeBookingOptions.length">
              <label class="block text-base font-bold text-slate-700 mb-1">Vincular con una práctica agendada <span class="text-slate-400 font-normal">(llena los datos solo)</span></label>
              <select @change="valeFromBooking($event.target.value)" class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg bg-white">
                <option value="">— Llenar a mano —</option>
                <template x-for="b in valeBookingOptions" :key="b.id"><option :value="b.id" x-text="formatDisplayDate(b.date) + ' · P' + b.startPeriod + ' · ' + (b.practiceName || b.subject) + (b.isIA ? ' (IA ' + b.studentName + ')' : '')"></option></template>
              </select>
            </div>
            <div>
              <label class="block text-base font-bold text-slate-700 mb-1">Nombre de la práctica / Internal *</label>
              <input type="text" x-model="valeForm.practiceName" required placeholder="Ej. Internal: efecto de la temperatura en la enzima catalasa" class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1">Asignatura *</label>
                <select x-model="valeForm.subject" required class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg bg-white"><option>Biología</option><option>Física</option><option>Química</option><option>Ciencias Integradas</option></select>
              </div>
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1">Forma *</label>
                <select x-model="valeForm.grade" required class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg bg-white"><option value="" disabled>Selecciona...</option><template x-for="g in ['F1','F2','F3','F4','F5','L6','U6']" :key="g"><option :value="g" x-text="g"></option></template></select>
              </div>
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1">Grupo</label>
                <input type="text" x-model="valeForm.group" placeholder="Ej. A" class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg">
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1">Titular de la materia *</label>
                <select x-model="valeForm.titular" required class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg bg-white">
                  <option value="" disabled>Selecciona al profesor...</option>
                  <template x-for="u in usersList.filter(u => u.role === 'teacher')" :key="u.id"><option :value="u.name" x-text="u.name"></option></template>
                </select>
              </div>
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1">Fecha *</label>
                <input type="date" x-model="valeForm.date" required class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="block text-base font-bold text-slate-700 mb-1">Horario: de *</label><input type="time" x-model="valeForm.from" required class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg"></div>
              <div><label class="block text-base font-bold text-slate-700 mb-1">a (devolución) *</label><input type="time" x-model="valeForm.to" required class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg"></div>
            </div>

            <div class="space-y-2 border border-slate-200 rounded-xl p-3 sm:p-4 bg-slate-50">
              <div class="flex justify-between items-center gap-2">
                <label class="text-base font-bold text-slate-800 uppercase tracking-wider">Materiales, reactivos y/o equipo *</label>
                <button type="button" @click="valeForm.items.push({ qty: '', desc: '', obs: '' })" class="text-base font-bold text-slate-700 hover:bg-slate-200 bg-white border border-slate-300 px-3 py-1 rounded-md flex items-center gap-1"><i class="ph ph-plus-bold"></i> Agregar</button>
              </div>
              <div class="flex flex-wrap gap-1.5">
                <template x-for="q in valeQuick" :key="q"><button type="button" @click="addValeQuick(q)" class="text-sm font-semibold text-brand-700 bg-brand-50 border border-brand-200 px-2.5 py-1 rounded-full hover:bg-brand-100" x-text="'+ ' + q"></button></template>
              </div>
              <template x-for="(it, i) in valeForm.items" :key="i">
                <div class="flex flex-wrap gap-2 items-center bg-white border border-slate-200 rounded-lg p-2">
                  <input type="text" x-model="it.qty" placeholder="Cant." class="w-20 text-base px-2 py-2 border border-slate-300 rounded-lg text-center">
                  <input type="text" x-model="it.desc" list="invLoan" placeholder="Descripción del material" class="flex-1 min-w-[10rem] text-base px-3 py-2 border border-slate-300 rounded-lg">
                  <button type="button" @click="if (valeForm.items.length > 1) valeForm.items.splice(i, 1)" class="text-slate-400 hover:text-rose-600 p-1 sm:order-last"><i class="ph ph-trash text-xl"></i></button>
                  <input type="text" x-model="it.obs" placeholder="Observaciones" class="w-full sm:w-56 text-base px-3 py-2 border border-slate-300 rounded-lg">
                </div>
              </template>
              <template x-if="isValeOpen">
                <datalist id="invLoan">
                  <template x-for="inv in inventory.filter(i => i.kind === 'equipo' && (i.cat === 'Biología' || i.cat === 'Física'))" :key="inv.id"><option :value="inv.name + (inv.desc ? ' — ' + inv.desc : '')"></option></template>
                </datalist>
              </template>
            </div>

            <div>
              <label class="block text-base font-bold text-slate-700 mb-1">Alumno/s * <span class="text-slate-400 font-normal">(uno por línea)</span></label>
              <textarea x-model="valeForm.studentsText" rows="3" required placeholder="Nombre y apellido" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg"></textarea>
            </div>
            <p class="text-sm text-slate-500">El alumno responde por cualquier daño o pérdida parcial o total del equipo y debe devolverlo en buenas condiciones dentro del horario establecido.</p>
            <div class="flex flex-col-reverse sm:flex-row justify-end gap-2 pt-2 border-t border-slate-200">
              <button type="button" @click="isValeOpen = false" class="px-5 py-2.5 text-base font-bold text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
              <button type="submit" class="px-6 py-2.5 text-base font-black text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-xs" x-text="editingValeId ? 'Guardar cambios' : 'Generar vale'"></button>
            </div>
          </form>
        </div>
      </div>

      <!-- MODAL VALE: HOJA -->
      <div x-show="valeView" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 p-2 sm:p-4 no-print">
        <div @click.outside="valeView = null" class="bg-white rounded-2xl max-w-3xl w-full mx-auto my-2 shadow-2xl overflow-hidden">
          <div class="px-4 py-3 bg-slate-100 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
            <span class="font-black uppercase tracking-wide text-slate-800 text-sm sm:text-base" x-text="valeView ? 'Vale · ' + valeView.status : ''"></span>
            <div class="flex items-center gap-2">
              <button @click="printVale(valeView)" class="text-sm sm:text-base font-bold text-white bg-brand-600 hover:bg-brand-700 px-4 py-2 rounded-lg flex items-center gap-1.5"><i class="ph ph-printer"></i> Imprimir</button>
              <button @click="valeView = null" class="text-sm sm:text-base font-bold text-slate-700 bg-white border border-slate-300 px-4 py-2 rounded-lg hover:bg-slate-100">Cerrar</button>
            </div>
          </div>
          <div class="p-2 sm:p-5" x-html="valeView ? valeSheetHtml(valeView, 0) : ''"></div>
        </div>
      </div>

      <!-- MODAL PERFIL -->
      <div x-show="isProfileOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
        <div @click.outside="isProfileOpen = false" class="bg-white rounded-2xl max-w-3xl w-full shadow-2xl border border-slate-200 overflow-hidden max-h-[90vh] flex flex-col">
          <div class="px-6 py-4 bg-brand-600 text-white flex justify-between items-center shrink-0">
            <div>
              <h2 class="text-xl font-black uppercase tracking-wide">Mi Perfil</h2>
              <p class="text-base text-rose-100/90 font-medium" x-text="currentUser.name"></p>
              <p class="text-xs text-rose-200/80" x-text="'Versión: ' + appVersion"></p>
            </div>
            <button @click="isProfileOpen = false" class="text-white/80 hover:text-white p-1"><i class="ph ph-x text-2xl"></i></button>
          </div>

          <div class="flex gap-2 px-6 pt-4 shrink-0">
            <button @click="profileTab = 'datos'" :class="profileTab === 'datos' ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-700'" class="px-4 py-2 rounded-lg text-base font-bold transition">Foto y contraseña</button>
            <button @click="profileTab = 'horario'" :class="profileTab === 'horario' ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-700'" class="px-4 py-2 rounded-lg text-base font-bold transition">Horario</button>
            <button x-show="(['admin', 'superadmin'].includes(currentUser.role))" @click="profileTab = 'accesos'" :class="profileTab === 'accesos' ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-700'" class="px-4 py-2 rounded-lg text-base font-bold transition">Accesos</button>
            <button x-show="(['admin', 'superadmin'].includes(currentUser.role))" @click="profileTab = 'usuarios'" :class="profileTab === 'usuarios' ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-700'" class="px-4 py-2 rounded-lg text-base font-bold transition">Usuarios</button>
          </div>

          <div class="p-6 overflow-y-auto space-y-5 text-base">
            <!-- Foto y contraseña -->
            <div x-show="profileTab === 'datos'" class="space-y-6">
              <div class="flex items-center gap-5">
                <span class="w-24 h-24 rounded-full overflow-hidden border-4 border-slate-200 bg-slate-100 flex items-center justify-center text-3xl font-black text-slate-500 shrink-0">
                  <img x-show="myProfile.photo" :src="myProfile.photo" class="w-full h-full object-cover" alt="">
                  <span x-show="!myProfile.photo" x-text="initials"></span>
                </span>
                <div class="space-y-2">
                  <input type="file" accept="image/*" @change="handlePhoto($event)" class="text-base text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-md file:border-0 file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100">
                  <button x-show="myProfile.photo" @click="removePhoto()" class="text-sm font-bold text-rose-600 hover:underline">Quitar foto</button>
                </div>
              </div>

            <div x-show="profileTab === 'accesos' && (['admin', 'superadmin'].includes(currentUser.role))" class="space-y-4">
              <p class="text-base text-slate-600">Si alguien olvidó su contraseña, asígnale una <b>temporal</b>. Al entrar con ella, la página le pedirá crear una nueva.</p>

                <button @click="adminResetPassword()" class="px-5 py-2 text-base font-black text-white bg-brand-600 hover:bg-brand-700 rounded-lg">Asignar contraseña temporal</button>

              <p class="text-sm text-slate-500">Para el acceso compartido de alumnos, esto cambia la contraseña de todos ellos.</p>

        async fetchFromCloud(silent = false) {
          if (this._cloudFetchInFlight) return this._cloudFetchInFlight;
          const cloudFetchTask = (async () => {
          if (!silent) this.isLoading = true;
          try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${this.binId}/latest`, {
              method: 'GET',
              headers: { 'X-Access-Key': this.getAccessKey() }
            });
            if (res.ok) {
              const json = await res.json();
              this._lastCloudSyncAt = Date.now();
              const rec = json.record;
              if (Array.isArray(rec)) {
                this.bookings = rec;
              } else if (rec && typeof rec === 'object') {
                this.bookings = rec.bookings || [];
                this.inventory = this.buildInventory(rec);
                this.profiles = rec.profiles || {};
                this.stationery = rec.stationery || [];
                this.vales = rec.vales || [];
                this.libraryBooks = Array.isArray(rec.libraryBooks) ? rec.libraryBooks : [];
                this.bookLoans = rec.bookLoans || [];
                this.interLoans = rec.interLoans || []; this.scheduleFiles = rec.scheduleFiles || {}; this.inactiveUsers = rec.inactiveUsers || [];
                let seedDataImported = false;
                this.librarySeedVersion = Number(rec.librarySeedVersion || 0);
                if (this.librarySeedVersion < 1) {
                  const bookKey = b => (String(b.title || '').trim().toLowerCase() + '|' + String(b.isbn || '').trim().toLowerCase());
                  const existing = new Set(this.libraryBooks.map(bookKey));
                  const imported = INITIAL_LIBRARY_BOOKS.filter(b => !existing.has(bookKey(b)))
                    .map((b, i) => ({ ...b, id: 'catalog-2026-' + i, source: 'Inventario interno de libros.xlsx' }));
                  this.libraryBooks = this.libraryBooks.concat(imported);
                  this.librarySeedVersion = 1;
                  seedDataImported = true;
                }
                // Reconciliar horarios importados en cada sincronización: versiones anteriores
                // pudieron marcar la semilla como aplicada sin guardar el texto en todos los perfiles.
                this.scheduleSeedVersion = Number(rec.scheduleSeedVersion || 0);
                this.profiles = { ...(this.profiles || {}) };
                Object.entries(INITIAL_TEACHER_SCHEDULES).forEach(([key, importedSchedule]) => {
                  const current = this.profiles[key] || {};
                  const existingText = String(current.scheduleText || '').trim();
                  const hasImportedMarker = existingText.includes('Horario importado del documento Horarios 2026-2027');
                  const isOldMissingScheduleNote = /no se localiz[oó].*(horario|tabla)|no aparece.*horario/i.test(existingText);
                  if (!existingText || isOldMissingScheduleNote || (hasImportedMarker && existingText.length < importedSchedule.length)) {
                    this.profiles[key] = { ...current, scheduleText: importedSchedule };
                    seedDataImported = true;
                  }
                });
                if (this.scheduleSeedVersion < 4) {
                  this.scheduleSeedVersion = 4;
                  seedDataImported = true;
                }
                this.applyRoster(rec);
                if (seedDataImported) await this.saveToCloud();
              } else {
                this.bookings = [];
              }
              await this.autoAssignPending();
            }
          } catch (e) {
            console.error('Error al sincronizar:', e);
          } finally {
            this.isLoading = false;
          }
          })();
          this._cloudFetchInFlight = cloudFetchTask;
          try { return await cloudFetchTask; }
          finally { if (this._cloudFetchInFlight === cloudFetchTask) this._cloudFetchInFlight = null; }
        },

        async saveToCloud() {
          this.isLoading = true;
          try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${this.binId}`, {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                'X-Access-Key': this.getAccessKey()
              },
              body: JSON.stringify({ bookings: this.bookings, invDelta: this.makeInvDelta(), profiles: this.profiles, stationery: this.stationery, vales: this.vales, students: this.students, extraUsers: this.extraUsers, libraryBooks: this.libraryBooks, librarySeedVersion: this.librarySeedVersion || 1, scheduleSeedVersion: this.scheduleSeedVersion || 4, bookLoans: this.bookLoans, interLoans: this.interLoans, scheduleFiles: this.scheduleFiles, inactiveUsers: this.inactiveUsers || [] })
            });
            if (!res.ok) throw new Error('Error al guardar');
            return true;
          } catch (e) {
            console.error(e);
            Swal.fire({
              icon: 'error',
              title: 'Error de conexión',
              text: 'No se pudieron sincronizar los cambios en la nube.'
            });
            return false;
          } finally {
            this.isLoading = false;
          }
        },

        scheduleRoom(day, period) {
          const value = String((this.scheduleDraft || {})[day + '-' + period] || '').trim();
          if (!value) return '';
          const match = value.match(/(?:Lab(?:oratory)?\.?\s*\d+|Room\s*(?:\d+|Mt\.?|DT)|Biblioteca)/i);
          return match ? match[0].replace(/\s+/g, ' ').trim() : 'Ubicación no especificada';
        },

        parseImportedSchedule(scheduleText) {
          const draft = {};
          const dayMap = { mon: 1, monday: 1, lun: 1, lunes: 1, tue: 2, tuesday: 2, mar: 2, martes: 2, wed: 3, wednesday: 3, mie: 3, miércoles: 3, miercoles: 3, thu: 4, thursday: 4, jue: 4, jueves: 4, fri: 5, friday: 5, vie: 5, viernes: 5, sat: 6, saturday: 6, sab: 6, sábado: 6, sabado: 6 };
          const lines = String(scheduleText || '').split(/\r?\n/);
          for (const line of lines) {
            const dayMatch = line.match(/^\s*([A-Za-zÁÉÍÓÚáéíóúñÑ]+)\s*:/);
            if (!dayMatch) continue;
            const day = dayMap[dayMatch[1].toLowerCase()];
            if (!day) continue;
            const periodPattern = /P([1-8])\s*(?:\([^)]*\))?\s*:\s*([^;]+?)(?=;\s*P[1-8]\b|$)/g;
            let match;
            while ((match = periodPattern.exec(line.slice(dayMatch[0].length))) !== null) {
              const activity = match[2].trim();
              if (activity && !/^sin clases\/actividades registradas\.?$/i.test(activity)) draft[day + '-' + Number(match[1])] = activity;
            }
          }
          return draft;
        },

        scheduleKeyForTeacher(name) {
          const teacher = (this.usersList || []).find(u => u.role === 'teacher' && this.norm(u.name) === this.norm(name));
          return teacher ? teacher.id : '';
        },

        scheduleBubbleCell(day, period) {
          const key = this.scheduleKeyForTeacher(this.formData.teacher);
          if (!key) return { activity: '', room: '' };
          const profile = this.profiles[key] || {};
          const imported = this.parseImportedSchedule(profile.scheduleText || INITIAL_TEACHER_SCHEDULES[key] || '');
          const saved = profile.schedule && typeof profile.schedule === 'object' ? profile.schedule : {};
          const activity = String((saved[day + '-' + period] !== undefined && String(saved[day + '-' + period]).trim() !== '') ? saved[day + '-' + period] : (imported[day + '-' + period] || '')).trim();
          const roomMatch = activity.match(/(?:Lab(?:oratory)?\.?\s*\d+|Room\s*[\w.]+|Biblioteca)/i);
          return { activity, room: roomMatch ? roomMatch[0].replace(/\s+/g,' ').trim() : '' };
        },

        scheduleBubbleDateLabel() {
          const first = (this.formData.sessions || []).find(x => x.date) || { date: this.formData.date || '' };
          if (!first.date) return 'Vista semanal · selecciona una fecha para destacar el día de la práctica';
          const date = new Date(first.date + 'T12:00:00');
          return 'Semana de la fecha seleccionada · ' + date.toLocaleDateString('es-MX', { day:'numeric', month:'long', year:'numeric' });
        },

        scheduleBubbleSelectedStatus() {
          const first = (this.formData.sessions || []).find(x => x.date) || { date: this.formData.date || '', startPeriod: this.formData.startPeriod || '1' };
          if (!first.date) return { hasDate:false, busy:false, activity:'' };
          const day = new Date(first.date + 'T12:00:00').getDay() || 7;
          const period = Number(first.startPeriod || 1);
          const cell = day >= 1 && day <= 5 ? this.scheduleBubbleCell(day, period) : { activity:'' };
          return { hasDate:true, busy:!!cell.activity, activity:cell.activity || '' };
        },

        scheduleBubbleCellClass(day, period) {
          const cell = this.scheduleBubbleCell(day, period);
          const first = (this.formData.sessions || []).find(x => x.date) || { date: this.formData.date || '', startPeriod: this.formData.startPeriod || '1' };
          const chosenDay = first.date ? (new Date(first.date + 'T12:00:00').getDay() || 7) : 0;
          const chosen = chosenDay === day && period >= Number(first.startPeriod || 1) && period < Number(first.startPeriod || 1) + Number(first.durationPeriods || 1);
          if (chosen) return 'bg-amber-100 border-amber-400 ring-1 ring-amber-300 text-amber-950';
          return cell.activity ? 'bg-rose-50 border-rose-200 text-rose-900' : 'bg-emerald-50 border-emerald-200 text-emerald-900';

        loadSchedule() {
          const profile = this.profiles[this.scheduleOwner] || {};
          const savedGrid = profile.schedule && typeof profile.schedule === 'object' ? profile.schedule : {};
          const hasRealEntries = Object.values(savedGrid).some(value => String(value || '').trim());
          const importedText = profile.scheduleText || INITIAL_TEACHER_SCHEDULES[this.scheduleOwner] || '';
          const importedGrid = this.parseImportedSchedule(importedText);
          // Migración: si la cuadrícula antigua solo tenía datos hasta miércoles,
          // completar jueves y viernes desde el documento sin pisar celdas editadas.
          if (profile.scheduleEdited) {
            // Verónica tenía una cuadrícula histórica incompleta (solo lunes).
            // Completar martes-viernes con el documento oficial sin reemplazar
            // ninguna actividad que ya haya sido editada y guardada.
            if (this.scheduleOwner === 'veronica') {
              const merged = { ...importedGrid };
              Object.entries(savedGrid).forEach(([cell, value]) => {
                if (String(value || '').trim()) merged[cell] = value;
              });
              this.scheduleDraft = merged;
            } else {
              this.scheduleDraft = { ...savedGrid };
            }
          } else {
            const merged = { ...importedGrid };
            Object.entries(savedGrid).forEach(([cell, value]) => {
              if (String(value || '').trim()) merged[cell] = value;
            });
            this.scheduleDraft = hasRealEntries ? merged : importedGrid;
          }
          this.schedulePreview = null;
        },

          const reader = new FileReader();

            const img = new Image();
            img.onload = async () => {
              const c = document.createElement('canvas');
              c.width = c.height = 160;
              const m = Math.min(img.width, img.height);
              c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, 160, 160);
              this.setProfile({ photo: c.toDataURL('image/jpeg', 0.8) });
              await this.saveToCloud();
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(f);
          e.target.value = '';
        },

          if (window.crypto && crypto.subtle) {
            const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('lancaster:' + t));
            return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
          }
          return 'p:' + t;
        },

        isMine(b) {
          const u = this.currentUser;
          if (!u) return false;

        get mySections() {
          const t = this.localStr(new Date());
          const mine = this.bookings.filter(b => this.isMine(b));
          const key = b => b.date + String(b.startPeriod).padStart(2, '0');
          return [
            { title: 'Próximas', items: mine.filter(b => b.date >= t).sort((a, b) => key(a).localeCompare(key(b))) },
            { title: 'Anteriores', items: mine.filter(b => b.date < t).sort((a, b) => key(b).localeCompare(key(a))) }
          ];
        },

        shiftDay(n) {
          const d = new Date(this.dayDate + 'T00:00:00');
          d.setDate(d.getDate() + n);
          this.dayDate = this.localStr(d);
        },

        get dayTotal() { return this.bookings.filter(b => b.date === this.dayDate).length; },

        get dayPeriods() {
          const out = [];
          for (let p = 1; p <= 8; p++) {
            const m = {};
            this.bookings.filter(b => b.date === this.dayDate && p >= parseInt(b.startPeriod) && p <= parseInt(b.startPeriod) + parseInt(b.durationPeriods) - 1).forEach(b => {
              const n = this.getDisplaySpace(b);
              (m[n] = m[n] || { name: n, labType: b.labType, items: [] }).items.push(b);
            });
            out.push({ p, spaces: Object.values(m).sort((a, b) => a.name.localeCompare(b.name, 'es', { numeric: true })) });
          }
          return out;
        },

        // ===== ATENDER PRÁCTICA (checklist de preparación) =====
        prepGroups(b) {
          const mk = (kind, label, icon, arr, detail) => {
            const seen = new Set(), items = [];
            (arr || []).forEach(x => {
              if (!x || !String(x.name || '').trim()) return;
              const key = kind + '|' + this.norm(x.name);
              if (seen.has(key)) return;
              seen.add(key); items.push({ key, name: String(x.name).trim(), detail: detail(x), raw: x });
            });
            return { kind, label, icon, items };
          };
          return [
            mk('m', 'Materiales generales', 'ph-flask', b.materialsList, x => x.quantity ? 'Cantidad: ' + x.quantity : ''),
            mk('r', 'Reactivos y soluciones', 'ph-test-tube', b.reagentsList, x => [x.concentration, x.volume].filter(Boolean).join(' | ')),
            mk('f', 'Material fresco', 'ph-plant', b.freshMaterialsList, x => x.quantity ? 'Cantidad: ' + x.quantity : ''),
            mk('s', 'Papelería', 'ph-paperclip', b.stationeryList, x => x.quantity ? 'Cantidad: ' + x.quantity : '')
          ].filter(g => g.items.length);
        },

        prepTotals(b) {
          const keys = this.prepGroups(b).flatMap(g => g.items.map(i => i.key)), pc = b.prepChecks || {};
          return { total: keys.length, done: keys.filter(k => pc[k]).length };
        },

        prepComplete(b) { const t = this.prepTotals(b); return t.total > 0 && t.done === t.total; },
        prepPct(b) { const t = this.prepTotals(b); return t.total ? Math.round(t.done * 100 / t.total) : 0; },
        isPrepared(b, key) { return !!(b.prepChecks && b.prepChecks[key]); },
        prepBy(b, key) { return String((b.prepChecks || {})[key] || '').split(' ')[0]; },

        queuePrepSave() {
          this._prepChain = (this._prepChain || Promise.resolve()).then(() => this.saveToCloud());
          return this._prepChain;
        },

        togglePrep(b, key) {
          const live = this.bookings.find(x => x.id === b.id);
          if (!live) return;
          const pc = { ...(live.prepChecks || {}) };
          if (pc[key]) delete pc[key]; else pc[key] = this.currentUser.name;
          live.prepChecks = pc;
          return this.queuePrepSave();
        },

        setAllPrep(b, on) {
          const live = this.bookings.find(x => x.id === b.id);
          if (!live) return;
          const keys = this.prepGroups(live).flatMap(g => g.items.map(i => i.key)), old = live.prepChecks || {}, pc = {};
          if (on) keys.forEach(k => { pc[k] = old[k] || this.currentUser.name; });
          live.prepChecks = pc;
          return this.queuePrepSave();
        },

        attendTime(b) {
          const sp = parseInt(b.startPeriod), du = parseInt(b.durationPeriods) || 1;
          const endT = (PERIOD_TIMES[sp + du - 2] || PERIOD_TIMES[sp - 1] || ['', ''])[1];
          return (du > 1 ? 'P' + sp + '-' + (sp + du - 1) : 'P' + sp) + ' · ' + this.periodStart(sp) + ' – ' + endT;
        },

        attendNow(b) {
          const L = this.liveBanner;
          if (b.date !== L.today) return '';
          const sp = parseInt(b.startPeriod), ep = sp + (parseInt(b.durationPeriods) || 1) - 1;
          if (L.cur && L.cur >= sp && L.cur <= ep) return 'now';
          if (L.next && sp === L.next) return 'next';
          return '';
        },

        isAttendOpen(b) { return b.id in this.attendOpen ? this.attendOpen[b.id] : this.attendNow(b) !== ''; },
        toggleAttend(b) { this.attendOpen = { ...this.attendOpen, [b.id]: !this.isAttendOpen(b) }; },

        get attendList() {
          const me = this.norm(this.currentUser && this.currentUser.name);
          return this.bookings.filter(b => b.date === this.dayDate && (!this.attendMine || !b.labTech || this.norm(b.labTech) === me))
            .sort((a, b) => (parseInt(a.startPeriod) - parseInt(b.startPeriod)) || String(a.labType).localeCompare(String(b.labType)));
        },

        get attendReady() { return this.attendList.filter(b => this.prepComplete(b)).length; },

        get sheetTeachers() {
          const names = new Map();
          this.bookings.filter(b => b.date === this.dayDate && (b.teacher || '').trim()).forEach(b => { const k = this.norm(b.teacher); if (!names.has(k)) names.set(k, b.teacher.trim()); });
          if (this.sheetAllTeachers) this.usersList.filter(u => u.role === 'teacher').forEach(u => { const k = this.norm(u.name); if (!names.has(k)) names.set(k, u.name); });
          return [...names.values()].sort((a, b) => a.localeCompare(b, 'es'));
        },

        sheetCell(teacher, p) {
          const k = this.norm(teacher);
          return this.bookings.filter(b => b.date === this.dayDate && this.norm(b.teacher) === k && p >= parseInt(b.startPeriod) && p <= parseInt(b.startPeriod) + (parseInt(b.durationPeriods) || 1) - 1);
        },

        sheetSpace(b) {
          const m = /^Laboratorio\s*(\d+)/i.exec(b.labType || '');
          return m ? 'LAB ' + m[1] : this.getDisplaySpace(b);
        },

        sheetNow(p) { return this.dayDate === this.liveBanner.today && this.liveBanner.cur === p; },

        printSheet() {
          this.printMode = 'sheet';
          this.printHeaderTitle = 'Practical Request';
          this.printHeaderSubtitle = 'Hoja diaria por periodo y profesor';
          this.printHeaderDate = this.formatDisplayDate(this.dayDate);

        syncSession() {

          this.formData.date = f.date || '';
          this.formData.startPeriod = f.startPeriod || '1';
          this.formData.durationPeriods = f.durationPeriods || '1';
          this.validateRules();
        },

        norm(t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); },

        ownsIA(item) {
          if (!item || !item.isIA || !this.currentUser) return false;
          if (this.currentUser.email && item.studentEmail && String(item.studentEmail).toLowerCase() === this.currentUser.email) return true;
          return [item.ownerName, item.studentName].some(n => this.norm(n) === this.norm(this.currentUser.name));
        },

        toMin(t) { const a = t.split(':'); return +a[0] * 60 + +a[1]; },

safeUrl(u) {
          let t = String(u || '').trim();
          if (!t) return '';
          if (!/^https?:\/\//i.test(t)) t = 'https://' + t;
          try { const x = new URL(t); return /^https?:$/.test(x.protocol) && x.hostname.includes('.') ? x.href : ''; } catch (e) { return ''; }

        addRefRow() {

        removeRefRow(i) { this.formData.referencesList.splice(i, 1); },

        forgotPassword() {

        async adminResetPassword() {

        readAsDataURL(f) {
          return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
        },

        compressImage(f) {
          return new Promise((ok, no) => {
            const img = new Image();
            img.onload = () => {
              const k = Math.min(1, 1600 / Math.max(img.width, img.height));
              const c = document.createElement('canvas');
              c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
              c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
              ok(c.toDataURL('image/jpeg', 0.82));
            };
            img.onerror = no;
            this.readAsDataURL(f).then(d => { img.src = d; }, no);
          });
        },

        async uploadScheduleFile(e) {
          const f = e.target.files[0];
          e.target.value = '';
          if (!f) return;
          const isImg = f.type.startsWith('image/');
          if (!isImg && f.size > 2 * 1024 * 1024) { Swal.fire('Archivo muy grande', 'El archivo no debe exceder 2 MB.', 'warning'); return; }
          try {
            const data = isImg ? await this.compressImage(f) : await this.readAsDataURL(f);
            const type = isImg ? 'image/jpeg' : (f.type || 'application/octet-stream');
            const cur = this.myProfile.scheduleFile;
            const headers = { 'Content-Type': 'application/json', 'X-Access-Key': this.getAccessKey() };
            if (!(cur && cur.binId)) { headers['X-Bin-Private'] = 'true'; headers['X-Bin-Name'] = 'horario-' + this.profileKey; }
            const res = await fetch('https://api.jsonbin.io/v3/b' + (cur && cur.binId ? '/' + cur.binId : ''), { method: cur && cur.binId ? 'PUT' : 'POST', headers, body: JSON.stringify({ name: f.name, type, data }) });
            if (!res.ok) throw new Error('upload');
            const binId = cur && cur.binId ? cur.binId : (await res.json()).metadata.id;
            this.setProfile({ scheduleFile: { binId, name: f.name, type } });
            await this.saveToCloud();
            this.schedulePreview = null;
            Swal.fire({ icon: 'success', title: 'Archivo guardado', timer: 1500, showConfirmButton: false });
          } catch (err) {
            Swal.fire('No se pudo subir', 'Intenta con un archivo más pequeño o más tarde.', 'error');
          }
        },

        async openScheduleFile(key) {
          const f = (this.profiles[key] || {}).scheduleFile;
          if (!f) return;
          try {
            const r = await fetch('https://api.jsonbin.io/v3/b/' + f.binId + '/latest', { headers: { 'X-Access-Key': this.getAccessKey() } });
            if (!r.ok) throw new Error('read');
            const rec = (await r.json()).record;
            const url = URL.createObjectURL(await (await fetch(rec.data)).blob());
            if (rec.type === 'application/pdf' || rec.type.startsWith('image/')) {
              this.schedulePreview = { url, type: rec.type, name: rec.name };
            } else {
              const a = document.createElement('a');
              a.href = url; a.download = rec.name;
              document.body.appendChild(a); a.click(); a.remove();
            }
          } catch (err) {
            Swal.fire('No se pudo abrir', 'Intenta de nuevo en unos momentos.', 'error');
          }
        },

        async removeScheduleFile() {
          const f = this.myProfile.scheduleFile;
          if (!f) return;
          fetch('https://api.jsonbin.io/v3/b/' + f.binId, { method: 'DELETE', headers: { 'X-Access-Key': this.getAccessKey() } }).catch(() => {});
          this.setProfile({ scheduleFile: null });
          this.schedulePreview = null;
          await this.saveToCloud();
        },

get pendingStationery() { return this.stationery.filter(r => r.status !== 'Entregada').length; },

        get stationeryGroups() {
          const me = this.currentUser, admin = me && me.role === 'admin';
          const list = this.stationery.filter(r => (admin || this.norm(r.requester) === this.norm(me.name)) && (this.stFilter === 'Todas' || (this.stFilter === 'Entregada') === (r.status === 'Entregada')));
          const by = {};
          list.forEach(r => (by[r.date] = by[r.date] || []).push(r));
          const dates = Object.keys(by).sort();
          if (this.stFilter === 'Entregada') dates.reverse();
          return dates.map(d => ({ date: d, items: by[d].sort((a, b) => a.id - b.id) }));

        get upcomingStationery() {

          return this.stationery.filter(r => r.status !== 'Entregada' && days.includes(r.date)).sort((a, b) => a.date.localeCompare(b.date));

        canEditStationery(r) {

        openStationery(r) {
          this.editingStId = r ? r.id : null;
          this.stForm = r ? JSON.parse(JSON.stringify({ date: r.date, purpose: r.purpose, grade: r.grade || '', space: r.space || '', classroom: r.classroom || '', notes: r.notes || '', items: r.items }))
                          : { date: '', purpose: '', grade: '', space: '', classroom: '', notes: '', items: [{ name: '', quantity: '' }] };

        isInstEmail(e) { return /^[a-z0-9._%+-]+@lancaster\.edu\.mx$/i.test(String(e || '').trim()); },

        get filteredStudents() {

          return [...this.students].sort((a, b) => a.name.localeCompare(b.name, 'es'))

        applyRoster(rec) {

          if (this.students.some(x => x.email === email)) { Swal.fire('Ya está registrado', 'Ese correo ya existe en la lista.', 'info'); return; }
          this.students = [...this.students, { email, name, createdAt: Date.now() }];

          const list = [...this.students], bad = [];
          let added = 0, dup = 0;

            const name = parts.filter(x => !x.includes('@')).join(' ').trim();
            if (!name || !this.isInstEmail(email)) { bad.push(l); return; }
            if (list.some(x => x.email === email)) { dup++; return; }
            list.push({ email, name, createdAt: Date.now() }); added++;
          });
          if (added) { this.students = list; await this.saveToCloud(); }
          this.stImport = bad.join('\n');
