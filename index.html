<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitácora de Laboratorios - La Escuela de Lancaster</title>
  <!-- CSS de Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Iconos Phosphor -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#e11d48',
              600: '#c8102e', // Rojo institucional Escuela de Lancaster
              700: '#9f1239',
              800: '#881337',
              900: '#4c0519',
            }
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white !important; }
    }
  </style>
</head>
<body class="h-full font-sans text-slate-800 text-base antialiased bg-slate-100 flex flex-col min-h-screen" x-data="appData()" x-init="initData()">

  <!-- PANTALLA DE INICIO DE SESIÓN POR USUARIO -->
  <div x-show="!currentUser" x-cloak class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl border border-slate-200 text-center space-y-6">
      
      <div class="mx-auto w-16 h-16 rounded-2xl bg-brand-50 border border-brand-200 flex items-center justify-center text-brand-600 shadow-sm">
        <i class="ph ph-user-lock text-3xl"></i>
      </div>

      <div>
        <h2 class="text-xl font-black text-slate-900 uppercase tracking-wide">Iniciar Sesión</h2>
        <p class="text-base text-slate-600 font-medium mt-1">Bitácora de Laboratorios — La Escuela de Lancaster</p>
      </div>

      <!-- Formulario de Selección de Usuario y Clave -->
      <form @submit.prevent="login()" class="space-y-4 text-left">
        <div>
          <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">Usuario / Personal *</label>
          <select x-model="selectedUserKey" required class="w-full text-base font-semibold px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-600 bg-slate-50 text-slate-800">
            <option value="" disabled selected>Selecciona tu nombre...</option>
            <optgroup label="Laboratoristas">
              <template x-for="user in usersList.filter(u => u.role === 'admin')" :key="user.id">
                <option :value="user.id" x-text="user.name + ' (' + user.title + ')'"></option>
              </template>
            </optgroup>
            <optgroup label="Profesores">
              <template x-for="user in usersList.filter(u => u.role === 'teacher')" :key="user.id">
                <option :value="user.id" x-text="user.name + ' (' + user.title + ')'"></option>
              </template>
            </optgroup>
            <optgroup label="Alumnos">
              <option value="alumnos">Alumnos (acceso general)</option>
            </optgroup>
          </select>
        </div>

        <div x-show="selectedUserKey === 'alumnos'" x-cloak>
          <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">Tu nombre completo *</label>
          <input type="text" x-model="studentName" :required="selectedUserKey === 'alumnos'" placeholder="Nombre y apellido" class="w-full text-base font-semibold px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-600 bg-slate-50 text-slate-800">
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">Contraseña *</label>
          <div class="relative">
            <input :type="showPassword ? 'text' : 'password'" x-model="inputPassword" required placeholder="Ingresa tu clave" class="w-full text-base font-semibold px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-600 bg-slate-50 text-slate-800">
            <button type="button" @click="showPassword = !showPassword" class="absolute right-3 top-3.5 text-slate-400 hover:text-slate-600">
              <i class="ph text-xl" :class="showPassword ? 'ph-eye-slash' : 'ph-eye'"></i>
            </button>
          </div>
        </div>

        <p x-show="authError" class="text-sm font-bold text-brand-600 flex items-center gap-1.5" x-cloak>
          <i class="ph ph-warning-circle text-lg"></i> Contraseña incorrecta para el usuario seleccionado.
        </p>

        <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-black text-base rounded-xl transition shadow-md uppercase tracking-wider">
          Ingresar al Sistema
        </button>
      </form>

      <p class="text-xs text-slate-400 font-medium">Uso exclusivo para personal docente y de laboratorio.</p>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <template x-if="currentUser">
    <div class="flex flex-col min-h-screen">
      
      <!-- ENCABEZADO INSTITUCIONAL CON PERFIL DILIGENTE -->
      <header class="bg-brand-600 text-white shadow-lg sticky top-0 z-30 no-print border-b border-brand-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex justify-between h-20 items-center">
            
            <!-- Logo y Datos Institucionales -->
            <div class="flex items-center gap-3.5">
              <div class="w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-white border border-white/20 shadow-inner">
                <i class="ph ph-flask text-3xl"></i>
              </div>
              <div>
                <h1 class="font-black text-xl text-white leading-tight uppercase tracking-wide">Bitácora de Laboratorios</h1>
                <p class="text-base text-rose-100/90 font-medium tracking-normal">La Escuela de Lancaster</p>
              </div>
            </div>

            <!-- Identificación del Usuario y Acciones -->
            <div class="flex items-center gap-2 sm:gap-3">
              
              <!-- Perfil -->
              <button @click="openProfile()" class="flex items-center gap-2.5 mr-1 rounded-xl hover:bg-white/10 px-2 py-1 transition" title="Mi perfil">
                <div class="hidden lg:flex flex-col text-right">
                  <span class="text-sm font-black text-white" x-text="currentUser.name"></span>
                  <span class="text-xs font-semibold text-rose-200" x-text="currentUser.role === 'admin' ? 'Laboratorista (Acceso Total)' : (currentUser.role === 'student' ? 'Alumno' : 'Profesor')"></span>
                </div>
                <span class="w-10 h-10 rounded-full overflow-hidden border-2 border-white/60 bg-brand-800 flex items-center justify-center text-sm font-black shrink-0">
                  <img x-show="myProfile.photo" :src="myProfile.photo" class="w-full h-full object-cover" alt="">
                  <span x-show="!myProfile.photo" x-text="initials"></span>
                </span>
              </button>

              <!-- Alerta Próximas -->
              <button @click="showUpcomingAlertManual()" class="relative inline-flex items-center gap-2 bg-brand-700/80 hover:bg-brand-800 text-white font-bold text-base px-3.5 py-2.5 rounded-lg transition border border-white/20">
                <i class="ph ph-bell text-xl"></i>
                <span class="hidden sm:inline">Próximas</span>
                <template x-if="upcomingBookingsCount > 0">
                  <span class="bg-amber-400 text-brand-900 font-black text-sm px-2 py-0.5 rounded-full border border-amber-300" x-text="upcomingBookingsCount"></span>
                </template>
              </button>

              <button x-show="currentUser.role !== 'student'" @click="openFreshMaterialModal()" class="inline-flex items-center gap-2 bg-amber-600 hover:bg-amber-700 text-white font-bold text-base px-4 py-2.5 rounded-lg transition shadow-xs border border-amber-500">
                <i class="ph ph-plant text-xl"></i>
                <span>PDF Material Fresco</span>
              </button>

              <button x-show="currentUser.role !== 'student'" @click="openDailyPrintModal()" class="inline-flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white font-bold text-base px-4 py-2.5 rounded-lg transition border border-white/20">
                <i class="ph ph-printer text-xl"></i>
                <span>Reportes PDF</span>
              </button>

              <button @click="openModal()" class="inline-flex items-center gap-2 bg-white text-brand-800 hover:bg-slate-50 font-black text-base px-4 py-2.5 rounded-lg transition shadow-md border border-white">
                <i class="ph ph-plus-circle text-xl text-brand-600"></i>
                <span x-text="isStudent ? 'Agendar Internal Assessment' : 'Agendar Práctica'"></span>
              </button>

              <!-- Cerrar Sesión -->
              <button @click="logout()" class="p-2.5 bg-brand-800/80 hover:bg-brand-900 text-rose-100 rounded-lg border border-white/20 transition" title="Cerrar Sesión">
                <i class="ph ph-sign-out text-xl"></i>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- CONTENIDO PRINCIPAL -->
      <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-5 no-print">

        <!-- AVISO EN VIVO (LABORATORISTAS) -->
        <div x-show="currentUser.role === 'admin'" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="rounded-xl border p-4 shadow-xs" :class="liveBanner.curItems.length ? 'bg-emerald-50 border-emerald-300' : 'bg-white border-slate-200'">
            <div class="flex items-center gap-2 mb-2">
              <span class="relative flex h-3 w-3"><span x-show="liveBanner.curItems.length" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3" :class="liveBanner.curItems.length ? 'bg-emerald-500' : 'bg-slate-300'"></span></span>
              <h3 class="text-base font-black uppercase tracking-wider text-slate-800" x-text="liveBanner.cur ? 'Ahora · Periodo ' + liveBanner.cur : 'Ahora · fuera de periodo'"></h3>
            </div>
            <template x-for="it in liveBanner.curItems" :key="it.id">
              <div @click="viewDetail(it)" class="text-base cursor-pointer hover:bg-white/70 rounded px-1"><b x-text="getDisplaySpace(it)"></b> — <span x-text="it.practiceName || it.subject"></span> <span class="text-slate-500" x-text="'· ' + it.teacher"></span></div>
            </template>
            <p x-show="!liveBanner.curItems.length" class="text-sm text-slate-500 font-semibold">Sin prácticas en curso.</p>
          </div>
          <div class="rounded-xl border p-4 shadow-xs" :class="liveBanner.nextItems.length ? (liveBanner.toNext <= 15 ? 'bg-amber-100 border-amber-400 animate-pulse' : 'bg-amber-50 border-amber-300') : 'bg-white border-slate-200'">
            <div class="flex items-center gap-2 mb-2">
              <i class="ph ph-bell-ringing text-xl" :class="liveBanner.nextItems.length ? 'text-amber-600' : 'text-slate-300'"></i>
              <h3 class="text-base font-black uppercase tracking-wider text-slate-800" x-text="liveBanner.next ? 'Siguiente · Periodo ' + liveBanner.next + ' (en ' + liveBanner.toNext + ' min)' : 'Sin más periodos hoy'"></h3>
            </div>
            <template x-for="it in liveBanner.nextItems" :key="it.id">
              <div @click="viewDetail(it)" class="text-base cursor-pointer hover:bg-white/70 rounded px-1"><b x-text="getDisplaySpace(it)"></b> — <span x-text="it.practiceName || it.subject"></span> <span class="text-slate-500" x-text="'· ' + it.teacher"></span> <span x-show="it.needsFreshMaterial">🌿</span></div>
            </template>
            <p x-show="!liveBanner.nextItems.length" class="text-sm text-slate-500 font-semibold">Ninguna práctica inicia en el siguiente periodo.</p>
          </div>
        </div>

        <!-- REQUISITOS INSTITUCIONALES -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-white border-l-4 border-l-brand-600 border border-slate-200 rounded-r-xl p-4 shadow-xs flex gap-3.5 items-center">
            <div class="p-3 bg-slate-100 text-brand-700 rounded-lg shrink-0">
              <i class="ph ph-clock text-2xl"></i>
            </div>
            <div>
              <h3 class="text-base font-extrabold uppercase tracking-wider text-slate-800">Anticipación General (48 Horas)</h3>
              <p class="text-base text-slate-600 mt-0.5">Mínimo 48 horas de antelación. Entre 24 y 48 horas se marca como <strong>Extemporánea</strong>; con menos de 24 horas no se puede agendar.</p>
            </div>
          </div>

          <div class="bg-white border-l-4 border-l-amber-500 border border-slate-200 rounded-r-xl p-4 shadow-xs flex gap-3.5 items-center">
            <div class="p-3 bg-slate-100 text-amber-700 rounded-lg shrink-0">
              <i class="ph ph-plant text-2xl"></i>
            </div>
            <div>
              <h3 class="text-base font-extrabold uppercase tracking-wider text-slate-800">Insumos y Material Fresco</h3>
              <p class="text-base text-slate-600 mt-0.5">Lo que se compra fuera debe pedirse el <strong>miércoles de la semana previa antes de las 12:00 PM</strong> .</p>
            </div>
          </div>
        </div>

        <!-- PANEL DE CONTROLES -->
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
          <!-- Navegación -->
          <div class="flex items-center gap-2 flex-wrap" x-show="!['inventory','day','mine'].includes(currentView)">
            <button @click="navigate(-1)" class="p-2.5 hover:bg-slate-100 border border-slate-200 rounded-lg text-slate-700 transition" title="Semana Anterior">
              <i class="ph ph-caret-left text-xl"></i>
            </button>
            <span class="text-base font-black text-slate-800 min-w-[240px] text-center uppercase tracking-wide" x-text="weekRangeText"></span>
            <button @click="navigate(1)" class="p-2.5 hover:bg-slate-100 border border-slate-200 rounded-lg text-slate-700 transition" title="Semana Siguiente">
              <i class="ph ph-caret-right text-xl"></i>
            </button>
            <button @click="goToday()" class="ml-2 text-base font-bold text-brand-700 hover:text-brand-900 bg-brand-50 hover:bg-brand-100 border border-brand-200 px-3.5 py-2 rounded-lg transition">
              Hoy
            </button>
            <div class="flex items-center border border-slate-200 rounded-lg p-1 bg-slate-100 ml-1">
              <template x-for="m in [['day','Día'],['week','Semana'],['month','Mes']]" :key="m[0]">
                <button @click="calendarMode = m[0]" :class="calendarMode === m[0] ? 'bg-white shadow-xs text-slate-900 font-black' : 'text-slate-600 font-semibold'" class="px-3 py-1.5 text-base rounded-md transition" x-text="m[1]"></button>
              </template>
            </div>
          </div>

          <!-- Filtro por Ubicación -->
          <div x-show="!['inventory','day','mine'].includes(currentView)" class="flex items-center gap-2.5 w-full lg:w-auto">
            <label class="text-base font-bold text-slate-600 uppercase tracking-wider shrink-0">Ubicación:</label>
            <select x-model="selectedLabFilter" class="text-base font-semibold bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-800 focus:ring-2 focus:ring-brand-600">
              <option value="ALL">Todos los Espacios</option>
              <template x-for="lab in labOptions" :key="lab.id">
                <option :value="lab.name" x-text="lab.name"></option>
              </template>
            </select>
          </div>

          <!-- Vistas y Descarga -->
          <div class="flex items-center gap-2.5 w-full lg:w-auto justify-between lg:justify-end">
            <div class="flex items-center border border-slate-200 rounded-lg p-1 bg-slate-100">
              <button @click="currentView = 'calendar'" :class="currentView === 'calendar' ? 'bg-white shadow-xs text-slate-900 font-black' : 'text-slate-600 hover:text-slate-900 font-semibold'" class="px-3.5 py-2 text-base rounded-md transition flex items-center gap-1.5">
                <i class="ph ph-calendar-blank text-lg"></i>
                <span>Calendario</span>
              </button>
              <button @click="currentView = 'list'" :class="currentView === 'list' ? 'bg-white shadow-xs text-slate-900 font-black' : 'text-slate-600 hover:text-slate-900 font-semibold'" class="px-3.5 py-2 text-base rounded-md transition flex items-center gap-1.5">
                <i class="ph ph-list-bullets text-lg"></i>
                <span>Lista</span>
              </button>
              <button x-show="currentUser.role !== 'admin'" @click="currentView = 'mine'" :class="currentView === 'mine' ? 'bg-white shadow-xs text-slate-900 font-black' : 'text-slate-600 hover:text-slate-900 font-semibold'" class="px-3.5 py-2 text-base rounded-md transition flex items-center gap-1.5">
                <i class="ph ph-user-list text-lg"></i>
                <span x-text="isStudent ? 'Mi IA' : 'Mis prácticas'"></span>
              </button>
              <button x-show="currentUser.role === 'admin'" @click="currentView = 'day'" :class="currentView === 'day' ? 'bg-white shadow-xs text-slate-900 font-black' : 'text-slate-600 hover:text-slate-900 font-semibold'" class="px-3.5 py-2 text-base rounded-md transition flex items-center gap-1.5">
                <i class="ph ph-calendar-check text-lg"></i>
                <span>Del día</span>
              </button>
              <button @click="currentView = 'inventory'" :class="currentView === 'inventory' ? 'bg-white shadow-xs text-slate-900 font-black' : 'text-slate-600 hover:text-slate-900 font-semibold'" class="px-3.5 py-2 text-base rounded-md transition flex items-center gap-1.5">
                <i class="ph ph-package text-lg"></i>
                <span>Inventario</span>
              </button>
            </div>

            <button @click="fetchFromCloud()" class="text-base font-bold text-slate-700 hover:bg-slate-100 border border-slate-300 bg-white px-3.5 py-2 rounded-lg transition flex items-center gap-1.5">
              <i class="ph ph-arrows-clockwise text-lg" :class="isLoading ? 'animate-spin' : ''"></i>
              <span>Actualizar</span>
            </button>

            <button x-show="!isStudent" @click="exportCSV()" class="text-base font-bold text-slate-700 hover:bg-slate-100 border border-slate-300 bg-white px-3.5 py-2 rounded-lg transition flex items-center gap-1.5">
              <i class="ph ph-download-simple text-lg"></i>
              <span>Exportar</span>
            </button>
          </div>
        </div>

        <!-- VISTA CALENDARIO POR PERIODOS -->
        <div x-show="currentView === 'calendar' && calendarMode !== 'month'" class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full border-collapse text-left min-w-[1050px]">
              <thead>
                <tr class="bg-slate-100 border-b border-slate-200 text-slate-700">
                  <th class="p-3.5 text-base font-black uppercase tracking-wider w-36 text-center border-r border-slate-200">Periodo</th>
                  <template x-for="day in visibleDays" :key="day.dateStr">
                    <th class="p-3.5 text-center border-r border-slate-200 last:border-r-0" :class="day.isToday ? 'bg-brand-50/70' : ''">
                      <div class="text-base font-black uppercase tracking-wider text-slate-500" x-text="day.dayName"></div>
                      <div class="text-lg font-black text-slate-800 mt-0.5" x-text="day.formattedDate"></div>
                    </th>
                  </template>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200 text-base">
                <template x-for="period in [1,2,3,4,5,6,7,8]" :key="period">
                  <tr>
                    <td class="p-3.5 font-black text-slate-800 text-center bg-slate-50 border-r border-slate-200">
                      <div class="font-black text-base text-slate-900" x-text="'Periodo ' + period"></div>
                    </td>

                    <template x-for="day in visibleDays" :key="day.dateStr">
                      <td class="p-2 border-r border-slate-200 last:border-r-0 align-top h-36 hover:bg-slate-50/60 transition" :class="day.isToday ? 'bg-brand-50/20' : ''">
                        <div class="space-y-2">
                          <template x-for="item in getBookingsForSlot(day.dateStr, period)" :key="item.id">
                            <div @click="viewDetail(item)" class="p-3 rounded-lg border text-left cursor-pointer transition shadow-xs group hover:border-slate-400 bg-white" :class="getLabStyle(item.labType)">
                              <div class="flex items-center justify-between mb-1.5 gap-1 flex-wrap">
                                <span class="text-xs font-black px-2 py-0.5 rounded border uppercase" :class="getLabBadgeStyle(item.labType)" x-text="getDisplaySpace(item)"></span>
                                <div class="flex items-center gap-1">
                                  <span x-show="item.isExtemp" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-brand-600 text-white uppercase tracking-wider">Extemporánea</span>
                                  <span x-show="item.needsFreshMaterial" title="Requiere Material Fresco" class="text-amber-700"><i class="ph ph-plant-bold text-base"></i></span>
                                </div>
                              </div>

                              <div class="font-extrabold text-base leading-snug">
                                <span :class="getSubjectColorClass(item.subject)" x-text="item.subject"></span>: 
                                <span class="font-bold text-slate-800" x-text="item.practiceName || 'Práctica General'"></span>
                              </div>
                              
                              <div class="text-sm font-semibold truncate mt-1.5 flex items-center gap-1.5 text-slate-600">
                                <span class="w-3 h-3 rounded-full inline-block shrink-0 border border-black/10" :style="'background-color:' + getTeacherColor(item.teacher)"></span>
                                <span x-text="item.teacher" class="text-slate-800"></span>
                              </div>
                              <div x-show="item.isIA" class="text-xs font-black text-brand-700 mt-1 uppercase" x-text="'IA · ' + item.studentName"></div>
                              <div x-show="item.group" class="text-xs font-bold text-slate-500" x-text="'Grupo ' + item.group"></div>
                            </div>
                          </template>
                        </div>
                      </td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- VISTA MIS PRÁCTICAS -->
        <div x-show="currentView === 'mine'" class="space-y-5">
          <template x-for="sec in mySections" :key="sec.title">
            <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
              <div class="px-4 py-3 bg-slate-100 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-base font-black uppercase tracking-wider text-slate-800" x-text="sec.title"></h3>
                <span class="text-sm font-bold text-slate-500" x-text="sec.items.length + ' registro(s)'"></span>
              </div>
              <div class="divide-y divide-slate-200">
                <template x-for="item in sec.items" :key="item.id">
                  <div class="p-4 flex flex-wrap items-center justify-between gap-3 hover:bg-slate-50 transition">
                    <div class="min-w-[220px]">

                    <template x-for="item in sp.items" :key="item.id">
                      <div @click="viewDetail(item)" class="p-3 rounded-lg border cursor-pointer hover:border-slate-400 bg-white" :class="getLabStyle(item.labType)">

                          <span :class="getSubjectColorClass(item.subject)" x-text="item.subject"></span>:
                          <span class="text-slate-800" x-text="item.practiceName || 'Práctica General'"></span>
                          <span x-show="item.needsFreshMaterial" title="Material fresco" class="text-amber-700"><i class="ph ph-plant-bold"></i></span>
                          <span x-show="item.isIA" class="text-xs font-black text-brand-700 uppercase" x-text="'IA · ' + item.studentName"></span>
                        </div>
                        <div class="text-sm font-semibold text-slate-600 mt-1 flex items-center gap-1.5 flex-wrap">
                          <span class="w-3 h-3 rounded-full inline-block border border-black/10" :style="'background-color:' + getTeacherColor(item.teacher)"></span>
                          <span class="text-slate-800" x-text="item.teacher"></span>
                          <span x-text="'· ' + item.studentsCount + ' alumnos' + (item.grade ? ' · ' + item.grade : '') + ' (' + groupText(item) + ')' + (item.group ? ' · Grupo ' + item.group : '')"></span>

              </template>
            </div>
          </template>
        </div>

        <!-- VISTA MES -->
        <div x-show="currentView === 'calendar' && calendarMode === 'month'" class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-x-auto">

              <div @click="openDay(c.dateStr)" class="min-h-[110px] p-1.5 border-b border-r border-slate-200 cursor-pointer hover:bg-slate-50" :class="[c.inMonth ? '' : 'bg-slate-50 opacity-50', c.isToday ? 'bg-brand-50/50' : '']">
                <div class="text-sm font-black text-slate-700" x-text="c.day"></div>
                <template x-for="b in c.items.slice(0,3)" :key="b.id">
                  <div class="mt-1 text-xs font-bold truncate px-1.5 py-0.5 rounded border" :class="getLabBadgeStyle(b.labType)" x-text="'P' + b.startPeriod + ' ' + (b.practiceName || b.subject)"></div>

            </template>
          </div>
        </div>

        <!-- VISTA INVENTARIO -->
        <div x-show="currentView === 'inventory'" class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">

            <div class="flex items-center gap-2 flex-wrap">

              </select>
              <span class="text-sm text-slate-500 font-semibold" x-text="'Mostrando ' + filteredInventory.length + ' de ' + filteredInventoryAll.length"></span>
            </div>
            <button x-show="currentUser.role === 'admin'" @click="editInventoryItem(null)" class="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-black px-4 py-2 rounded-lg"><i class="ph ph-plus-circle text-xl"></i> Agregar artículo</button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead><tr class="bg-slate-100 text-base font-bold text-slate-700 uppercase tracking-wider"><th class="p-4">Artículo</th><th class="p-4">Categoría / Tipo</th><th class="p-4">Disponible</th><th class="p-4">Mínimo</th><th class="p-4 text-right" x-show="currentUser.role === 'admin'">Acciones</th></tr></thead>
              <tbody class="divide-y divide-slate-200 text-base">
                <template x-for="it in filteredInventory" :key="it.id">
                  <tr>
                    <td class="p-4"><div class="font-bold text-slate-900" x-text="it.name"></div><div class="text-xs text-slate-500" x-text="(it.desc || '') + (it.loc ? ' · ' + it.loc : '')"></div></td>
                    <td class="p-4 text-sm font-semibold text-slate-600" x-text="it.cat + ' · ' + (it.kind === 'consumible' ? 'Consumible' : 'Equipo')"></td>
                    <td class="p-4"><span class="font-black px-3 py-1 rounded-full border" :class="(it.min > 0 && it.stock <= it.min) ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'" x-text="it.stock + ' ' + (it.unit || '')"></span></td>
                    <td class="p-4 text-slate-600" x-text="it.min || '-'"></td>
                    <td class="p-4 text-right whitespace-nowrap" x-show="currentUser.role === 'admin'">
                      <button @click="adjustStock(it)" title="Sumar / restar" class="p-2 rounded-lg hover:bg-slate-100"><i class="ph ph-plus-minus text-xl"></i></button>
                      <button @click="editInventoryItem(it)" class="p-2 rounded-lg hover:bg-brand-50"><i class="ph ph-pencil-simple text-xl"></i></button>
                      <button @click="deleteInventoryItem(it)" class="p-2 rounded-lg text-rose-500 hover:bg-rose-50"><i class="ph ph-trash text-xl"></i></button>
                    </td>
                  </tr>
                </template>
                <tr x-show="filteredInventory.length === 0"><td colspan="5" class="p-8 text-center text-slate-500 font-semibold">Sin artículos en el inventario.</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- VISTA LISTA -->
        <div x-show="currentView === 'list'" class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-100 border-b border-slate-200 text-base font-bold text-slate-700 uppercase tracking-wider">
                  <th class="p-4">Orden</th>
                  <th class="p-4">Fecha y Periodo</th>
                  <th class="p-4">Ubicación</th>
                  <th class="p-4">Práctica / Asignatura</th>
                  <th class="p-4">Profesor</th>
                  <th class="p-4">Estatus</th>
                  <th class="p-4 text-right">Acciones</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200 text-base">
                <template x-for="(item, index) in sortedListBookings" :key="item.id">
                  <tr class="hover:bg-slate-50/80 transition">
                    <td class="p-4 whitespace-nowrap font-bold text-slate-400">
                      <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 text-slate-800 text-base font-black border border-slate-200" x-text="'#' + (index + 1)"></span>
                      <span class="block text-xs font-normal text-slate-400 mt-0.5" x-text="formatCreatedAt(item.createdAt)"></span>
                    </td>
                    <td class="p-4 whitespace-nowrap">
                      <div class="font-bold text-slate-900" x-text="formatDisplayDate(item.date)"></div>
                      <div class="text-slate-500 font-medium text-sm" x-text="'Periodo ' + item.startPeriod + (item.durationPeriods > 1 ? ' al ' + (parseInt(item.startPeriod) + parseInt(item.durationPeriods) - 1) : '')"></div>
                    </td>
                    <td class="p-4">
                      <span class="text-sm font-bold px-2.5 py-1 rounded uppercase border" :class="getLabBadgeStyle(item.labType)" x-text="getDisplaySpace(item)"></span>
                    </td>
                    <td class="p-4">
                      <div class="font-bold text-slate-900 text-base" x-text="item.practiceName || 'Práctica General'"></div>
                      <div class="font-black text-sm uppercase" :class="getSubjectColorClass(item.subject)" x-text="item.subject"></div>
                      <div x-show="item.isIA" class="text-xs font-black text-brand-700 uppercase" x-text="'IA · ' + item.studentName"></div>
                    </td>
                    <td class="p-4">
                      <div class="text-slate-800 font-semibold flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full inline-block shrink-0" :style="'background-color:' + getTeacherColor(item.teacher)"></span>
                        <span x-text="item.teacher"></span>
                      </div>
                      <div class="text-sm text-slate-500" x-text="'Atiende: ' + (item.labTech || 'Sin indicar')"></div>
                    </td>
                    <td class="p-4 whitespace-nowrap">
                      <template x-if="item.isExtemp">
                        <span class="inline-flex items-center gap-1 text-sm font-bold px-3 py-1 rounded-full bg-brand-50 text-brand-800 border border-brand-200">
                          <i class="ph ph-warning-circle"></i> Extemporánea
                        </span>
                      </template>
                      <template x-if="!item.isExtemp">
                        <span class="inline-flex items-center gap-1 text-sm font-bold px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200">
                          <i class="ph ph-check-circle"></i> A Tiempo
                        </span>
                      </template>
                    </td>
                    <td class="p-4 text-right whitespace-nowrap">
                      <button @click="viewDetail(item)" class="text-slate-600 hover:text-slate-900 p-2 rounded-lg hover:bg-slate-100 transition"><i class="ph ph-eye text-xl"></i></button>
                      <button x-show="!isStudent || canEditOrDelete(item)" @click="printSingleBooking(item)" class="text-slate-600 hover:text-slate-900 p-2 rounded-lg hover:bg-slate-100 transition"><i class="ph ph-printer text-xl"></i></button>

                      <template x-if="canEditOrDelete(item)">
                        <div class="inline-block">
                          <button @click="editBooking(item)" class="text-slate-600 hover:text-brand-700 p-2 rounded-lg hover:bg-brand-50 transition"><i class="ph ph-pencil-simple text-xl"></i></button>
                          <button @click="deleteBooking(item.id)" class="text-rose-500 hover:text-rose-700 p-2 rounded-lg hover:bg-rose-50 transition"><i class="ph ph-trash text-xl"></i></button>
                        </div>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

      </main>

      <!-- MODAL FORMULARIO -->
      <div x-show="isModalOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
        <div @click.outside="closeModal()" class="bg-white rounded-2xl max-w-2xl w-full shadow-2xl border border-slate-200 overflow-hidden max-h-[90vh] flex flex-col">
          
          <div class="px-6 py-4 bg-brand-600 text-white flex justify-between items-center shrink-0 border-b border-brand-800">
            <div>
              <h2 class="text-xl font-black uppercase tracking-wide" x-text="(editingBookingId ? 'Editar ' : 'Agendar ') + (isStudent ? 'Internal Assessment' : 'Práctica')"></h2>
              <p class="text-base text-rose-100/90 font-medium" x-text="editingBookingId ? 'Modifica los datos de la solicitud' : 'Completa los datos de la solicitud'"></p>
            </div>
            <button @click="closeModal()" class="text-white/80 hover:text-white p-1 rounded-lg transition">
              <i class="ph ph-x text-2xl"></i>
            </button>
          </div>

          <form @submit.prevent="submitForm()" x-ref="modalForm" class="p-6 space-y-5 overflow-y-auto flex-1 text-base">

            <div>
              <label class="block text-base font-extrabold text-slate-800 uppercase tracking-wider mb-1.5">Nombre / Tema de la Práctica *</label>
              <input type="text" x-model="formData.practiceName" required placeholder="Ej. Observación de Mitosis y Meiosis, Titulación Ácido-Base..." class="w-full text-base font-semibold px-3.5 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 bg-white">
            </div>

            <div>
              <label class="block text-base font-extrabold text-slate-800 uppercase tracking-wider mb-1.5">Forma / Grado *</label>
              <select x-model="formData.grade" required class="w-full text-base font-bold px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 bg-white">
                <option value="" disabled>Selecciona...</option>
                <template x-for="g in ['F1','F2','F3','F4','F5','L6','U6']" :key="g"><option :value="g" x-text="g"></option></template>
              </select>
            </div>

            <div x-show="isStudent">
              <label class="block text-base font-extrabold text-slate-800 uppercase tracking-wider mb-1.5">Nombre del Alumno *</label>
              <input type="text" x-model="formData.studentName" :required="isStudent" placeholder="Nombre y apellido" class="w-full text-base font-semibold px-3.5 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 bg-white">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
              <div x-show="editingBookingId">
                <label class="block text-base font-bold text-slate-800 uppercase tracking-wider mb-1.5">Ubicación *</label>
                <select x-model="formData.labType" required class="w-full text-base font-bold px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 bg-white">
                  <option value="Laboratorio 26">Laboratorio 26</option>
                  <option value="Laboratorio 27">Laboratorio 27</option>
                  <option value="Laboratorio 28">Laboratorio 28</option>
                  <option value="Laboratorio 29">Laboratorio 29</option>
                  <option value="Laboratorio 30">Laboratorio 30</option>
                  <option value="Salón de clases">Salón de clases</option>
                </select>
              </div>

              <div x-show="editingBookingId && formData.labType === 'Salón de clases'" x-transition>
                <label class="block text-base font-bold text-brand-800 uppercase tracking-wider mb-1.5">Número / Nombre Salón *</label>
                <input type="text" x-model="formData.classroomNumber" :required="!!editingBookingId && formData.labType === 'Salón de clases'" placeholder="Ej. Salón 12, Aula A..." class="w-full text-base px-3 py-2 border border-brand-300 rounded-lg focus:ring-2 focus:ring-brand-600 bg-white font-bold">
              </div>

              <div :class="editingBookingId ? (formData.labType === 'Salón de clases' ? '' : 'sm:col-span-2') : 'sm:col-span-3'">
                <label class="block text-base font-bold text-slate-800 uppercase tracking-wider mb-1.5">Asignatura *</label>
                <select x-model="formData.subject" required class="w-full text-base font-bold px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 bg-white">
                  <option value="Biología">Biología </option>
                  <option value="Física">Física </option>
                  <option value="Química">Química </option>
                  <option value="Ciencias Integradas">Ciencias Integradas </option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1" x-text="isStudent ? 'Profesor que supervisa *' : 'Nombre del Profesor *'"></label>
                <input x-show="!isStudent" type="text" x-model="formData.teacher" :readonly="currentUser.role === 'teacher'" required class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 font-semibold bg-slate-50">
                <select x-show="isStudent" :required="isStudent" x-model="formData.teacher" class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 bg-white">
                  <option value="">Selecciona a tu profesor...</option>
                  <template x-for="u in usersList.filter(u => u.role === 'teacher')" :key="u.id"><option :value="u.name" x-text="u.name"></option></template>
                </select>
              </div>
              <div x-show="!isStudent">
                <label class="block text-base font-bold text-slate-700 mb-1">Laboratorista <span class="text-slate-400 font-normal">(Opcional)</span></label>
                <input type="text" x-model="formData.labTech" placeholder="Ej. Lic. Ana Morales" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 font-semibold">
              </div>
            </div>

            <div x-show="editingBookingId">
              <label class="block text-base font-bold text-slate-700 mb-1">Grupo</label>
              <input type="text" x-model="formData.group" placeholder="Ej. F3 A" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 font-semibold">

            <div x-show="!editingBookingId" class="space-y-2 bg-slate-50 p-4 rounded-xl border border-slate-200">

                    <input type="date" x-model="ss.date" @change="syncSession()" :required="!editingBookingId" class="flex-1 min-w-[150px] text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <select x-model="ss.startPeriod" @change="syncSession()" class="text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg bg-white"><template x-for="n in 8" :key="n"><option :value="String(n)" x-text="'Periodo ' + n"></option></template></select>
                    <select x-model="ss.durationPeriods" @change="syncSession()" class="text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg bg-white"><template x-for="n in 4" :key="n"><option :value="String(n)" x-text="n + (n === 1 ? ' periodo' : ' periodos continuos')"></option></template></select>

                  </div>
                  <div class="flex gap-2 items-center flex-wrap">
                    <select x-model="ss.labType" class="text-base font-bold px-3 py-2 border border-slate-300 rounded-lg bg-white">

                    <input type="text" x-show="ss.labType === 'Salón de clases'" x-model="ss.classroomNumber" placeholder="Salón (ej. Salón 12)" class="w-44 text-base font-bold px-3 py-2 border border-brand-300 rounded-lg bg-white">
                    <input type="text" x-model="ss.group" placeholder="Grupo (ej. F3 A)" class="w-40 text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg bg-white">
                  </div>
                </div>
              </template>
            </div>

            <div x-show="editingBookingId" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1">Fecha de Práctica *</label>
                <input type="date" x-model="formData.date" @change="validateRules()" :required="!!editingBookingId" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 font-semibold">
              </div>
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1">Periodo Inicial *</label>
                <select x-model="formData.startPeriod" @change="validateRules()" required class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 bg-white">
                  <option value="1">Periodo 1</option>
                  <option value="2">Periodo 2</option>
                  <option value="3">Periodo 3</option>
                  <option value="4">Periodo 4</option>
                  <option value="5">Periodo 5</option>
                  <option value="6">Periodo 6</option>
                  <option value="7">Periodo 7</option>
                  <option value="8">Periodo 8</option>
                </select>
              </div>
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1">Duración (Periodos) *</label>
                <select x-model="formData.durationPeriods" class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 bg-white">
                  <option value="1">1 Periodo</option>
                  <option value="2">2 Periodos continuos</option>
                  <option value="3">3 Periodos continuos</option>
                  <option value="4">4 Periodos continuos</option>
                </select>
              </div>
            </div>

            <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-3">
              <label class="flex items-center gap-3 cursor-pointer">

              </label>
              <p class="text-base text-slate-600 pl-8">
                Requisito institucional: Lo que se compra fuera debe pedirse el <strong>miércoles de la semana previa antes de las 12:00 PM</strong> (ej. práctica del 2 al 6 de noviembre: pedir el miércoles 28 de octubre).
              </p>

              <div x-show="formData.needsFreshMaterial" class="pt-3 border-t border-slate-200 space-y-3">
                <div class="flex justify-between items-center">
                  <label class="text-base font-bold text-amber-900 flex items-center gap-1.5 uppercase tracking-wider">
                    <i class="ph ph-plant text-amber-700 text-xl"></i>
                    <span>Lista Exclusiva de Material Fresco</span>
                  </label>
                  <button type="button" @click="addFreshMaterialRow()" class="text-base font-bold text-amber-900 hover:bg-amber-100 bg-amber-50 border border-amber-300 px-3 py-1 rounded-lg transition flex items-center gap-1">
                    <i class="ph ph-plus-bold"></i> Agregar Insumo
                  </button>
                </div>

                <div class="space-y-2">
                  <template x-for="(item, index) in formData.freshMaterialsList" :key="index">
                    <div class="flex gap-2 items-center">
                      <input type="text" x-model="item.name" placeholder="Ej. Hígado de pollo, hojas verdes..." class="flex-1 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                      <input type="text" x-model="item.quantity" placeholder="Cantidad / Detalle" class="w-40 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                      <button type="button" @click="removeFreshMaterialRow(index)" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg">
                        <i class="ph ph-trash text-xl"></i>
                      </button>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <div x-show="validationMessage.text" class="p-3.5 rounded-xl text-base font-medium flex items-start gap-2.5 border" :class="validationMessage.isValid ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-amber-50 text-amber-800 border-amber-200'">
              <i class="ph text-xl shrink-0 mt-0.5" :class="validationMessage.isValid ? 'ph-check-circle text-emerald-600' : 'ph-warning-circle text-amber-600'"></i>
              <span x-html="validationMessage.text"></span>
            </div>

            <div x-show="!isStudent" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1">Cantidad de Alumnos *</label>
                <input type="number" min="1" max="100" x-model="formData.studentsCount" required placeholder="Ej. 25" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 font-semibold">
              </div>
              <div>
                <label class="block text-base font-bold text-slate-700 mb-1">Organización del Grupo *</label>
                <select x-model="formData.groupFormat" required class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 bg-white">
                  <option value="Parejas">En Parejas</option>
                  <option value="Equipos">Por Equipos</option>
                  <option value="Individual">Individual</option>
                  <option value="Demostrativa / Plenaria">Demostrativa (Grupo Completo)</option>
                </select>
              </div>
              <div x-show="formData.groupFormat === 'Equipos'" x-transition class="sm:col-span-2">
                <label class="block text-base font-bold text-slate-700 mb-1">Número de Equipos *</label>
                <input type="number" min="1" max="50" x-model="formData.teamsCount" :required="formData.groupFormat === 'Equipos' && !isStudent" placeholder="Ej. 8" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-600 font-semibold">
              </div>
            </div>

            <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-2">
              <label class="block text-base font-bold text-slate-800 flex items-center gap-1.5 uppercase tracking-wider">
                <i class="ph ph-file-arrow-up text-brand-600 text-xl"></i>
                <span>Guía / Documento de Práctica <span class="text-slate-400 font-normal lowercase">(opcional)</span></span>
              </label>
              <input type="file" @change="handleFileUpload($event)" accept=".pdf,.doc,.docx,.png,.jpg" class="w-full text-base text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-base file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100">
              <p x-show="formData.fileName" class="text-base text-emerald-700 font-bold flex items-center gap-1 pt-1">
                <i class="ph ph-check-bold"></i> Archivo seleccionado: <span x-text="formData.fileName"></span>
              </p>
            </div>

            <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-2">
              <div class="flex justify-between items-center">
                <label class="text-base font-bold text-slate-800 flex items-center gap-1.5 uppercase tracking-wider">
                  <i class="ph ph-test-tube text-brand-600 text-xl"></i>
                  <span>Reactivos y Soluciones</span>
                </label>
                <button type="button" @click="addReagentRow()" class="text-base font-bold text-slate-700 hover:bg-slate-200 bg-white border border-slate-300 px-3 py-1 rounded-md transition flex items-center gap-1">
                  <i class="ph ph-plus-bold"></i> Agregar
                </button>
              </div>

              <div class="space-y-2">
                <template x-for="(item, index) in formData.reagentsList" :key="index">
                  <div class="flex gap-2 items-center">
                    <input type="text" x-model="item.name" :list="'invReact'" @input="onInvPick(item)" placeholder="Reactivo / Solución" class="flex-1 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <input type="text" x-model="item.concentration" placeholder="Concentración" class="w-32 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <input type="text" x-model="item.volume" placeholder="Volumen" class="w-32 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <span x-show="item.invId" class="text-xs font-bold whitespace-nowrap" :class="rowInfo(item, 'volume').bad ? 'text-rose-600' : 'text-emerald-700'" x-text="rowInfo(item, 'volume').text"></span>
                    <button type="button" @click="removeReagentRow(index)" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg">
                      <i class="ph ph-trash text-xl"></i>
                    </button>
                  </div>
                </template>
              </div>
            </div>

            <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-2">
              <div class="flex justify-between items-center">
                <label class="text-base font-bold text-slate-800 flex items-center gap-1.5 uppercase tracking-wider">
                  <i class="ph ph-list-plus text-brand-600 text-xl"></i>
                  <span>Material General y Equipo</span>
                </label>
                <button type="button" @click="addMaterialRow()" class="text-base font-bold text-slate-700 hover:bg-slate-200 bg-white border border-slate-300 px-3 py-1 rounded-md transition flex items-center gap-1">
                  <i class="ph ph-plus-bold"></i> Agregar
                </button>
              </div>

              <div class="space-y-2">
                <template x-for="(item, index) in formData.materialsList" :key="index">
                  <div class="flex gap-2 items-center">
                    <input type="text" x-model="item.name" :list="'invEquip'" @input="onInvPick(item)" placeholder="Material o Equipo (escribe para buscar en inventario)" class="flex-1 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <input type="text" x-model="item.quantity" placeholder="Cantidad" class="w-36 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <span x-show="item.invId" class="text-xs font-bold whitespace-nowrap" :class="rowInfo(item, 'quantity').bad ? 'text-rose-600' : 'text-emerald-700'" x-text="rowInfo(item, 'quantity').text"></span>
                    <button type="button" @click="removeMaterialRow(index)" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg">
                      <i class="ph ph-trash text-xl"></i>
                    </button>
                  </div>
                </template>
              </div>
            </div>

            <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-2">
              <div class="flex justify-between items-center">
                <label class="text-base font-bold text-slate-800 flex items-center gap-1.5 uppercase tracking-wider">
                  <i class="ph ph-paperclip text-brand-600 text-xl"></i>
                  <span>Material de Papelería</span>
                </label>
                <button type="button" @click="addStationeryRow()" class="text-base font-bold text-slate-700 hover:bg-slate-200 bg-white border border-slate-300 px-3 py-1 rounded-md transition flex items-center gap-1">
                  <i class="ph ph-plus-bold"></i> Agregar
                </button>
              </div>
              <div class="space-y-2">
                <template x-for="(item, index) in formData.stationeryList" :key="index">
                  <div class="flex gap-2 items-center">
                    <input type="text" x-model="item.name" placeholder="Ej. Plumones, hojas blancas, cinta..." class="flex-1 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <input type="text" x-model="item.quantity" placeholder="Cantidad" class="w-36 text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                    <button type="button" @click="removeStationeryRow(index)" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg"><i class="ph ph-trash text-xl"></i></button>
                  </div>
                </template>
              </div>
            </div>

            <template x-if="isModalOpen">
              <div>
                <datalist id="invEquip">
                  <template x-for="inv in inventory.filter(i => i.cat !== 'Reactivos')" :key="inv.id">
                    <option :value="inv.label" x-text="'Disp. ' + Math.max(availFor(inv.id, formData.date, formData.startPeriod, formData.durationPeriods, editingBookingId), 0) + '/' + inv.stock + ' ' + inv.unit"></option>
                  </template>
                </datalist>
                <datalist id="invReact">
                  <template x-for="inv in inventory.filter(i => i.cat === 'Reactivos')" :key="inv.id">
                    <option :value="inv.label" x-text="'Disp. ' + Math.max(availFor(inv.id, formData.date, formData.startPeriod, formData.durationPeriods, editingBookingId), 0) + ' ' + inv.unit"></option>
                  </template>
                </datalist>
              </div>
            </template>

            <div class="flex justify-end gap-3 pt-3 border-t border-slate-200 sticky bottom-0 bg-white py-2">
              <button type="button" @click="closeModal()" class="px-5 py-2.5 text-base font-bold text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancelar</button>
              <button type="submit" :disabled="isLoading" class="px-6 py-2.5 text-base font-black text-white bg-brand-600 hover:bg-brand-700 disabled:bg-slate-300 rounded-lg transition shadow-xs" x-text="isLoading ? 'Guardando...' : (editingBookingId ? 'Guardar Cambios' : 'Confirmar')"></button>
            </div>

          </form>
        </div>
      </div>

      <!-- MODAL PERFIL -->
      <div x-show="isProfileOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
        <div @click.outside="isProfileOpen = false" class="bg-white rounded-2xl max-w-3xl w-full shadow-2xl border border-slate-200 overflow-hidden max-h-[90vh] flex flex-col">
          <div class="px-6 py-4 bg-brand-600 text-white flex justify-between items-center shrink-0">
            <div>
              <h2 class="text-xl font-black uppercase tracking-wide">Mi Perfil</h2>
              <p class="text-base text-rose-100/90 font-medium" x-text="currentUser.name"></p>
            </div>
            <button @click="isProfileOpen = false" class="text-white/80 hover:text-white p-1"><i class="ph ph-x text-2xl"></i></button>
          </div>

          <div class="flex gap-2 px-6 pt-4 shrink-0">
            <button @click="profileTab = 'datos'" :class="profileTab === 'datos' ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-700'" class="px-4 py-2 rounded-lg text-base font-bold transition">Foto y contraseña</button>
            <button @click="profileTab = 'horario'" :class="profileTab === 'horario' ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-700'" class="px-4 py-2 rounded-lg text-base font-bold transition">Horario</button>
          </div>

          <div class="p-6 overflow-y-auto space-y-5 text-base">
            <!-- Foto y contraseña -->
            <div x-show="profileTab === 'datos'" class="space-y-6">
              <div class="flex items-center gap-5">
                <span class="w-24 h-24 rounded-full overflow-hidden border-4 border-slate-200 bg-slate-100 flex items-center justify-center text-3xl font-black text-slate-500 shrink-0">
                  <img x-show="myProfile.photo" :src="myProfile.photo" class="w-full h-full object-cover" alt="">
                  <span x-show="!myProfile.photo" x-text="initials"></span>
                </span>
                <div class="space-y-2">
                  <input type="file" accept="image/*" @change="handlePhoto($event)" class="text-base text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-md file:border-0 file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100">
                  <button x-show="myProfile.photo" @click="removePhoto()" class="text-sm font-bold text-rose-600 hover:underline">Quitar foto</button>
                </div>
              </div>

              <div x-show="!isStudent" class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-3">
                <h3 class="text-base font-black uppercase tracking-wider text-slate-800">Cambiar contraseña</h3>
                <input type="password" x-model="pw.current" placeholder="Contraseña actual" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                <input type="password" x-model="pw.next" placeholder="Nueva contraseña (mínimo 6 caracteres)" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                <input type="password" x-model="pw.confirm" placeholder="Confirmar nueva contraseña" class="w-full text-base px-3 py-2 border border-slate-300 rounded-lg bg-white">
                <button @click="changePassword()" class="px-5 py-2 text-base font-black text-white bg-brand-600 hover:bg-brand-700 rounded-lg">Actualizar contraseña</button>
              </div>
              <p x-show="isStudent" class="text-sm text-slate-500">El acceso de alumnos es compartido, por eso la contraseña solo la cambia el laboratorista.</p>
            </div>

            <!-- Horario -->
            <div x-show="profileTab === 'horario'" class="space-y-3">
              <div x-show="!isStudent" class="flex items-center gap-2 flex-wrap">
                <label class="text-base font-bold text-slate-700">Consultar horario de:</label>
                <select x-model="scheduleOwner" @change="loadSchedule()" class="text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg bg-white">
                  <template x-for="u in usersList.filter(u => u.role !== 'student')" :key="u.id">
                    <option :value="u.id" x-text="u.name + (u.id === profileKey ? ' (yo)' : '')"></option>
                  </template>
                </select>
              </div>
              <p class="text-sm text-slate-500" x-text="scheduleOwner === profileKey ? 'Escribe en cada casilla tu clase o actividad (ej. Bio 11A, Lab 26) y guarda.' : 'Horario en modo de solo lectura.'"></p>
              <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse min-w-[560px]">
                  <thead>
                    <tr>
                      <th class="p-2 bg-slate-100 border border-slate-200 w-20">Periodo</th>
                      <template x-for="d in ['Lun','Mar','Mié','Jue','Vie','Sáb']" :key="d"><th class="p-2 bg-slate-100 border border-slate-200" x-text="d"></th></template>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="p in 8" :key="p">
                      <tr>
                        <td class="p-2 border border-slate-200 font-black text-center bg-slate-50" x-text="p"></td>
                        <template x-for="d in 6" :key="d">
                          <td class="border border-slate-200 p-0"><input type="text" x-model="scheduleDraft[d + '-' + p]" :readonly="scheduleOwner !== profileKey" placeholder="—" class="w-full px-2 py-2 text-sm font-semibold bg-transparent focus:bg-brand-50 outline-none"></td>
                        </template>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <div x-show="scheduleOwner === profileKey" class="flex justify-end">
                <button @click="saveSchedule()" class="px-5 py-2 text-base font-black text-white bg-brand-600 hover:bg-brand-700 rounded-lg">Guardar horario</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- MODAL REPORTE GENERAL -->
      <div x-show="isPrintModalOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-200">
          <h3 class="text-lg font-black text-slate-900 uppercase tracking-wide">Generar Reporte PDF</h3>
          <p class="text-base text-slate-600">Selecciona el tipo de reporte e intervalo:</p>
          
          <div>
            <label class="block text-base font-bold text-slate-700 mb-1">Tipo de Reporte:</label>
            <select x-model="reportType" class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg mb-3">
              <option value="Diario">Reporte Diario</option>
              <option value="Semanal">Reporte Semanal</option>
              <option value="Mensual">Reporte Mensual</option>
            </select>

            <label class="block text-base font-bold text-slate-700 mb-1">Fecha Base:</label>
            <input type="date" x-model="printDate" class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg">

          <div class="flex justify-end gap-2 pt-2">
            <button @click="isPrintModalOpen = false" class="px-4 py-2 text-base font-bold text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
            <button @click="triggerPrintReport()" class="px-5 py-2 text-base font-black text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-xs">Generar PDF</button>
          </div>
        </div>
      </div>

      <!-- MODAL REPORTE MATERIAL FRESCO -->
      <div x-show="isFreshMaterialModalOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-200">
          <h3 class="text-lg font-black text-amber-900 flex items-center gap-2 uppercase tracking-wide">
            <i class="ph ph-plant text-amber-600 text-xl"></i> Reporte Material Fresco
          </h3>
          <p class="text-base text-slate-600">Genera la lista consolidada de insumos frescos para la semana:</p>
          
          <div>
            <label class="block text-base font-bold text-slate-700 mb-1">Semana del reporte:</label>
            <input type="date" x-model="freshMaterialPrintDate" class="w-full text-base font-semibold px-3 py-2 border border-slate-300 rounded-lg">
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <button @click="isFreshMaterialModalOpen = false" class="px-4 py-2 text-base font-bold text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
            <button @click="triggerFreshMaterialPrint()" class="px-5 py-2 text-base font-black text-white bg-amber-600 hover:bg-amber-700 rounded-lg shadow-xs">Generar Lista Insumos</button>
          </div>
        </div>
