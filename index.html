        mondayOf(dateStr) {
          const d = new Date(dateStr + 'T00:00:00');
          d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
          return this.localStr(d);
        },

        get isTechOwner() { const u = this.usersList.find(x => x.id === this.scheduleOwner); return !!u && u.role === 'admin'; },

        get schedWeekDates() {
          const m = new Date((this.schedWeek || this.mondayOf(this.localStr(new Date()))) + 'T00:00:00');
          return [0, 1, 2, 3, 4, 5].map(i => { const d = new Date(m); d.setDate(m.getDate() + i); return this.localStr(d); });
        },

        shiftSchedWeek(n) {
          const d = new Date(this.schedWeekDates[0] + 'T00:00:00');
          d.setDate(d.getDate() + n * 7);
          this.schedWeek = this.localStr(d);
        },

        assignedChips(d, p) {
          if (!this.isTechOwner) return [];
          const name = this.usersList.find(x => x.id === this.scheduleOwner).name, date = this.schedWeekDates[d - 1];
          return this.bookings.filter(b => b.labTech === name && b.date === date && p >= parseInt(b.startPeriod) && p <= parseInt(b.startPeriod) + parseInt(b.durationPeriods) - 1);
        },

        get weekLoads() {
          const dates = this.schedWeekDates;
          return this.usersList.filter(u => u.role === 'admin').map(u => ({ name: u.name, n: this.bookings.filter(b => b.labTech === u.name && dates.includes(b.date)).reduce((a, b) => a + parseInt(b.durationPeriods || 1), 0) }));
        },

        // Elige a la laboratorista disponible (su horario vacío en ese día/periodos) con menos carga semanal
        assignLabTech(x, excludeId) {
          const techs = this.usersList.filter(u => u.role === 'admin');
          const day = ((new Date(x.date + 'T00:00:00').getDay() + 6) % 7) + 1;
          const s0 = parseInt(x.startPeriod), e0 = s0 + parseInt(x.durationPeriods) - 1, wk = this.mondayOf(x.date);
          const pool = techs.map(u => {
            const sched = (this.profiles[u.id] || {}).schedule || {};
            let blocked = false;
            for (let p = s0; p <= e0; p++) if (day <= 6 && p <= 8 && String(sched[day + '-' + p] || '').trim()) blocked = true;
            const mine = this.bookings.filter(b => b.id !== excludeId && b.labTech === u.name);
            const overlap = mine.some(b => b.date === x.date && parseInt(b.startPeriod) <= e0 && parseInt(b.startPeriod) + parseInt(b.durationPeriods) - 1 >= s0);
            const weekLoad = mine.filter(b => this.mondayOf(b.date) === wk).reduce((a, b) => a + parseInt(b.durationPeriods || 1), 0);
            return { name: u.name, blocked, overlap: overlap ? 1 : 0, weekLoad, total: mine.length };
          }).filter(t => !t.blocked);
          if (!pool.length) return null;
          pool.sort((a, b) => a.overlap - b.overlap || a.weekLoad - b.weekLoad || a.total - b.total || a.name.localeCompare(b.name));
          return pool[0].name;
        },

// Asigna laboratorista a las prácticas (de esta semana en adelante) que aún no tienen una
        async autoAssignPending() {
          if (!this.currentUser || this.currentUser.role !== 'admin') return;
          const from = this.mondayOf(this.localStr(new Date()));
          const list = this.bookings.filter(b => b.date >= from && !b.labTech).sort((a, b) => (a.date + String(a.startPeriod).padStart(2, '0')).localeCompare(b.date + String(b.startPeriod).padStart(2, '0')));
          let n = 0;
          list.forEach(b => { const t = this.assignLabTech(b, b.id); if (t) { b.labTech = t; b.labTechAuto = true; n++; } });
          if (!n) return;
          await this.saveToCloud();
          Swal.fire({ toast: true, position: 'top-end', icon: 'success', timer: 5000, showConfirmButton: false, title: n + ' práctica(s) sin laboratorista fueron asignadas automáticamente' });
        },

        async reassignAuto() {
          const today = this.localStr(new Date());
          const list = this.bookings.filter(b => b.date >= today && (b.labTechAuto || !b.labTech)).sort((a, b) => (a.date + String(a.startPeriod).padStart(2, '0')).localeCompare(b.date + String(b.startPeriod).padStart(2, '0')));
          list.forEach(b => { b.labTech = ''; });
          let un = 0;
          list.forEach(b => { b.labTech = this.assignLabTech(b, b.id) || ''; b.labTechAuto = true; if (!b.labTech) un++; });
          await this.saveToCloud();
          Swal.fire({ icon: un ? 'warning' : 'success', title: 'Prácticas reasignadas', text: list.length + ' práctica(s) próximas revisadas' + (un ? '; ' + un + ' sin laboratorista disponible.' : '.') });
        },

        // Traslape: el mismo profesor (o el mismo alumno, en su IA) no puede tener dos prácticas a la misma hora
        conflictFor(x, excludeId) {
          const f = this.formData, ia = !!f.isIA;
          const key = this.norm(ia ? (f.ownerName || f.studentName) : f.teacher);
          if (!key || !x.date) return null;
          const old = excludeId ? this.bookings.find(b => b.id === excludeId) : null;
          if (old && old.date === x.date && String(old.startPeriod) === String(x.startPeriod) && String(old.durationPeriods) === String(x.durationPeriods)) return null;
          const s0 = parseInt(x.startPeriod), e0 = s0 + parseInt(x.durationPeriods || 1) - 1;
          return this.bookings.find(b => b.id !== excludeId && b.date === x.date && !!b.isIA === ia
            && this.norm(ia ? (b.ownerName || b.studentName) : b.teacher) === key
            && parseInt(b.startPeriod) <= e0 && parseInt(b.startPeriod) + parseInt(b.durationPeriods || 1) - 1 >= s0) || null;
        },

        conflictHtml(b, x) {
          const a = parseInt(b.startPeriod), z = a + parseInt(b.durationPeriods || 1) - 1;
          return (this.formData.isIA ? 'Ya tienes agendado tu IA' : '<b>' + this.esc(b.teacher) + '</b> ya tiene agendada la práctica') + ' «' + this.esc(b.practiceName || b.subject) + '» el ' + this.formatDisplayDate(b.date) + ' en el periodo ' + (z > a ? a + ' al ' + z : a) + ' (' + this.esc(this.getDisplaySpace(b)) + '), que se traslapa con el periodo ' + x.startPeriod + (parseInt(x.durationPeriods || 1) > 1 ? ' (' + x.durationPeriods + ' periodos)' : '') + '.';
        },

        selfOverlap(list) {
          for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
            const a = list[i], b = list[j];
            if (!a.date || a.date !== b.date) continue;
            const a0 = parseInt(a.startPeriod), a1 = a0 + parseInt(a.durationPeriods || 1) - 1, b0 = parseInt(b.startPeriod), b1 = b0 + parseInt(b.durationPeriods || 1) - 1;
            if (a0 <= b1 && b0 <= a1) return this.formatDisplayDate(a.date) + ': las filas ' + (i + 1) + ' y ' + (j + 1) + ' se traslapan';
          }
          return '';
        },

        isUnchangedSlot(x) {
          const o = this.editingBookingId ? this.bookings.find(b => b.id === this.editingBookingId) : null;
          return !!o && o.date === x.date && String(o.startPeriod) === String(x.startPeriod);
        },

        periodRange(p) { const t = PERIOD_TIMES[(parseInt(p) || 1) - 1] || PERIOD_TIMES[0]; return t[0] + ' - ' + t[1]; },

        periodStart(p) { return (PERIOD_TIMES[(parseInt(p) || 1) - 1] || PERIOD_TIMES[0])[0]; },

        evalRules(dateStr, startPeriod) {
          const now = new Date();
          const target = new Date(dateStr + 'T00:00:00');
          const m = this.toMin(this.periodStart(startPeriod));
          target.setHours(Math.floor(m / 60), m % 60);
          const messages = [];
          let isExtemp = false, deadlineText = '';
          const hours = (target - now) / 36e5;
          const blocked = hours < 24;
          if (hours < 48) { isExtemp = true; messages.push('se agendó con menos de 48 horas de anticipación'); }
          if (this.formData.needsFreshMaterial) {
            const d = new Date(dateStr + 'T00:00:00');
            const wed = new Date(d);
            wed.setDate(d.getDate() - ((d.getDay() + 6) % 7) - 5);
            wed.setHours(12, 0, 0, 0);
            deadlineText = wed.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }) + ' a las 12:00 PM';
            if (now > wed) { isExtemp = true; messages.push('el material fresco debía pedirse el ' + deadlineText); }
          }
          return { isExtemp, messages, deadlineText, blocked };
        },

        get liveBanner() {
          const now = new Date(this.nowTick), mins = now.getHours() * 60 + now.getMinutes();
          const today = this.localStr(now);
          let cur = null, next = null, toNext = null;
          PERIOD_TIMES.forEach((t, i) => {
            const a = this.toMin(t[0]), b = this.toMin(t[1]);
            if (mins >= a && mins < b) cur = i + 1;
            else if (a > mins && next === null) { next = i + 1; toNext = a - mins; }
          });
          const at = p => this.bookings.filter(b => b.date === today && p >= parseInt(b.startPeriod) && p <= parseInt(b.startPeriod) + parseInt(b.durationPeriods) - 1);
          return { today, cur, next, toNext, curItems: cur ? at(cur) : [], nextItems: next ? this.bookings.filter(b => b.date === today && parseInt(b.startPeriod) === next) : [] };
        },

        periodTag(p) {
          const L = this.liveBanner;
          const base = 'bg-slate-100 text-slate-800';
          if (this.dayDate !== L.today) return { cls: base, label: '' };
          if (L.cur === p) return { cls: 'bg-brand-600 text-white', label: ' · AHORA' };
          if (L.next === p) return { cls: 'bg-amber-100 text-amber-900', label: ' · SIGUIENTE (en ' + L.toNext + ' min)' };
          return { cls: base, label: '' };
        },

        isNowPeriod(p) {
          return this.liveBanner.cur === parseInt(p) && this.visibleDays.some(d => d.isToday);
        },

        unlockAudio() {
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            if (!this.audioCtx) this.audioCtx = new AC();
            if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
          } catch (e) {}
        },

        playAlertSound() {
          if (!this.soundOn) return;
          try {
            this.unlockAudio();
            const ctx = this.audioCtx;
            if (!ctx) return;
            [0, 0.4, 0.8].forEach(off => {
              const t = ctx.currentTime + off, o = ctx.createOscillator(), g = ctx.createGain();
              o.type = 'sine';
              o.frequency.setValueAtTime(880, t);
              o.frequency.setValueAtTime(660, t + 0.18);
              g.gain.setValueAtTime(0.0001, t);
              g.gain.exponentialRampToValueAtTime(0.4, t + 0.03);
              g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
              o.connect(g); g.connect(ctx.destination);
              o.start(t); o.stop(t + 0.36);
            });
          } catch (e) {}
        },

        toggleSound() {
          this.soundOn = !this.soundOn;
          localStorage.setItem('lancaster_sound', this.soundOn ? 'on' : 'off');
          if (this.soundOn) this.playAlertSound();
        },

        showPracticeAlert(title, items) {
          this.playAlertSound();
          const html = '<div style="text-align:left;font-size:15px">' + items.map(b =>
            '<div style="padding:8px 10px;margin:6px 0;border:1px solid #fecdd3;background:#fff1f2;border-radius:10px">' +
            '<b>' + this.esc(this.getDisplaySpace(b)) + '</b> — ' + this.esc(b.subject) + ': ' + this.esc(b.practiceName || 'Práctica General') +
            '<br><span style="color:#475569;font-size:13px">' + this.esc(b.teacher) +
            (b.isIA ? ' · IA: ' + this.esc(b.studentName) : '') +
            (b.grade ? ' · ' + this.esc(b.grade) : '') +
            (b.group ? ' · Grupo ' + this.esc(b.group) : '') +
            (b.labTech ? ' · Atiende: ' + this.esc(b.labTech) : '') + '</span></div>'
          ).join('') + '</div>';
          Swal.fire({ icon: 'warning', title, html, confirmButtonText: 'Entendido', confirmButtonColor: '#c8102e', width: 560 });
        },

        notifyNext() {
          if (!this.currentUser || Swal.isVisible()) return;
          const L = this.liveBanner;
          const now = new Date(this.nowTick), mins = now.getHours() * 60 + now.getMinutes();
          // Laboratoristas ven todas las prácticas; profesores y alumnos solo las suyas
          const mine = list => this.currentUser.role === 'admin' ? list : list.filter(b => this.canEditOrDelete(b));

          // 1) Aviso previo: faltan 10 min o menos para el siguiente periodo
          if (L.next && L.toNext <= 10) {
            const items = mine(L.nextItems), key = L.today + '-' + L.next + '-pre';
            if (items.length && !this.alerted[key]) {
              this.alerted[key] = true;
              this.showPracticeAlert('⏰ Periodo ' + L.next + ' inicia en ' + Math.max(L.toNext, 1) + ' min (' + this.periodStart(L.next) + ')', items);
              return;
            }
          }
          // 2) Aviso de inicio: el periodo acaba de comenzar
          if (L.cur && mins - this.toMin(this.periodStart(L.cur)) <= 5) {
            const items = mine(this.bookings.filter(b => b.date === L.today && parseInt(b.startPeriod) === L.cur)), key = L.today + '-' + L.cur + '-now';
            if (items.length && !this.alerted[key]) {
              this.alerted[key] = true;
              this.showPracticeAlert('🔔 Periodo ' + L.cur + ' comienza ahora', items);
            }
          }
        },

        showFull() { return !this.isStudent || (!!this.selectedBooking && this.canEditOrDelete(this.selectedBooking)); },

        get isStudent() { return this.currentUser?.role === 'student'; },

        localStr(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); },

        get focusDateObj() { return new Date(this.focusDate + 'T00:00:00'); },

        get currentWeekStartDate() {
          const d = this.focusDateObj;
          d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
          return d;
        },

        get visibleDays() {
          if (this.calendarMode !== 'day') return this.weekDays;
          const d = this.focusDateObj;
          return [{ dayName: d.toLocaleDateString('es-ES', { weekday: 'long' }), dateStr: this.focusDate, formattedDate: d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }), isToday: this.focusDate === this.localStr(new Date()) }];
        },

        get monthCells() {
          const f = this.focusDateObj, y = f.getFullYear(), m = f.getMonth();
          const last = new Date(y, m + 1, 0), cur = new Date(y, m, 1);
          cur.setDate(cur.getDate() - ((cur.getDay() + 6) % 7));
          const today = this.localStr(new Date()), cells = [];
          while (cur <= last) {
            for (let i = 0; i < 6; i++) {
              const d = new Date(cur); d.setDate(d.getDate() + i);
              const s = this.localStr(d);
              cells.push({ key: s, dateStr: s, day: d.getDate(), inMonth: d.getMonth() === m, isToday: s === today,
                items: this.bookings.filter(b => b.date === s && (this.selectedLabFilter === 'ALL' || b.labType === this.selectedLabFilter)) });
            }
            cur.setDate(cur.getDate() + 7);
          }
          return cells;
        },

        get weekDays() {
          const days = [];
          const start = this.currentWeekStartDate;
          const todayStr = this.localStr(new Date());
          const dayNames = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

          for (let i = 0; i < 6; i++) {
            const d = new Date(start);
            d.setDate(d.getDate() + i);
            const dateStr = this.localStr(d);
            days.push({
              dayName: dayNames[i],
              dateStr: dateStr,
              formattedDate: d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }),
              isToday: dateStr === todayStr
            });
          }
          return days;
        },

        get weekRangeText() {
          if (this.calendarMode === 'day') return this.focusDateObj.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
          if (this.calendarMode === 'month') return this.focusDateObj.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
          const start = this.currentWeekStartDate, end = new Date(start);
          end.setDate(end.getDate() + 5);
          return `${start.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })} - ${end.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' })}`;
        },

        navigate(offset) {
          const d = this.focusDateObj;
          if (this.calendarMode === 'day') d.setDate(d.getDate() + offset);
          else if (this.calendarMode === 'week') d.setDate(d.getDate() + offset * 7);
          else { d.setDate(1); d.setMonth(d.getMonth() + offset); }
          this.focusDate = this.localStr(d);
        },

        goToday() { this.focusDate = this.localStr(new Date()); },

        openDay(dateStr) { this.focusDate = dateStr; this.calendarMode = 'day'; },

        getBookingsForSlot(dateStr, period) {
          return this.bookings.filter(b => {
            if (b.date !== dateStr) return false;
            if (this.selectedLabFilter !== 'ALL' && b.labType !== this.selectedLabFilter) return false;
            const startP = parseInt(b.startPeriod);
            const durP = parseInt(b.durationPeriods);
            const endP = startP + durP - 1;
            return period >= startP && period <= endP;
          });
        },

        get filteredListBookings() {
          const okLab = b => this.selectedLabFilter === 'ALL' || b.labType === this.selectedLabFilter;
          if (this.calendarMode === 'month') return this.bookings.filter(b => b.date.startsWith(this.focusDate.slice(0, 7)) && okLab(b));
          const days = this.visibleDays.map(d => d.dateStr);
          return this.bookings.filter(b => days.includes(b.date) && okLab(b));
        },

        validateRules() {
          const list = this.editingBookingId ? [{ date: this.formData.date, startPeriod: this.formData.startPeriod, durationPeriods: this.formData.durationPeriods }] : (this.formData.sessions || []).filter(x => x.date);
          if (!list.length || !list[0].date) {
            this.validationMessage = { isValid: false, text: 'Seleccione una fecha para la práctica.' };
            return;
          }
          const bad = [], tooLate = [];
          let deadline = '';
          list.forEach(x => {
            const r = this.evalRules(x.date, x.startPeriod);
            if (r.blocked && !this.isUnchangedSlot(x)) tooLate.push(this.formatDisplayDate(x.date) + ' · Periodo ' + x.startPeriod);
            deadline = r.deadlineText || deadline;
            if (r.isExtemp) bad.push(this.formatDisplayDate(x.date) + ' (' + r.messages.join('; ') + ')');
          });
          this.formData.isExtemp = bad.length > 0;
          if (tooLate.length) {
            this.validationMessage = { isValid: false, text: '<strong>No se puede agendar:</strong> faltan menos de 24 horas para ' + tooLate.join(', ') + '. Elige otra fecha o periodo.' };
            return;
          }
          const clash = [];
          list.forEach(x => { const c = this.conflictFor(x, this.editingBookingId); if (c) clash.push(this.conflictHtml(c, x)); });
          const own = this.editingBookingId ? '' : this.selfOverlap(list);
          if (own) clash.push(own + ' (no puede haber dos prácticas del mismo profesor a la misma hora).');
          if (clash.length) {
            this.validationMessage = { isValid: false, text: '<strong>Traslape de horario:</strong> ' + clash.join('<br>') };
            return;
          }
          const dl = deadline ? ' Fecha límite para pedir material fresco: <strong>' + deadline + '</strong>.' : '';
          this.validationMessage = bad.length
            ? { isValid: true, text: '<strong>Práctica Extemporánea:</strong> ' + bad.join(' · ') + '.' + dl }
            : { isValid: true, text: '<strong>Solicitud a Tiempo:</strong> Cumple con la anticipación de 48 horas.' + dl };
        },

        openModal() {
          this.editingBookingId = null;
          this.formData = {
            practiceName: '',
            labType: 'Laboratorio 26',
            classroomNumber: '',
            teacher: this.currentUser.role === 'teacher' ? this.currentUser.name : '',
            labTech: '',
            subject: 'Biología',
            date: '',
            startPeriod: '1',
            durationPeriods: '1',
            needsFreshMaterial: false,
            freshMaterialsList: [{ name: '', quantity: '' }],
            studentsCount: '',
            groupFormat: 'Parejas',
            reagentsList: [{ name: '', concentration: '', volume: '' }],
            materialsList: [{ name: '', quantity: '' }],
            stationeryList: [{ name: '', quantity: '' }],
            referencesList: [{ name: '', url: '' }],
            group: '',
            sessions: [{ date: '', startPeriod: '1', durationPeriods: '1', labType: 'Laboratorio 26', classroomNumber: '', group: '' }],
            grade: '',
            teamsCount: '',

            isExtemp: false
          };
          if (this.isStudent) Object.assign(this.formData, { isIA: true, studentEmail: this.currentUser.email || '', studentName: this.currentUser.name, ownerName: this.currentUser.name, studentsCount: '1', groupFormat: 'Individual', teacher: '', labTech: '' });
          this.validationMessage = { isValid: false, text: '' };

            this.formData.materialsList = [{ name: '', quantity: '' }];

          if (!this.formData.freshMaterialsList || this.formData.freshMaterialsList.length === 0) {

        triggerPrintReport() {

              const d = new Date(b.date + 'T00:00:00');

        saveLabEmails() {

        },

        freshWeekRange(dateStr) {
          const base = new Date(dateStr + 'T00:00:00');
          const diff = base.getDate() - base.getDay() + (base.getDay() === 0 ? -6 : 1);
          const monday = new Date(base.setDate(diff)), saturday = new Date(monday);
          saturday.setDate(saturday.getDate() + 5);
          return { monday, saturday, start: this.localStr(monday), end: this.localStr(saturday) };

        freshEmailData() {
          const w = this.freshWeekRange(this.freshMaterialPrintDate);
          const list = this.bookings.filter(b => b.needsFreshMaterial && b.date >= w.start && b.date <= w.end)
            .sort((a, b) => (a.date + String(a.startPeriod).padStart(2, '0')).localeCompare(b.date + String(b.startPeriod).padStart(2, '0')));
          const fmt = d => d.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
          const range = 'del ' + fmt(w.monday) + ' al ' + fmt(w.saturday) + ' de ' + w.saturday.getFullYear();
          const lines = list.map(b => {
            const sp = parseInt(b.startPeriod), du = parseInt(b.durationPeriods) || 1;
            const endT = (PERIOD_TIMES[sp + du - 2] || PERIOD_TIMES[sp - 1] || ['', ''])[1];
            const mats = (b.freshMaterialsList && b.freshMaterialsList.length ? b.freshMaterialsList : b.materialsList || [])
              .filter(m => m.name && m.name.trim()).map(m => '   - ' + m.name + (m.quantity ? ' (' + m.quantity + ')' : ''));
            return '• ' + this.formatDisplayDate(b.date) + ' · ' + (du > 1 ? 'Periodos ' + sp + '-' + (sp + du - 1) : 'Periodo ' + sp) + ' (' + this.periodStart(sp) + ' - ' + endT + ') · ' + this.getDisplaySpace(b) + '\n' +
              '  ' + (b.practiceName || 'Práctica General') + ' — ' + b.subject + ' · ' + b.teacher + (b.isExtemp ? '  [SOLICITUD EXTEMPORÁNEA]' : '') + '\n' +
              '  Material fresco:\n' + (mats.length ? mats.join('\n') : '   - (sin detalle)');
          });
          const body = 'Hola laboratoristas,\n\nLes comparto el material fresco requerido para la semana ' + range + ':\n\n' + lines.join('\n\n') + '\n\nGracias.\nSaludos,\n' + this.currentUser.name;
          return { count: list.length, subject: 'Material fresco · semana ' + range, body };
        },

        sendFreshEmail(mode) {

          this.printHeaderDate = `${monday.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })} al ${saturday.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' })}`;

          this.activeFreshPrintBookings = this.bookings.filter(b => b.needsFreshMaterial && b.date >= startStr && b.date <= endStr);

          }, 300);
        },

        async submitForm() {
          const cleanMaterials = this.formData.materialsList.filter(m => m.name.trim() !== '');
          const cleanReagents = this.formData.reagentsList.filter(r => r.name.trim() !== '');
          const cleanFresh = this.formData.freshMaterialsList ? this.formData.freshMaterialsList.filter(f => f.name.trim() !== '') : [];
          this.formData.stationeryList = (this.formData.stationeryList || []).filter(x => x.name.trim() !== '');
          const badRef = (this.formData.referencesList || []).find(r => r.url.trim() && !this.safeUrl(r.url));
          if (badRef) { Swal.fire('Enlace no válido', 'Revisa el enlace de "' + (badRef.name || badRef.url) + '". Debe ser una dirección web (https://...).', 'warning'); return; }
          this.formData.referencesList = (this.formData.referencesList || []).filter(r => r.url.trim()).map(r => ({ name: r.name.trim(), url: this.safeUrl(r.url) }));
          if (this.formData.groupFormat !== 'Equipos') this.formData.teamsCount = '';

          const editing = !!this.editingBookingId;
          const editedId = this.editingBookingId;
          let sess;
          if (editing) {
            sess = [{ date: this.formData.date, startPeriod: this.formData.startPeriod, durationPeriods: this.formData.durationPeriods }];
          } else {
            sess = (this.formData.sessions || []).filter(x => x.date);
            if (!sess.length) { Swal.fire('Falta la fecha', 'Agrega al menos una fecha.', 'warning'); return; }
            if (this.isStudent && !this.formData.teacher) { Swal.fire('Falta el profesor', 'Selecciona al profesor que supervisa tu IA.', 'warning'); return; }
            if (sess.some(x => x.labType === 'Salón de clases' && !(x.classroomNumber || '').trim())) { Swal.fire('Falta el salón', 'Indica el número o nombre del salón.', 'warning'); return; }
          }

          const { sessions, ...base } = this.formData;
          const late = sess.filter(x => this.evalRules(x.date, x.startPeriod).blocked && !this.isUnchangedSlot(x));
          if (late.length) {
            Swal.fire({ icon: 'error', title: 'Fuera del plazo', html: 'Las prácticas deben agendarse con al menos 24 horas de anticipación:<br><b>' + late.map(x => this.formatDisplayDate(x.date) + ' · Periodo ' + x.startPeriod).join('<br>') + '</b>' });
            return;
          }
          const oldB = editing ? this.bookings.find(b => b.id === this.editingBookingId) : null;
          const oldU = oldB ? this.invUsage(oldB.materialsList, oldB.reagentsList) : {};
          const newU = this.invUsage(cleanMaterials, cleanReagents);

          const check = (x, id) => {
            const slot = [x.date, x.startPeriod, x.durationPeriods, id], out = [];
            for (const [iid, q] of Object.entries(newU)) {
              const it = this.inventory.find(v => v.id === iid);
              if (!it) continue;
              const avail = this.availFor(iid, ...slot);
              if (q > avail) {
                const h = it.kind === 'equipo' ? this.holders(iid, ...slot).map(v => `${this.esc(v.who)} (${v.q})`).join(', ') : '';
                out.push(`• <b>${this.esc(it.name)}</b>: pides ${q}, disponibles ${Math.max(avail, 0)} de ${it.stock} ${this.esc(it.unit)}${h ? '. Ya reservado por: ' + h : ''}`);
              }
            }
            return out;
          };
          const fail = (pr, x) => Swal.fire({ icon: 'warning', title: 'Existencias insuficientes', html: '<div style="text-align:left;font-size:15px"><b>' + this.formatDisplayDate(x.date) + ' · Periodo ' + x.startPeriod + '</b><br>' + pr.join('<br>') + '<br><br>Reduce la cantidad o cambia de fecha/periodo.</div>' });
          const techFor = (x, id) => {
            const cur = this.formData.labTech;
            const changed = !oldB || oldB.date !== x.date || String(oldB.startPeriod) !== String(x.startPeriod) || String(oldB.durationPeriods) !== String(x.durationPeriods);
            if (cur && !(editing && oldB && oldB.labTechAuto && cur === oldB.labTech && changed)) return { labTech: cur, labTechAuto: false };
            return { labTech: this.assignLabTech(x, id) || '', labTechAuto: true };
          };
          const full = (x, id, extra) => ({ ...base, ...extra, id, date: x.date, startPeriod: x.startPeriod, durationPeriods: x.durationPeriods, materialsList: cleanMaterials, reagentsList: cleanReagents, freshMaterialsList: cleanFresh, isExtemp: this.evalRules(x.date, x.startPeriod).isExtemp, status: 'Aprobada' });

          const made = [];
          if (editing) {
            const cf0 = this.conflictFor(sess[0], this.editingBookingId);
            if (cf0) { Swal.fire({ icon: 'error', title: 'Traslape de horario', html: this.conflictHtml(cf0, sess[0]) + '<br>Elige otro periodo u otra fecha.' }); return; }
            const pr = check(sess[0], this.editingBookingId);
            if (pr.length) { fail(pr, sess[0]); return; }
            const idx = this.bookings.findIndex(b => b.id === this.editingBookingId);
            if (idx !== -1) { this.applyUsage(oldU, -1); this.applyUsage(newU, 1); this.bookings[idx] = full(sess[0], this.editingBookingId, techFor(sess[0], this.editingBookingId)); }
          } else {
            const gid = Date.now();
            for (let i = 0; i < sess.length; i++) {
              const x = sess[i], id = gid + i;
              const cf = this.conflictFor(x, id);
              if (cf) {
                made.forEach(() => this.applyUsage(newU, -1));
                this.bookings = this.bookings.filter(b => !made.some(m => m.id === b.id));
                Swal.fire({ icon: 'error', title: 'Traslape de horario', html: this.conflictHtml(cf, x) + '<br>' + (sess.length > 1 ? 'No se guardó ninguna fecha.' : 'No se guardó la práctica.') + ' Elige otro periodo o fecha.' });
                return;
              }
              const pr = check(x, id);
              if (pr.length) {
                made.forEach(() => this.applyUsage(newU, -1));
                this.bookings = this.bookings.filter(b => !made.some(m => m.id === b.id));
                fail(pr, x); return;
              }
              const b = full(x, id, { ...techFor(x, id), createdAt: id, iaGroupId: gid, labType: x.labType, classroomNumber: x.labType === 'Salón de clases' ? x.classroomNumber : '', group: x.group || '' });
              this.bookings.push(b); this.applyUsage(newU, 1); made.push(b);
            }
          }

          await this.saveToCloud();
          this.closeModal();
          const saved = editing ? [this.bookings.find(b => b.id === editedId) || {}] : made;
          const pending = saved.filter(b => b.labTechAuto && !b.labTech);
          const techs = [...new Set(saved.map(b => b.labTech).filter(Boolean))];
          if (pending.length) {
            Swal.fire({ icon: 'warning', title: 'Agendada sin laboratorista', html: 'Según sus horarios, ninguna laboratorista está disponible el ' + pending.map(b => this.formatDisplayDate(b.date) + ' (P' + b.startPeriod + ')').join(', ') + '.<br>Podrás asignarla manualmente al editar la práctica.' });
          } else {
            Swal.fire({ icon: 'success', title: editing ? '¡Práctica Actualizada!' : (made.length > 1 ? '¡' + made.length + ' fechas agendadas!' : '¡Práctica Agendada!'), text: 'Los cambios se guardaron correctamente.' + (techs.length ? ' Atiende: ' + techs.join(', ') + '.' : ''), confirmColor: '#c8102e' });
          }
        },

        viewDetail(item) {
          this.selectedBooking = item;
        },

        async deleteBooking(id) {
          const targetItem = this.bookings.find(b => b.id === id);
          if (targetItem && !this.canEditOrDelete(targetItem)) {
            Swal.fire('Acceso denegado', 'No tienes permiso para eliminar las prácticas de otro profesor.', 'warning');
            return;
          }

          this.selectedBooking = null;
          Swal.fire({
            title: '¿Eliminar registro?',
            text: 'Esta acción no se puede deshacer.',
            icon: 'warning',
            showCancelButton: true,
            confirmColor: '#c8102e',
            cancelColor: '#64748b',
            confirmButtonText: 'Sí, eliminar',
            cancelButtonText: 'Cancelar'
          }).then(async (result) => {
            if (result.isConfirmed) {
              if (targetItem) this.applyUsage(this.invUsage(targetItem.materialsList, targetItem.reagentsList), -1);
              this.bookings = this.bookings.filter(b => b.id !== id);
              await this.saveToCloud();
              Swal.fire({
                icon: 'success',
                title: 'Eliminado',
                text: 'El registro ha sido eliminado.',
                confirmColor: '#c8102e'
              });
            }
          });
        },

esc(t) { return String(t ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); },

        get filteredInventoryAll() {
          const q = this.invSearch.toLowerCase();
          return this.inventory.filter(i => (this.invCat === 'ALL' || i.cat === this.invCat) && (i.label || i.name).toLowerCase().includes(q));
        },

        get filteredInventory() { return this.filteredInventoryAll.slice(0, 150); },

        groupText(b) {
          return (b.groupFormat === 'Equipos' || b.groupFormat === 'Equipos de 3-4') ? 'Equipos' + (b.teamsCount ? ' (' + b.teamsCount + ')' : '') : b.groupFormat;
        },

        addStationeryRow() {
          if (!this.formData.stationeryList) this.formData.stationeryList = [];
          this.formData.stationeryList.push({ name: '', quantity: '' });
        },

        removeStationeryRow(i) { this.formData.stationeryList.splice(i, 1); },

        onInvPick(item) {
          const inv = this.inventory.find(i => i.label === item.name);
          if (inv) { item.invId = inv.id; item.name = inv.name + (inv.desc ? ' — ' + inv.desc : ''); }
          else if (item.invId) { const cur = this.inventory.find(i => i.id === item.invId); if (!cur || !item.name.startsWith(cur.name)) item.invId = ''; }
        },

        relabel(list) {
          const seen = {};
          list.forEach(i => {
            const l = i.name + (i.desc ? ' — ' + i.desc : '') + (i.loc ? ' · ' + i.loc : '');
            seen[l] = (seen[l] || 0) + 1;
            i.label = seen[l] > 1 ? l + ' #' + seen[l] : l;
          });
          return list;
        },

        buildInventory(rec) {
          const d = (rec && rec.invDelta) || {}, edits = d.edits || {}, gone = new Set(d.removed || []);
          const list = SEED_INV.filter(r => !gone.has(r[0])).map(r => ({ id: r[0], name: r[1], desc: r[2], loc: r[3], cat: r[4], stock: r[5], unit: r[6], min: 0, kind: r[7], ...(edits[r[0]] || {}) }));
          const seen = new Set(list.map(i => i.id));
          (d.custom || []).concat(rec && Array.isArray(rec.inventory) ? rec.inventory : []).forEach(x => {
            if (!seen.has(x.id)) { seen.add(x.id); list.push({ cat: 'Otros', kind: 'equipo', desc: '', loc: '', min: 0, ...x }); }
          });
          return this.relabel(list);
        },

        makeInvDelta() {
          const F = ['name', 'desc', 'loc', 'cat', 'stock', 'unit', 'min', 'kind'];
          const seedMap = new Map(SEED_INV.map(r => [r[0], r]));
          const edits = {}, custom = [], present = new Set();
          this.inventory.forEach(i => {
            present.add(i.id);
            const r = seedMap.get(i.id);
            if (!r) { const o = { id: i.id }; F.forEach(k => o[k] = i[k]); custom.push(o); return; }
            const base = { name: r[1], desc: r[2], loc: r[3], cat: r[4], stock: r[5], unit: r[6], min: 0, kind: r[7] };
            const diff = {};
            F.forEach(k => { if (i[k] !== base[k]) diff[k] = i[k]; });
            if (Object.keys(diff).length) edits[i.id] = diff;
          });
          return { edits, custom, removed: SEED_INV.map(r => r[0]).filter(id => !present.has(id)) };
        },

        // Cantidades solicitadas por artículo del inventario (materiales + reactivos)
        invUsage(mats, reags) {
          const u = {};
          (mats || []).forEach(m => { const q = parseFloat(m.quantity); if (m.invId && q > 0) u[m.invId] = (u[m.invId] || 0) + q; });
          (reags || []).forEach(m => { const q = parseFloat(m.volume); if (m.invId && q > 0) u[m.invId] = (u[m.invId] || 0) + q; });
          return u;
        },

        // Solo los consumibles se descuentan; el equipo se reserva por fecha y periodo
        applyUsage(u, sign) {
          Object.entries(u).forEach(([id, q]) => {
            const it = this.inventory.find(i => i.id === id);
            if (it && it.kind === 'consumible') it.stock = +(it.stock - sign * q).toFixed(3);
          });
        },

        holders(invId, date, start, dur, excludeId) {
          const s0 = parseInt(start), e0 = s0 + parseInt(dur) - 1, out = [];
          this.bookings.forEach(b => {
            if (b.id === excludeId || b.date !== date) return;
            const bs = parseInt(b.startPeriod), be = bs + parseInt(b.durationPeriods) - 1;
            if (bs > e0 || be < s0) return;
            const q = this.invUsage(b.materialsList, [])[invId];
            if (q) out.push({ who: b.teacher, q });
          });
          return out;
        },

        availFor(invId, date, start, dur, excludeId) {
          const it = this.inventory.find(i => i.id === invId);
          if (!it) return Infinity;
          if (it.kind === 'consumible') {
            const old = this.bookings.find(b => b.id === excludeId);
            return it.stock + (old ? (this.invUsage(old.materialsList, old.reagentsList)[invId] || 0) : 0);
          }
          if (!date) return it.stock;
          return it.stock - this.holders(invId, date, start, dur, excludeId).reduce((a, h) => a + h.q, 0);
        },

        rowInfo(item, field) {
          const it = this.inventory.find(i => i.id === item.invId);
          if (!it) return { text: '', bad: false };
          const a = this.availFor(it.id, this.formData.date, this.formData.startPeriod, this.formData.durationPeriods, this.editingBookingId);
          const q = parseFloat(item[field]) || 0;
          return { text: (q > a ? '⚠ ' : '✔ ') + 'Disp. ' + Math.max(a, 0) + '/' + it.stock + ' ' + it.unit, bad: q > a };
        },

        async editInventoryItem(item) {
          const r = await Swal.fire({
            title: item ? 'Editar artículo' : 'Nuevo artículo',
            html: `<input id="iv-n" class="swal2-input" placeholder="Nombre" value="${this.esc(item?.name)}"><input id="iv-s" type="number" min="0" step="any" class="swal2-input" placeholder="Existencias" value="${this.esc(item?.stock)}"><input id="iv-u" class="swal2-input" placeholder="Unidad (pzas, mL, g...)" value="${this.esc(item?.unit)}"><input id="iv-m" type="number" min="0" class="swal2-input" placeholder="Mínimo para alerta" value="${this.esc(item?.min)}"><select id="iv-k" class="swal2-select"><option value="equipo" ${item?.kind !== 'consumible' ? 'selected' : ''}>Equipo (se devuelve)</option><option value="consumible" ${item?.kind === 'consumible' ? 'selected' : ''}>Consumible (se descuenta)</option></select>`,
            showCancelButton: true, confirmButtonText: 'Guardar', cancelButtonText: 'Cancelar',
            preConfirm: () => {
              const name = document.getElementById('iv-n').value.trim();
              if (!name) { Swal.showValidationMessage('Escribe un nombre'); return false; }
              return { name, stock: parseFloat(document.getElementById('iv-s').value) || 0, unit: document.getElementById('iv-u').value.trim(), min: parseFloat(document.getElementById('iv-m').value) || 0, kind: document.getElementById('iv-k').value };
            }
          });
          if (!r.isConfirmed) return;
          if (item) Object.assign(item, r.value); else this.inventory.push({ id: 'i' + Date.now(), cat: 'Otros', desc: '', loc: '', ...r.value });
          this.relabel(this.inventory);
          await this.saveToCloud();
        },

        async adjustStock(item) {
          const r = await Swal.fire({ title: item.name, input: 'number', inputLabel: 'Cantidad a sumar (negativa para restar)', inputAttributes: { step: 'any' }, showCancelButton: true, confirmButtonText: 'Aplicar' });
          if (!r.isConfirmed || !r.value) return;
          item.stock = +(item.stock + parseFloat(r.value)).toFixed(3);
          await this.saveToCloud();
        },

        async deleteInventoryItem(item) {
          const r = await Swal.fire({ title: '¿Eliminar artículo?', text: item.name, icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí, eliminar', cancelButtonText: 'Cancelar' });
          if (!r.isConfirmed) return;
          this.inventory = this.inventory.filter(i => i.id !== item.id);
          await this.saveToCloud();
        },

        // EQUIPOS
        canEditTeam(t) {
          if (this.currentUser.role === 'student') return this.norm(t.createdBy) === this.norm(this.currentUser.name);
          return this.selectedBooking && this.canEditOrDelete(this.selectedBooking);
        },

        async editTeam(b, t) {
          const bk = this.bookings.find(x => x.id === b.id);
          if (!bk) return;
          const stu = this.currentUser.role === 'student';
          const r = await Swal.fire({
            title: t ? 'Editar equipo' : 'Agregar equipo',
            html: `<input id="tm-n" class="swal2-input" placeholder="Nombre del equipo" value="${this.esc(t?.name)}"><textarea id="tm-m" class="swal2-textarea" placeholder="Integrantes (uno por línea)">${this.esc(t ? t.members.join('\n') : (stu ? this.currentUser.name : ''))}</textarea>`,
            showCancelButton: true, confirmButtonText: 'Guardar', cancelButtonText: 'Cancelar',
            preConfirm: () => {
              const name = document.getElementById('tm-n').value.trim();
              const members = document.getElementById('tm-m').value.split(/\n|,/).map(x => x.trim()).filter(Boolean);
              if (!name || !members.length) { Swal.showValidationMessage('Indica el nombre del equipo y al menos un integrante'); return false; }
              return { name, members };
            }
          });
          if (!r.isConfirmed) return;
          bk.teams = bk.teams || [];
          if (t) { const tt = bk.teams.find(x => x.id === t.id); if (tt) Object.assign(tt, r.value); }
          else bk.teams.push({ id: 't' + Date.now(), createdBy: this.currentUser.name, ...r.value });
          this.selectedBooking = bk;
          await this.saveToCloud();
        },

        async deleteTeam(b, t) {
          const bk = this.bookings.find(x => x.id === b.id);
          if (!bk) return;
          const r = await Swal.fire({ title: '¿Eliminar equipo?', text: t.name, icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí, eliminar', cancelButtonText: 'Cancelar' });
          if (!r.isConfirmed) return;
          bk.teams = (bk.teams || []).filter(x => x.id !== t.id);
          this.selectedBooking = bk;
          await this.saveToCloud();
        },

        formatDisplayDate(dateStr) {
          if (!dateStr) return '';
          const parts = dateStr.split('-');
          const d = new Date(parts[0], parts[1] - 1, parts[2]);
          return d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
        },

        exportCSV() {
          if (this.bookings.length === 0) {
            Swal.fire('Sin datos', 'No hay registros para exportar', 'info');
            return;
          }

          let csvContent = "data:text/csv;charset=utf-8,ID_Orden,Timestamp,Nombre_Practica,Ubicacion,Profesor,Laboratorista,Materia,Fecha,Periodo_Inicio,Duracion_Periodos,Alumnos,Formato,Material_Fresco,Extemporanea,Estado\n";
          this.sortedListBookings.forEach(b => {
            const space = b.labType === 'Salón de clases' ? b.classroomNumber : b.labType;
            csvContent += `${b.id},"${this.formatCreatedAt(b.createdAt)}","${b.practiceName || ''}","${space}","${b.teacher}","${b.labTech || ''}","${b.subject}",${b.date},${b.startPeriod},${b.durationPeriods},${b.studentsCount},"${b.groupFormat}",${b.needsFreshMaterial ? 'SI' : 'NO'},${b.isExtemp ? 'SI' : 'NO'},${b.status}\n`;
          });

          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", `bitacora_laboratorios_${new Date().toISOString().split('T')[0]}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }
      };
    }
  </script>
</body>
